            --log dist/native-timeout-diagnostic/observer-self-test-launch.log \
            --report dist/native-timeout-diagnostic/observer-self-test-launch-report.json \
            -- python3 scripts/native-observer-self-test.py \
            --directory dist/native-timeout-diagnostic/observer-self-test --expected-source "$GITHUB_SHA"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist/native-timeout-diagnostic/observer-self-test')
          report = json.loads((root/'self-test-report.json').read_text())
          required = ('diagnosticOnly', 'realSwiftPM', 'ancestryVerified',
              'separateXCTestProcessGroupObserved', 'stackIdentityVerified', 'wrongBirthRejected',
              'wrongIdentitySignalRejected', 'normalExitVerified', 'cancellationVerified',
              'timeoutRetirementVerified', 'cleanupConfirmed', 'allOwnedTargetsRetired', 'temporaryPackageRemoved')
          if not (report.get('status') == 'passed' and report.get('sourceCommit') == os.environ['GITHUB_SHA']
                  and report.get('installerAcceptance') is False and report.get('censusUncertain') is False
                  and report.get('originalNativeProcessSeconds') == 420
                  and all(report.get(key) is True for key in required)
                  and [case['name'] for case in report['scenarios']] == ['normal', 'cancellation', 'timeout']
                  and all(case['cleanupConfirmed'] for case in report['scenarios'])
                  and [case['fixtureSignalPolicy'] for case in report['scenarios']] == ['unchanged', 'ignore-own-SIGTERM', 'ignore-own-SIGTERM']
                  and all(9 in case['retirement']['targets'][0]['signals'] for case in report['scenarios'][1:])):
              raise SystemExit('Real SwiftPM observer self-test is incomplete; product work is forbidden')
          package = Path(report['temporaryPackagePath'])
          if package.exists() or Path.cwd().resolve() in package.parents:
              raise SystemExit('Temporary self-test package was not isolated and retired')
          expected = {'Package.swift', 'Tests/ObserverSelfTestTests/ObserverOwnershipTests.swift'}
          if set(report['fixtureSources']) != expected:
              raise SystemExit('Self-test source inventory differs')
          for name, identity in report['fixtureSources'].items():
              path = root/'fixture-source'/name
              if (not path.is_file() or path.is_symlink() or path.stat().st_size != identity['bytes']
                      or hashlib.sha256(path.read_bytes()).hexdigest() != identity['sha256']):
                  raise SystemExit('Archived real XCTest fixture identity differs')
          PYTHON
      - name: Build production pinned native codec dependencies without packaging
        id: dependencies
        timeout-minutes: 15
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 840
          --log dist/native-timeout-diagnostic/dependencies.log --report dist/native-timeout-diagnostic/dependencies-report.json
          -- python3 scripts/build-native-codecs.py --arch arm64
      - name: Compile production debug app
        id: app_build
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/native-timeout-diagnostic/debug-build.log --report dist/native-timeout-diagnostic/debug-build-report.json
          -- swift build --product PicShot
      - name: Compile exact native tests
        id: test_build
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/native-timeout-diagnostic/test-build.log --report dist/native-timeout-diagnostic/test-build-report.json
          -- swift build --build-tests
      - name: Compile dedicated codec helper for unchanged lifecycle tests
        id: helper_build
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/native-timeout-diagnostic/helper-build.log --report dist/native-timeout-diagnostic/helper-build-report.json
          -- swift build --product PicShotCodecHelper
      - name: Preserve full native discovery and exact four-process inventory
        id: discovery
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/native-timeout-diagnostic/native-test-discovery.log --report dist/native-timeout-diagnostic/native-test-discovery-report.json -- swift test list --skip-build
          python3 scripts/native-test-shards.py plan --inventory dist/native-timeout-diagnostic/native-test-discovery.log --source "$GITHUB_SHA" --process-count "$NATIVE_TEST_PROCESS_COUNT" --output dist/native-timeout-diagnostic/native-tests-plan.json
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          root = Path('dist/native-timeout-diagnostic')
          plan = native.checked_plan(root/'native-tests-plan.json', os.environ['GITHUB_SHA'])
          inventory = plan['discoveredTests']
          digest = hashlib.sha256(('\n'.join(inventory)+'\n').encode()).hexdigest()
          expected = ['b1a7d85cfd0b7ab017786761a81d6f424b88c8bae39f747d7c74f1debe0e3cad',
                      'd5985b5ecf1a096560428f65e272720a854e62342c73564b5d0ea6b2bc19b434',
                      'e2b53ebb3259864939ca5ff8026fc4c36bc32e26fe4ac90799c801490c0537dc',
                      'c7ad58f2d3b4085fe2d314585887ee81c42b45a0c51aa4a14d0a782a31036c11']
          shard_digests = [hashlib.sha256(('\n'.join(shard['tests'])+'\n').encode()).hexdigest() for shard in plan['shards']]
          if not (len(inventory) == 1785 and len({case.split('/')[0] for case in inventory}) == 203
                  and digest == '58e9fa791e2b711c49decd229e6f67438e38c9fc7ddccd8832da4524004e7bae'
                  and plan['selectedTests'] == inventory and plan['selectionRegex'] == ''
                  and plan['processCount'] == 4 and plan['timeoutSecondsPerProcess'] == 420
                  and [shard['index'] for shard in plan['shards']] == [0, 1, 2, 3] and shard_digests == expected):
              raise SystemExit('Native discovery or four-process inventory/order differs from source137/138')
          (root/'inventory-identity.json').write_text(json.dumps(dict(
              status='passed', diagnosticOnly=True, installerAcceptance=False, sourceCommit=os.environ['GITHUB_SHA'],
              referenceProductCommit='6dca7272e4484fc3a2309bd566c65bbf049a606d',
              referenceInventoryCommit='d0365c101e21fa85d9a6b9538db7bf5aeb1f2d69',
              methodCount=len(inventory), classCount=203, canonicalInventorySHA256=digest,
              processOrder=[0, 1, 2, 3], processMethodCounts=[len(shard['tests']) for shard in plan['shards']],
              processInventorySHA256=shard_digests, timeoutSecondsPerProcess=420), indent=2)+'\n')
          PYTHON
      - name: Require a clean native process boundary before baseline
        id: baseline_preflight
        timeout-minutes: 1
