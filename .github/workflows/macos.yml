          dist/editable-product-resource-installed/PicShot.app/Contents/MacOS/PicShot
          dist/editable-product-resource-installed/PicShot.app/Contents/Resources/build-info.json
          docs/editable-product-resource.md
          scripts/editable-product-resource.sh
          scripts/launch-editable-product.swift
          scripts/launch-editable-component.swift
          scripts/launch-smoke-app.swift
          scripts/check-editable-product-resource.py
          scripts/check-editable-components.py
          scripts/verify-editable-product-pixels.swift
