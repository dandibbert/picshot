        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Decode-${{ contains(github.event.head_commit.message || '', '[decode-exit-latch]') && 'Exit-Latch' || contains(github.event.head_commit.message || '', '[decode-timing-v3]') && 'Timing-V3' || 'Large' }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
