        id: baseline_preflight
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import importlib.util, json, os, resource, subprocess, tempfile
          from pathlib import Path
          source = Path.cwd().resolve()
          if (source != Path(os.environ['GITHUB_WORKSPACE']).resolve()/'native-product145'
                  or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=20).strip()
                      != 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'
                  or subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True, timeout=20).strip()
                      != '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'
                  or subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], timeout=20).strip()):
              raise SystemExit('Product source changed before the directly owned launch')
          with tempfile.TemporaryFile() as output, tempfile.TemporaryFile() as errors:
              def limits():
                  resource.setrlimit(resource.RLIMIT_FSIZE, (64*1024, 64*1024))
              result = subprocess.run(['/bin/ps', '-ax', '-o', 'pid=,comm='], stdin=subprocess.DEVNULL,
                  stdout=output, stderr=errors, timeout=5, check=False, preexec_fn=limits,
                  env={**os.environ, 'COMMAND_MODE': 'unix2003', 'LC_ALL': 'C'})
              output.seek(0); errors.seek(0)
              raw, error = output.read(64*1024+1), errors.read(64*1024+1)
          if result.returncode != 0 or len(raw) > 64*1024 or len(error) > 64*1024:
              raise SystemExit('Bounded read-only leftover observation failed; refusing launch')
          rows = raw.decode().splitlines()
          if len(rows) > 4096:
              raise SystemExit('Leftover observation exceeded its row cap')
          matches = []
          for row in rows:
              pid, comm = row.strip().split(None, 1)
              if not pid.isdigit() or int(pid) <= 0:
                  raise SystemExit('Invalid PID/comm observation')
              name = Path(comm).name
              if name.startswith('PicShot') or name in {'swift', 'swift-frontend', 'swift-package', 'swift-test', 'xctest', 'sample'} or '.xctest/' in comm:
                  matches.append(dict(pid=int(pid), comm=comm))
          Path('dist/native-direct-xctest/baseline-leftover-veto.json').write_text(json.dumps(dict(
              status='failed' if matches else 'passed', sourceCommit='f991c23aaa60469db0e2dc77cb94198d0dc74c08',
              observerCommit=os.environ['GITHUB_SHA'], suspiciousProcesses=matches, observedRowCount=len(rows),
              timeoutSeconds=5, outputCapBytes=65536, rowCap=4096, priorProcessesTerminatedByThisCheck=False,
              ownershipInferred=False, rootSamplerRetirementProvedByThisCheck=False,
              scope='Supplementary point-in-time PID/comm name veto only; absence does not prove descendant or global cleanliness'), indent=2)+'\n')
          if matches:
              raise SystemExit('Known app/test/helper/sampler remains; refusing overlapping direct launch')
          PYTHON
