name: Native macOS build and verification
on:
  push:
    branches: ['feat/**']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picshot-${{ github.ref }}-${{ contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && 'intel154-fresh-diagnostic' || contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && 'native-timeout-diagnostic' || contains(github.event.head_commit.message || '', '[installed-diagnostic]') && 'installed-diagnostic' || contains(github.event.head_commit.message || '', '[editable-product-resource]') && contains(github.event.head_commit.message || '', '[editable-documents]') && 'editable-product-resource' || contains(github.event.head_commit.message || '', '[seed-render-crop]') && 'seed-render-crop' || contains(github.event.head_commit.message || '', '[effect-context]') && 'effect-context' || contains(github.event.head_commit.message || '', '[renderer-scope-controls]') && 'renderer-scope-controls' || contains(github.event.head_commit.message || '', '[renderer-storage]') && 'renderer-storage' || contains(github.event.head_commit.message || '', '[drawing-pair]') && 'drawing-pair' || contains(github.event.head_commit.message || '', '[editable-observation]') && 'editable-observation' || contains(github.event.head_commit.message || '', '[callout-retirement]') && 'callout-retirement' || contains(github.event.head_commit.message || '', '[editable-documents]') && 'editable-documents' || contains(github.event.head_commit.message || '', '[multiwindow-memory]') && 'multiwindow-memory' || contains(github.event.head_commit.message || '', '[recording-wait]') && 'recording-wait' || contains(github.event.head_commit.message || '', '[manual-hash]') && 'manual-hash' || contains(github.event.head_commit.message || '', '[scroll-memory]') && 'scroll-memory' || contains(github.event.head_commit.message || '', '[decode-exit-latch]') && 'decode-exit-latch' || contains(github.event.head_commit.message || '', '[decode-timing-v3]') && 'decode-timing-v3' || contains(github.event.head_commit.message || '', '[decode-large]') && 'decode-large' || contains(github.event.head_commit.message || '', '[pin-workflows]') && 'pins-010' || contains(github.event.head_commit.message || '', '[intel-only]') && 'intel-05' || 'current' }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && !contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && !contains(github.event.head_commit.message || '', '[installed-diagnostic]') && !(contains(github.event.head_commit.message || '', '[editable-product-resource]') && contains(github.event.head_commit.message || '', '[editable-documents]')) && !contains(github.event.head_commit.message || '', '[seed-render-crop]') && !contains(github.event.head_commit.message || '', '[effect-context]') && !contains(github.event.head_commit.message || '', '[renderer-scope-controls]') && !contains(github.event.head_commit.message || '', '[renderer-storage]') && !contains(github.event.head_commit.message || '', '[drawing-pair]') && !contains(github.event.head_commit.message || '', '[callout-retirement]') && !contains(github.event.head_commit.message || '', '[editable-observation]') }}
jobs:
  runner-check:
    if: ${{ contains(github.event.head_commit.message || '', '[runner-only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Record exact runner source and native environment
        timeout-minutes: 1
        run: |
          mkdir -p dist/runner-contract
          python3 - <<'PYTHON'
          import json, os, platform, sys
          from pathlib import Path
          Path('dist/runner-contract/identity.json').write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'], 'architecture': platform.machine(),
              'macOS': platform.mac_ver(), 'Python': sys.version,
              'observerCommand': ['/bin/ps', '-x', '-g', '<owned-PGID>', '-o', 'pid=,pgid=,stat='],
              'observerEnvironment': {'COMMAND_MODE': 'unix2003', 'LC_ALL': 'C'},
              'observerSubprocessSeconds': 0.5, 'productAcceptance': False
          }, indent=2) + '\n')
          PYTHON
      - name: Verify bounded cleanup and cancellation on native macOS
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/runner-contract/tests.log
      - name: Verify the same contracts with Python assertions disabled
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 -O -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/runner-contract/tests-optimized.log
      - name: Repeat the exact previously failed cmake version observation
        timeout-minutes: 1
        run: |
          for sample in 1 2 3 4 5; do
            python3 scripts/run-bounded-command.py --timeout-seconds 600 --log "dist/runner-contract/cmake-$sample.log" --report "dist/runner-contract/cmake-$sample.json" -- cmake --version
          done
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          for sample in range(1, 6):
              r = json.loads(Path(f'dist/runner-contract/cmake-{sample}.json').read_text())
              if not (r['status'] == r['termination_reason'] == 'exited' and r['exit_code'] == r['child_returncode'] == 0
                      and r['timeout_seconds'] == 600 and not r['log_truncated'] and not r['sigterm_sent'] and not r['sigkill_sent']):
                  raise SystemExit('Incomplete cmake wrapper outcome')
              p = r['group_observation']
              if not (p['backend'] == 'darwin-ps-pgrp' and p['timeout_seconds'] == 0.5 and p['count'] > 0
                      and p['failures'] == 0 and not p['atomic_snapshot'] and p['total_seconds'] >= p['max_seconds'] >= 0):
                  raise SystemExit('Incomplete targeted group observation')
          PYTHON
      - name: Preserve native process-group evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Runner-Contract-${{ matrix.runner }}-${{ github.sha }}
          path: dist/runner-contract/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && !contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && !contains(github.event.head_commit.message || '', '[installed-diagnostic]') && (!contains(github.event.head_commit.message || '', '[gif-attribution]') || contains(github.event.head_commit.message || '', '[verify-installers]')) && !contains(github.event.head_commit.message || '', '[gif-timing]') && !contains(github.event.head_commit.message || '', '[codec-build]') && !contains(github.event.head_commit.message || '', '[codec-attribution]') && !contains(github.event.head_commit.message || '', '[runner-only]') && !contains(github.event.head_commit.message || '', '[scroll-memory]') && !contains(github.event.head_commit.message || '', '[manual-hash]') && !contains(github.event.head_commit.message || '', '[recording-wait]') && !contains(github.event.head_commit.message || '', '[multiwindow-memory]') && !contains(github.event.head_commit.message || '', '[callout-retirement]') && !contains(github.event.head_commit.message || '', '[editable-documents]') && !contains(github.event.head_commit.message || '', '[editable-observation]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message || '', '[intel-only]') && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    # Retain the prior 90-minute full validation allowance plus the independent
    # 55-minute installed-default gate, two 4-minute portable contract steps,
    # and seven minutes for cleanup and evidence publication overhead.
    # Intel adds 14 minutes to each four-process native stage: 160 + 14 + 14 = 188.
    # ARM retains its prior 160-minute allowance and 16/30-minute native stages.
    # Individual test, product, cancellation and smoke deadlines stay unchanged.
    # Two exact pin regressions add 16 minutes without reducing any prior gate allowance.
    # ARM: 160 + 16 = 176; Intel: 188 + 16 = 204.
    timeout-minutes: ${{ matrix.arch == 'x86_64' && 204 || 176 }}
    env:
      # Subdivide exhaustive ARM processes; preserve focused isolation.
      NATIVE_TEST_PROCESS_COUNT: '4'
      FOCUSED_TEST_PROCESS_COUNT: ${{ matrix.arch == 'x86_64' && '4' || '2' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test bounded CI command runner and annotation evidence checker
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v
          python3 -m unittest discover -s scripts/tests -p test_recording_input_ui_contract.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_recording_transport_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_recording_input_export_contract.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_annotation_details_report.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_scroll_manual_resource_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_manual_hash_comparison.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_multiwindow_memory_comparison.py -v
          python3 -m unittest discover -s scripts/tests -p test_multiwindow_resource_smoke_selection.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_editable_annotation_report.py -v
      - name: Check installed drawing default product and source contracts
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p dist
          for picshot_contract_pattern in '*drawing*.py' test_check_editable_product_resource.py test_editable_product_source_binding.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p "$picshot_contract_pattern" -v 2>&1 | tee -a dist/installed-default-contracts.log
          done
      - name: Check installed default contracts with Python assertions disabled
        timeout-minutes: 4
        run: |
          set -o pipefail
          for picshot_contract_pattern in '*drawing*.py' test_check_editable_product_resource.py test_editable_product_source_binding.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p "$picshot_contract_pattern" -v 2>&1 | tee -a dist/installed-default-contracts-optimized.log
          done
      - name: Package signed native app for early pixel review
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Render native UI from installed ZIP before slow verification
        run: |
          set -o pipefail
          bash scripts/ui-preview.sh 2>&1 | tee dist/ui-preview.log
      - name: Upload early native UI preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-UI-${{ matrix.arch }}-${{ github.sha }}
          path: dist/evidence/ui/
          if-no-files-found: ignore
          retention-days: 14
      - name: Measure codec and image backing in fresh installed processes
        timeout-minutes: 8
        run: |
          set -o pipefail
          bash scripts/codec-attribution.sh 2>&1 | tee dist/codec-attribution.log
          bash scripts/image-backing-attribution.sh 2>&1 | tee dist/image-backing-attribution.log
      - name: Upload early backing observations before remaining installer gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Backing-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/codec-attribution.log
            dist/image-backing-attribution.log
            dist/evidence/codec-attribution/
            dist/evidence/image-backing/
          if-no-files-found: ignore
          retention-days: 14
      # Keep compilation outside the eight-minute execution gates. Inner
      # deadlines leave time for process cleanup and report/log publication.
      - name: Compile debug app
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/debug-build.log --report dist/debug-build-report.json
          -- swift build --product PicShot
      - name: Upload debug compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Debug-Compile-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/debug-build.log
            dist/debug-build-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile native tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/test-build.log --report dist/test-build-report.json
          -- swift build --build-tests
      - name: Build dedicated native codec helper for actual lifecycle tests
        run: swift build --product PicShotCodecHelper
      - name: Plan exhaustive and focused native test processes
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_native_test_shards.py -v
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/native-test-discovery.log --report dist/native-test-discovery-report.json -- swift test list --skip-build
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --process-count "$NATIVE_TEST_PROCESS_COUNT" --output dist/native-tests-plan.json
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --process-count "$FOCUSED_TEST_PROCESS_COUNT" --selection-regex 'DrawingRaster|EditableProductResource|EditableProductRetirement|EditableComponent|PendingCapture|CaptureRecoveryPolicy|PinEditableAdmission|EditableAnnotation|EditableCapture|AnnotationEditing|CaptureAspectRatio|CaptureRatio|MultiWindow|ImageOutputDecoration|EditorOutput|PinOriginalCurrent|ManualScroll|ScrollPreview|ScrollSequencePreview|AnnotationFreehand|AnnotationTextLine|NumberedCallout|AutomaticMosaic|RepeatedRegion|AutomaticPinOCR|PinOCR|TextResultSourceSelection|PinWorkflow|LaTeXPin|PinLaTeX|PinGroup|PinDesktop|EditorToolbarHierarchy|SaveWorkflow|OwnedVideoExportStage|ImageBacking|Codec|NativeExport|AnimatedWebP|WebPContainer|RecordingWebP|CapturePreset|CaptureElement|ImageExport|RecognizedBarcode|BarcodeVision|PinBarcode|PinExport|TextResultBarcode|AnnotationPath|Scroll.*Sequence|ScrollStitcher|PinText|RecognizedText|Recognition|GIF|AnnotationEffectsTests|AnnotationEffectsPreviewTests|RecordingInput|RecordingHotKey|RecordingTransport|RecordingCommandCoordinator|SettingsAndMenuTests|RecordingCameraTests|RecordingCompositionTests|RecordingOverlayControlTests|RecordingCompositionSmokeTests|RecordingRecovery|VideoTrimTests|RecordingPauseTests|LocalInferenceResourceTests|LocalInferenceServiceTests|InferenceTestSynchronizationTests' --output dist/focused-tests-plan.json
      - name: Reproduce the exact pin Apply regression before broader native gates
        # Method first, then its four-method class. Each keeps 420s native,
        # 5s TERM grace and 8MiB log cap: 2 * (420s + 10s cleanup) + 60s = 920s.
        timeout-minutes: 16
        run: |
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, math, os, subprocess, sys, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          root = Path('dist/evidence/pin-apply-regression')
          root.mkdir(parents=True, exist_ok=True)
          source = os.environ['GITHUB_SHA']
          overhead_start, native_wait_seconds = time.monotonic(), 0.0
          method = 'PicShotTests.PinAnchoredEditingTests/testApplyCommitsOnlyOnceAndCancelLeavesPinPixelsUntouched'
          class_ids = [
              'PicShotTests.PinAnchoredEditingTests/testAnchoredEditorKeepsZoomPanAndImageAtExactScreenCoordinates',
              method,
              'PicShotTests.PinAnchoredEditingTests/testExplicitHideInvalidatesLateCloseAndNeverResurrectsPin',
              'PicShotTests.PinAnchoredEditingTests/testGroupSwitchClosesAnchoredSurfacesWithoutReopeningHiddenSession']
          record = dict(schemaVersion=1, status='running', sourceCommit=source, cells=[],
              expectedOrder=['method', 'class'], sameProcessAsFullSuite=False,
              scope='Exact corrected pin method, then its unchanged four-method class; overlapping coverage is not additive',
              runnerCleanupScope='Original bounded runner owned process group; detached/global process absence is not proven')
          def remaining_overhead():
              remaining = 60 - (time.monotonic() - overhead_start - native_wait_seconds)
              native.need(remaining > 0, 'Regression setup and replay exceeded their 60-second allowance')
              return remaining
          def digest(path):
              remaining_overhead()
              native.need(path.is_file() and not path.is_symlink(), 'Identity input is not a regular file')
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def source_identity():
              native.need(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=min(10, remaining_overhead())).strip() == source,
                  'Regression source differs from candidate commit')
              native.need(not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], timeout=min(10, remaining_overhead())).strip(),
                  'Regression tracked checkout changed')
              native.need(digest(Path('Tests/PicShotTests/PinAnchoredEditingTests.swift')) ==
                  'bd60e0bfe5f6231a87f8934de3841101d014d80cbd57c5e28613083696164c42', 'Pin regression fixture differs from reviewed bytes')
              for name, expected in (
                  ('scripts/native-test-shards.py', '797e5ddaf62b140dc60775fd5ddc267b2da1ffb0d21f6537fbf4fb9124387380'),
                  ('scripts/run-bounded-command.py', 'ef85307a6227a0d99641b17c75e2aa625ae7344376fbcb3ec1af1c5be7e2d5d2')):
                  native.need(digest(Path(name)) == expected, 'Original native planner/runner changed')
          try:
              source_identity()
              plan_path = Path('dist/native-tests-plan.json')
              plan = native.checked_plan(plan_path, source)
              inventory = plan['discoveredTests']
              native.need(len(inventory) == 1897 and len({case.split('/')[0] for case in inventory}) == 213
                  and hashlib.sha256(('\n'.join(inventory)+'\n').encode()).hexdigest() ==
                      '57360d46e241f23de466cb09e0e8cdcd55197fbd3ad93be82f229b0557546075'
                  and plan['selectedTests'] == inventory and plan['selectionRegex'] == ''
                  and plan['processCount'] == 4 and plan['timeoutSecondsPerProcess'] == 420
                  and [len(shard['tests']) for shard in plan['shards']] == [504, 426, 479, 488],
                  'Complete native inventory or original process grouping changed')
              native.need([case for case in inventory if case.startswith('PicShotTests.PinAnchoredEditingTests/')] == class_ids,
                  'Pin class inventory differs from the four original methods')
              record.update(planSHA256=digest(plan_path), discoveredCount=1897, discoveredClassCount=213,
                  discoverySHA256=digest(Path('dist/native-test-discovery.log')),
                  fixtureSHA256=digest(Path('Tests/PicShotTests/PinAnchoredEditingTests.swift')))
              for label, expected in (('method', [method]), ('class', class_ids)):
                  source_identity()
                  pattern = native.command_pattern(expected)
                  native.need([case for case in inventory if native.re.fullmatch(pattern, case)] == expected,
                      'Regression filter differs from exact discovery selection')
                  command = native.expected_command(dict(filter=pattern))
                  log_path, runner_path = root/(label+'.log'), root/(label+'-runner.json')
                  cell = dict(label=label, status='running', sourceCommit=source, expectedIDs=expected,
                      command=command, timeoutSeconds=420, graceSeconds=5, maxLogBytes=8388608)
                  record['cells'].append(cell)
                  (root/(label+'-selection.json')).write_text(json.dumps(cell, indent=2)+'\n')
                  waiting_from = time.monotonic()
                  try:
                      result = subprocess.run([sys.executable, 'scripts/run-bounded-command.py',
                          '--timeout-seconds', '420', '--grace-seconds', '5', '--max-log-bytes', '8388608',
                          '--log', str(log_path), '--report', str(runner_path), '--', *command], check=False)
                  finally:
                      native_wait_seconds += time.monotonic() - waiting_from
                  cell['wrapperExitCode'] = result.returncode
                  runner = json.loads(native.bounded_text(runner_path, 1024*1024))
                  native.need(result.returncode == 0 and type(runner['schema_version']) is int and runner['schema_version'] == 1
                      and runner['status'] == runner['termination_reason'] == 'exited'
                      and type(runner['child_returncode']) is int and type(runner['exit_code']) is int
                      and runner['child_returncode'] == runner['exit_code'] == 0, 'Native regression did not exit successfully')
                  native.need(runner['command'] == command and runner['timeout_seconds'] == 420
                      and runner['grace_seconds'] == 5 and runner['max_log_bytes'] == 8388608
                      and runner['log_truncated'] is False and runner['descendant_cleanup'] is False
                      and runner['sigterm_sent'] is False and runner['sigkill_sent'] is False
                      and runner['cancel_signal'] is None and not runner.get('cleanup_errors') and not runner.get('error'),
                      'Regression command, native cap, output or cleanup evidence differs')
                  observation = runner['group_observation']
                  native.need(observation['backend'] == 'darwin-ps-pgrp' and observation['timeout_seconds'] == 0.5
                      and type(observation['count']) is int and observation['count'] > 0
                      and type(observation['failures']) is int and observation['failures'] == 0
                      and observation['atomic_snapshot'] is False, 'Original bounded group observation is uncertain')
                  native.need(type(runner['pid']) is int and runner['pid'] > 0
                      and type(runner['duration_seconds']) in (int, float) and math.isfinite(runner['duration_seconds'])
                      and 0 <= runner['duration_seconds'] < 430, 'Invalid native identity or cleanup duration')
                  log = native.bounded_text(log_path, native.MAX_LOG_BYTES)
                  native.need(runner['log_bytes'] == runner['output_bytes'] == len(log.encode()), 'Raw native output length differs')
                  passed, skipped = native.case_results(log, expected)
                  native.need(passed == expected and skipped == [], 'Regression cases did not all pass without skips')
                  source_identity()
                  cell.update(status='passed', passedCount=len(passed), skippedCount=0, passedIDs=passed,
                      logSHA256=digest(log_path), runnerSHA256=digest(runner_path), durationSeconds=runner['duration_seconds'])
                  (root/(label+'-report.json')).write_text(json.dumps(cell, indent=2)+'\n')
              record.update(status='passed', overheadSeconds=60-remaining_overhead())
          except Exception as error:
              record.update(status='failed', error=f'{type(error).__name__}: {error}')
              if record['cells'] and record['cells'][-1]['status'] == 'running':
                  record['cells'][-1].update(status='failed', error=record['error'])
              raise
          finally:
              (root/'regression-report.json').write_text(json.dumps(record, indent=2)+'\n')
          PYTHON
      - name: Reproduce recording packet and panel lifetime regressions
        # Additive early reproduction; both IDs still execute in the unchanged
        # focused and exhaustive gates. Original 420s process caps are retained.
        timeout-minutes: 16
        run: |
          set -o pipefail
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --process-count 2 --selection-regex '^PicShotTests\.(RecordingInputExportTests/testAuthoredInputTrimPreservesAllSelectedPixelsAndPacketBoundaries|RecordingCommandCoordinatorTests/testExpandCollapseAndDisplayChangesRetainOneOwnerWithoutClosingSession)$' --output dist/recording-regression-plan.json
          execution_status=0
          for shard in 0 1; do
            python3 scripts/native-test-shards.py run --plan dist/recording-regression-plan.json --expected-source "$GITHUB_SHA" --index "$shard" --directory dist/evidence/recording-018-regression || execution_status=1
          done
          python3 scripts/native-test-shards.py check --plan dist/recording-regression-plan.json --expected-source "$GITHUB_SHA" --directory dist/evidence/recording-018-regression --output dist/recording-regression-report.json
          test "$execution_status" -eq 0
      - name: Upload test compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Test-Compile-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/test-build.log
            dist/test-build-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check annotation, GIF, recording durability and inference boundaries
        # Intel: 4 * (420s command + 10s cleanup allowance) + 60s stage overhead
        # = 1780s within 30 minutes. ARM keeps two processes within 16 minutes.
        timeout-minutes: ${{ matrix.arch == 'x86_64' && 30 || 16 }}
        run: |
          set -o pipefail
          execution_status=0
          {
            shard_failed=0
            for ((shard = 0; shard < FOCUSED_TEST_PROCESS_COUNT; shard++)); do
              python3 scripts/native-test-shards.py run --plan dist/focused-tests-plan.json --expected-source "$GITHUB_SHA" --index "$shard" --directory dist/focused-test-shards || shard_failed=1
            done
            test "$shard_failed" -eq 0
          } 2>&1 | tee dist/critical-tests.log || execution_status=$?
          python3 scripts/native-test-shards.py check --plan dist/focused-tests-plan.json --expected-source "$GITHUB_SHA" --directory dist/focused-test-shards --output dist/critical-tests-report.json
          test "$execution_status" -eq 0
      - name: Upload focused native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Focused-Tests-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/critical-tests.log
            dist/critical-tests-report.json
            dist/focused-tests-plan.json
            dist/native-test-discovery.log
            dist/native-test-discovery-report.json
            dist/focused-test-shards/
          if-no-files-found: ignore
          retention-days: 14
      - name: Recover actual abruptly terminated synthetic recording from installed app
        timeout-minutes: 4
        run: |
          set -o pipefail
          bash scripts/recording-recovery-smoke.sh 2>&1 | tee dist/recording-recovery.log
      - name: Test native modules
        # Both architectures have four 420s processes; 4 * 430s + 60s = 1780s.
        # Discovery has its own unchanged 2-minute stage; aggregation is included here.
        timeout-minutes: 30
        run: |
          set -o pipefail
          execution_status=0
          {
            shard_failed=0
            for ((shard = 0; shard < NATIVE_TEST_PROCESS_COUNT; shard++)); do
              python3 scripts/native-test-shards.py run --plan dist/native-tests-plan.json --expected-source "$GITHUB_SHA" --index "$shard" --directory dist/native-test-shards || shard_failed=1
            done
            test "$shard_failed" -eq 0
          } 2>&1 | tee dist/test.log || execution_status=$?
          python3 scripts/native-test-shards.py check --plan dist/native-tests-plan.json --expected-source "$GITHUB_SHA" --directory dist/native-test-shards --output dist/test-report.json
          test "$execution_status" -eq 0
      - name: Upload full native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Native-Tests-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/test.log
            dist/test-report.json
            dist/native-tests-plan.json
            dist/native-test-discovery.log
            dist/native-test-discovery-report.json
            dist/native-test-shards/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate native inference with approved pinned original model fixtures
        run: |
          set -o pipefail
          python3 scripts/fetch-model-fixtures.py 2>&1 | tee dist/model-download.log
          python3 scripts/SmartErase-fetch-fixture.py 2>&1 | tee dist/erase-model-download.log
          export PICSHOT_ERASE_MODEL_DIR="$PWD/.build/model-fixtures/erase"
          export PICSHOT_FORMULA_MODEL_DIR="$PWD/.build/model-fixtures/formula"
          export PICSHOT_TEST_TABLE_MODEL_DIR="$PWD/.build/model-fixtures/table"
          export PICSHOT_TEST_ML_HELPER="$(swift build --show-bin-path)/PicShotMLHelper"
          swift build --product PicShotMLHelper
          swift test --skip-build --filter 'FormulaEngineTests|RecordedModelOutputTests|SmartEraseEngineTests' 2>&1 | tee dist/model-inference.log
      - name: Install and launch both formats, render native UI, measure repeated cycles
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee dist/smoke.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-QA-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/*-report.json
            dist/*-plan.json
            dist/native-test-shards/
            dist/focused-test-shards/
            dist/evidence/
          retention-days: 14
      - name: Check split installer transfer budgets
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          # Four files per uncompressed artifact ZIP; reserve 64 KiB for its
          # archive headers so each upload remains below the 32 MiB transfer cap.
          budget = 32 * 1024 * 1024 - 64 * 1024
          for extension in ("zip", "dmg"):
              installers = list(Path("dist").glob(f"PicShot-*.{extension}"))
              if len(installers) != 1:
                  raise SystemExit(f"Expected one {extension} installer, found {len(installers)}")
              installer = installers[0]
              metadata = installer.with_suffix(".build-info.json")
              files = (installer, Path(str(installer) + ".sha256"),
                       metadata, Path(str(metadata) + ".sha256"))
              total = sum(path.stat().st_size for path in files)
              print(f"{extension.upper()} artifact input: {total} bytes; budget: {budget}")
              if total >= budget:
                  raise SystemExit(f"{extension.upper()} artifact exceeds transfer budget")
          PYTHON
      - name: Upload ZIP installer and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-macos-${{ matrix.arch }}-ZIP-${{ github.sha }}
          path: |
            dist/PicShot-*.zip
            dist/PicShot-*.zip.sha256
            dist/PicShot-*.build-info.json
            dist/PicShot-*.build-info.json.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload DMG installer and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-macos-${{ matrix.arch }}-DMG-${{ github.sha }}
          path: |
            dist/PicShot-*.dmg
            dist/PicShot-*.dmg.sha256
            dist/PicShot-*.build-info.json
            dist/PicShot-*.build-info.json.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  codec-dependencies:
    if: ${{ contains(github.event.head_commit.message || '', '[codec-build]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test pinned dependency policy and bounded process runner
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build exact official native codecs and run genuine C encode/decode tests
        timeout-minutes: 30
        run: |
          mkdir -p dist
          set -o pipefail
          python3 scripts/build-native-codecs.py --arch ${{ matrix.arch }} --jobs 4 2>&1 | tee dist/native-codecs.log
      - name: Preserve codec diagnostics and complete notices even on failure
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          base = Path('.build/native-codecs')
          target = Path('dist/codec-evidence'); target.mkdir(parents=True, exist_ok=True)
          for name in ('logs', 'evidence'):
              if (base / name).is_dir(): shutil.copytree(base / name, target / name, dirs_exist_ok=True)
          for path in base.glob('build-attempt-*.json'): shutil.copy2(path, target / path.name)
          for prefix in [base / 'install', *base.glob('install-*.staging')]:
              if not prefix.is_dir(): continue
              dest = target / prefix.name; dest.mkdir(exist_ok=True)
              for name in ('native-build.json', 'native-selftest-dependencies.txt'):
                  if (prefix / name).is_file(): shutil.copy2(prefix / name, dest / name)
              if (prefix / 'licenses').is_dir(): shutil.copytree(prefix / 'licenses', dest / 'licenses', dirs_exist_ok=True)
          PYTHON
      - name: Upload native dependency evidence without installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Codec-Dependencies-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/native-codecs.log
            dist/codec-evidence/
          if-no-files-found: warn
          retention-days: 14

