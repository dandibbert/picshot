                          == '58e9fa791e2b711c49decd229e6f67438e38c9fc7ddccd8832da4524004e7bae',
                          'Native inventory differs from the original 1785 methods plus the exact 13 reviewed additions')
              discovery = json.loads(native.bounded_text(Path('dist/native-test-discovery-report.json'), 1024*1024))
              def checked(report, seconds, command, log):
                  native.need(report['status'] == report['termination_reason'] == 'exited'
                              and report['exit_code'] == report['child_returncode'] == 0
                              and report['timeout_seconds'] == seconds and report['command'] == command
                              and report['log_bytes'] == len(log.encode()) and not report['log_truncated']
                              and not report['sigterm_sent'] and not report['sigkill_sent'] and not report.get('cleanup_errors'),
                              'Native inventory or focused process is incomplete')
              checked(discovery, 60, ['swift', 'test', 'list', '--skip-build'], raw)
              command = ['swift', 'test', '--skip-build', '--filter', native.command_pattern(expected)]
              record.update(discoveredCount=len(inventory), discoveredClasses=205, selectedTests=expected,
                  addedMethods=added, command=command, inventorySHA256=hashlib.sha256(raw.encode()).hexdigest())
              write()
              result = subprocess.run([sys.executable, 'scripts/run-bounded-command.py', '--timeout-seconds', '420',
                  '--log', 'dist/retirement-gif-native.log', '--report', 'dist/retirement-gif-native-report.json', '--', *command])
              record['wrapperReturnCode'] = result.returncode
              report = json.loads(native.bounded_text(Path('dist/retirement-gif-native-report.json'), 1024*1024))
              log = native.bounded_text(Path('dist/retirement-gif-native.log'), native.MAX_LOG_BYTES)
              native.need(result.returncode == 0, 'Focused native wrapper failed; preserve the original outcome')
              checked(report, 420, command, log)
              passed, skipped = native.case_results(log, expected)
              native.need(len(passed) == 32 and not skipped, 'Every exact focused native method must execute and pass without skips')
              record.update(status='passed', passedTests=passed, skippedTests=skipped,
                  logSHA256=hashlib.sha256(log.encode()).hexdigest())
          except BaseException as error:
              record.update(status='failed', error=str(error))
              raise
          finally:
              write()
          PYTHON
      - name: Fetch only approved pinned original model fixtures
