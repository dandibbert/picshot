              (205, 'editable-annotations-functional'), (207, 'recording-transport'),
              (209, 'portable-settings'), (210, 'annotation-preferences'), (211, 'pin-management')]
        per_format = [(71, 'native-launch'), (72, 'native-report-assertions'), (194, 'recording-exports'),
              (195, 'recording-transport'), (196, 'portable-settings'), (197, 'annotation-preferences'),
              (198, 'pin-management'), (199, 'capture-output'), (200, 'effect-output-failure'),
              (202, 'multiwindow-resources'), (204, 'pin-ocr-full'), (205, 'automatic-mosaic-full'),
              (206, 'annotation-details-full'), (207, 'pin-workflows'), (208, 'manual-scroll'),
              (210, 'editable-annotations-resources'), (212, 'editable-annotations-functional')]
        plans = {'native_ui': [('ui', line, name) for line, name in ui],
            'installed_smoke': [('ui', 35, 'installed-format-identity')] +
                [(fmt, line, name) for fmt in ('zip', 'dmg') for line, name in per_format
                 if not (fmt == 'dmg' and line in (202, 210)) and not (fmt == 'zip' and line == 212)] +
                [('dmg', 218, 'zip-installed-default-product')]}
        records = {}
        for stage, plan in plans.items():
            filename = 'ui-preview' if stage == 'native_ui' else 'smoke'
            script = 'ui-preview.sh' if stage == 'native_ui' else 'smoke.sh'
            report_path, log_path = Path('dist/'+filename+'-report.json'), Path('dist/'+filename+'.log')
            outer = json.loads(report_path.read_text()) if report_path.is_file() else {}
            text = log_path.read_text(errors='replace') if log_path.is_file() else ''
            pattern = re.compile(r'^\+PICSHOT_BLOCKED_TRACE:scripts/'+re.escape(script)+r':([0-9]+):(ui|zip|dmg):', re.MULTILINE)
            trace = [(mode, int(line)) for line, mode in pattern.findall(text)]
            complete = (outer.get('exit_code') is not None and not outer.get('log_truncated', True))
            success = outer.get('exit_code') == 0
            observed = {(mode, line) for mode, line in trace}
            seen_indices = [index for index, (mode, line, name) in enumerate(plan) if (mode, line) in observed]
            last = max(seen_indices, default=-1)
            cells = []
            for index, (mode, line, name) in enumerate(plan):
                seen = (mode, line) in observed
                if seen and (index < last or success):
                    outcome = 'success'
                elif seen:
                    # A wrapper interruption or substitution failure need not implicate the checker.
                    outcome = 'unestablished'
                elif not outer:
                    outcome = 'not-run' if not text else 'unestablished'
                elif complete and not success and index > last:
                    outcome = 'not-run'
                else:
                    outcome = 'unestablished'
                cells.append(dict(stage=name, format=mode, sourceLine=line, observedCommand=seen, outcome=outcome))
            if success and any(cell['outcome'] != 'success' for cell in cells):
                raise ValueError('Successful original script is missing expected fixed command traces')
            records[stage] = dict(originalScript='scripts/'+script, originalCommandExitCode=outer.get('child_returncode'),
                boundedExitCode=outer.get('exit_code'), lastObservedPlannedStage=(plan[last][2] if last >= 0 else None), logTruncated=outer.get('log_truncated'), traceComplete=complete,
                cells=cells, unrunStages=[cell for cell in cells if cell['outcome']=='not-run'],
                unestablishedStages=[cell for cell in cells if cell['outcome']=='unestablished'])
        record = dict(diagnosticOnly=True, installerAcceptance=False, fullMemoryQualification=False,
            testingPackageEligible=False, nestedStageOutcomes=records,
            nativeReportPresenceDoesNotProveCheckerSuccess=True)
        (root/'nested-outcomes.json').write_text(json.dumps(record, indent=2)+'\n')
        PYTHON
      if: always()
    - name: Prepare bounded UI records ZIP and DMG evidence without installers
      id: evidence_archives
      if: always()
      timeout-minutes: 3
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, zipfile
        from pathlib import Path
        root = Path('dist/blocked-installers227')
        root.mkdir(parents=True, exist_ok=True)
        target = Path('dist/blocked-installers227-artifacts'); target.mkdir(parents=True, exist_ok=True)
        groups = {'records': ['dist/blocked-installers227/', 'dist/pin-checker-contracts.log', 'dist/pin-checker-contracts-optimized.log', 'dist/native-dependencies-preflight.log', 'dist/native-dependencies-preflight-report.json', 'dist/package.log', 'dist/package-report.json', 'dist/ui-preview.log', 'dist/ui-preview-report.json', 'dist/model-download.log', 'dist/model-download-report.json', 'dist/erase-model-download.log', 'dist/erase-model-download-report.json', 'dist/smoke.log', 'dist/smoke-report.json', 'dist/editable-product-installed-default.log', 'dist/editable-product-installed-default-report.json', 'dist/evidence/installed-format-identity.json'], 'ui': ['dist/blocked-installers227/source-identity.json', 'dist/blocked-installers227/runtime-overlay.json', 'dist/blocked-installers227/nested-outcomes.json', 'dist/evidence/ui/'], 'zip': ['dist/blocked-installers227/source-identity.json', 'dist/blocked-installers227/runtime-overlay.json', 'dist/blocked-installers227/nested-outcomes.json', 'dist/evidence/zip/'], 'dmg': ['dist/blocked-installers227/source-identity.json', 'dist/blocked-installers227/runtime-overlay.json', 'dist/blocked-installers227/nested-outcomes.json', 'dist/evidence/dmg/']}
        budget = 31 * 1024 * 1024
        records = {}
        for name, inputs in groups.items():
            archive = target/(name+'.zip')
            record = dict(status='not-uploadable', inputs=inputs, archiveBudgetBytes=budget,
                maxInputBytes=256*1024*1024, maxFileCount=4096, rawReportsModified=False)
            records[name] = record
            try:
                candidates = []
                for entry in inputs:
                    path = Path(entry)
                    if path.is_symlink(): raise ValueError('Refuse symlink evidence root: '+str(path))
                    candidates.extend([path] if path.is_file() else path.rglob('*'))
                if any(file.is_symlink() or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage'))
                        for part in file.parts) for file in candidates):
                    raise ValueError('Refuse symlink, application, or compiled model evidence entry')
                files = sorted({file for file in candidates if not file.is_dir()})
                if not files or (name in ('ui', 'zip', 'dmg') and not any(str(file).startswith('dist/evidence/'+name+'/') for file in files)):
                    raise ValueError('No stage evidence files were produced')
                if len(files) > record['maxFileCount']: raise ValueError('Evidence file-count bound exceeded')
                total = 0
                for file in files:
                    if (file.is_symlink() or not file.is_file()
                            or not file.resolve().is_relative_to(Path('dist').resolve())
                            or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage')) for part in file.parts)
                            or file.suffix.lower() in {'.dmg', '.zip', '.onnx', '.mlmodel', '.bin', '.weights', '.safetensors', '.pt', '.pth', '.ckpt', '.tflite', '.pb'}
                            or file.name.startswith('PicShot-')):
                        raise ValueError('Refuse nonregular, escaped, or installer evidence input: '+str(file))
                    total += file.stat().st_size
                record.update(fileCount=len(files), inputBytes=total)
                if total > record['maxInputBytes']: raise ValueError('Evidence input-byte bound exceeded')
                with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
                    for file in files:
                        output.write(file, file.as_posix())
                        if output.fp.tell() >= budget: raise ValueError('Compressed evidence exceeds31MiB')
                record['archiveBytes'] = archive.stat().st_size
                if record['archiveBytes'] >= budget: raise ValueError('Final evidence archive exceeds31MiB')
                record.update(status='ready', archive=str(archive), archiveSHA256=hashlib.sha256(archive.read_bytes()).hexdigest())
            except Exception as error:
                record['error'] = str(error)
                archive.unlink(missing_ok=True)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                output.write(name+'='+str(record['status'] == 'ready').lower()+'\n')
        report = dict(diagnosticOnly=True, installerAcceptance=False, fullMemoryQualification=False,
            testingPackageEligible=False, sourceCommit=os.environ['PICSHOT_BLOCKED_SOURCE'],
            workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
            archiveBudgetBytes=budget, rawEvidencePreservedOnRunner=True, archives=records)
        (root/'evidence-archives.json').write_text(json.dumps(report, indent=2)+'\n')
        if any(record['status'] != 'ready' for record in records.values()):
            raise SystemExit('Some diagnostic evidence is absent or oversized; see evidence-archives.json')
        PYTHON
