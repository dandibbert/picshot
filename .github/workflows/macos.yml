            'version': info['CFBundleShortVersionString'], 'buildVersion': info['CFBundleVersion'],
            'executableSHA256': hashlib.sha256(executable).hexdigest(), 'executableBytes': len(executable),
            'plistSHA256': hashlib.sha256(plist_bytes).hexdigest(), 'buildInfoSHA256': hashlib.sha256(build_bytes).hexdigest(),
            'oneBinaryForEveryCell': True, 'diagnosticSelectionChangesCompiledDefault': False, 'installerAcceptance': False,
            'productAcceptance': False, 'memoryStabilityAssessed': False
