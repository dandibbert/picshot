          --log dist/live-scroll-installed.log --report dist/live-scroll-installed-report.json
          -- bash scripts/live-scroll-installed.sh
          "${{ github.workspace }}/dist/PicShot-0.22.0-macos-${{ matrix.arch }}.zip"
          "${{ github.workspace }}/dist/live-scroll-installed" "${{ github.sha }}"
      - name: Classify explicit scrolling testing eligibility without changing resource results
        id: scroll_testing_classification
        if: ${{ !contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') && !cancelled() && (steps.live_scroll_resource.outcome == 'success' || steps.live_scroll_resource.outcome == 'failure') }}
        timeout-minutes: 2
        run: |
          picshot_scroll_executable_sha=$(shasum -a 256 dist/PicShot.app/Contents/MacOS/PicShot | cut -d ' ' -f 1)
          picshot_scroll_archive_sha=$(shasum -a 256 "dist/PicShot-0.22.0-macos-${{ matrix.arch }}.zip" | cut -d ' ' -f 1)
          python3 scripts/classify-live-scroll-testing.py \
