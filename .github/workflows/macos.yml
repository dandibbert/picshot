        PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s "$PICSHOT_BLOCKED_CONTRACT_ROOT/scripts/tests" -p test_check_pin_management.py -v 2>&1 | tee dist/pin-checker-contracts-optimized.log
