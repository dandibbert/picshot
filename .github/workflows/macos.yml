                  raise SystemExit('Direct launcher files differ from the reviewed source')
          legacy_identity_helper = 'scripts/native-test-diagnostics.py'
          if hashlib.sha256((observer/legacy_identity_helper).read_bytes()).hexdigest() != '8439c941e72e0382ce4530f0c0ffc01fc03b6d672c93ec5c7cf55691cd3f49e5':
