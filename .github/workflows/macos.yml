            priorInstalledEvidence=dict(runID='38137698587',build=229,workflowCommit=prior,originalUIAndZIPAndDMG='passed; prior build bytes only'),
            originalMemoryFailure=dict(runID='38130153505',warmRSSBytes=10780672,warmLimitBytes=9830400,lateThreeRSSBytes=5177344,lateLimitBytes=4915200,preserved=True),
            stable214Unchanged=True,realScreenCaptureAcceptance=False,
            workflowRunID=os.environ['GITHUB_RUN_ID'],workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'])
        (root/'source-identity.json').write_text(json.dumps(record,indent=2)+'\n')
