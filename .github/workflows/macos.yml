          from pathlib import Path
          # Six files per uncompressed artifact ZIP; reserve 64 KiB for its
          # archive headers so each upload remains below the 32 MiB transfer cap.
          budget = 32 * 1024 * 1024 - 64 * 1024
          for extension in ("zip", "dmg"):
              installers = list(Path("dist").glob(f"PicShot-*.{extension}"))
              if len(installers) != 1:
                  raise SystemExit(f"Expected one {extension} installer, found {len(installers)}")
