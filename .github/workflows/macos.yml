  callout-retirement:
    if: ${{ contains(github.event.head_commit.message || '', '[callout-retirement]') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify strict diagnostic checks including optimized Python
        timeout-minutes: 2
        run: |
          mkdir -p dist
          python3 -m unittest discover -s scripts/tests -p test_check_callout_retirement_diagnostic.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_check_callout_retirement_diagnostic.py -v
      - name: Compile and execute all eleven native diagnostic tests
        id: callout_native
        timeout-minutes: 10
        run: |
          python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/callout-retirement-native.log --report dist/callout-retirement-native.json -- bash scripts/test-callout-retirement-source-scope.sh
          python3 scripts/check-callout-retirement-diagnostic.py native dist/callout-retirement-native.json dist/callout-retirement-native.log Tests/PicShotTests/NumberedCalloutRetirementDiagnosticsTests.swift
      - name: Build and sign the diagnostic app without installers
        id: callout_package
        timeout-minutes: 31
        run: |
          python3 scripts/run-bounded-command.py --timeout-seconds 1800 --log dist/callout-retirement-package.log --report dist/callout-retirement-package.json -- bash scripts/package-callout-retirement-diagnostic.sh
          python3 scripts/check-callout-retirement-diagnostic.py process dist/callout-retirement-package.json
          mkdir -p dist/callout-retirement-installed
          ditto dist/PicShot.app dist/callout-retirement-installed/PicShot.app
          codesign --verify --deep --strict dist/callout-retirement-installed/PicShot.app
          test "$(lipo -archs dist/callout-retirement-installed/PicShot.app/Contents/MacOS/PicShot)" = x86_64
      - name: Run the original full early UI ordering exactly once
        id: callout_ui
        timeout-minutes: 11
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 630
          --log dist/callout-retirement-launch.log --report dist/callout-retirement-launch.json
          -- bash scripts/run-callout-retirement-diagnostic.sh
          "$PWD/dist/callout-retirement-installed/PicShot.app" "$PWD/dist/evidence/callout-retirement"
      - name: Preserve original acceptance independently of diagnostic capture
        if: always()
        run: >-
          python3 scripts/check-callout-retirement-diagnostic.py capture
          "$PWD/dist/evidence/callout-retirement" "$GITHUB_SHA" dist/callout-retirement-summary.json
          --process-report dist/callout-retirement-native.json
          --process-report dist/callout-retirement-package.json
          --process-report dist/callout-retirement-launch.json
      - name: Archive raw diagnostic outcomes even when original acceptance fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Callout-Retirement-x86_64-${{ github.sha }}
