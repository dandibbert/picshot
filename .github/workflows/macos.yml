          swift test --skip-build --filter 'FormulaEngineTests|RecordedModelOutputTests|SmartEraseEngineTests' 2>&1 | tee dist/model-inference.log
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          inventory = native.bounded_text(Path('dist/native-test-discovery.log'), native.MAX_INVENTORY_BYTES)
          classes = {'PicShotMLHelperTests.FormulaEngineTests', 'PicShotTableEngineTests.RecordedModelOutputTests', 'PicShotEraseHelperTests.SmartEraseEngineTests'}
          expected = [case for case in native.discover(inventory) if case.split('/')[0] in classes]
          native.need(len(expected) == 12 and all(sum(case.split('/')[0] == cls for case in expected) == 4 for cls in classes), 'Model discovery differs from pinned 12-case contract')
          log = native.bounded_text(Path('dist/model-inference.log'), native.MAX_LOG_BYTES)
          passed, skipped = native.case_results(log, expected)
          native.need(not skipped and len(passed) == 12, 'Model cases missing or skipped')
          Path('dist/evidence/installed-diagnostic/model-check.json').write_text(json.dumps(dict(
              status='passed', sourceCommit=os.environ['GITHUB_SHA'], passedTests=passed, skippedTests=skipped,
              inventorySHA256=hashlib.sha256(inventory.encode()).hexdigest(), logSHA256=hashlib.sha256(log.encode()).hexdigest(),
              diagnosticOnly=True, installerAcceptance=False), indent=2)+'\n')
          PYTHON
      - name: Require prior native processes to have exited before installed observations
        id: installed_preflight
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.retirement_gif.outcome == 'success' && steps.models.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          rows = subprocess.check_output(['/bin/ps', '-ax', '-o', 'pid=,comm='], text=True, timeout=5).splitlines()
          matches = []
          for row in rows:
              pid, command = row.strip().split(None, 1)
              name = Path(command).name
              if name.startswith('PicShot') or name in {'swift', 'swift-frontend', 'swift-test', 'xctest'} or '.xctest/' in command:
                  matches.append(dict(pid=int(pid), command=command))
          Path('dist/evidence/installed-diagnostic/installed-process-preflight.json').write_text(json.dumps(dict(
              status='failed' if matches else 'passed', sourceCommit=os.environ['GITHUB_SHA'],
              observedProcesses=matches, priorProcessesTerminatedByThisCheck=False, installerAcceptance=False), indent=2)+'\n')
          if matches:
              raise SystemExit('Prior app, helper or native-test process remains; refusing overlapping observation')
          PYTHON
      - name: Run unchanged final ZIP and DMG smoke including its installed-default gate
