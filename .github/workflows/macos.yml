        codesign --verify --deep --strict dist/editable-components-installed/PicShot.app
        test "$(lipo -archs dist/editable-components-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        original = Path('dist/PicShot.app/Contents/MacOS/PicShot')
        installed = Path('dist/editable-components-installed/PicShot.app')
        executable = installed / 'Contents/MacOS/PicShot'
        info = plistlib.loads((installed / 'Contents/Info.plist').read_bytes())
        expected = hashlib.sha256(original.read_bytes()).hexdigest()
