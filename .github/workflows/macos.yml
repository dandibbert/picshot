      # compilation, discovery and 17-method reproduction before release packaging.
      # No command, selector, deadline or later installer gate is removed.
      # Keep compilation outside the eight-minute execution gates. Inner
      # deadlines leave time for process cleanup and report/log publication.
      - name: Compile debug app
        id: current_gate_07
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/debug-build.log --report dist/debug-build-report.json
          -- swift build --product PicShot
      - name: Upload debug compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Debug-Compile-${{ matrix.arch }}-${{ github.sha }}
