    - name: Execute exact discovered drawing renderer effect and substage native inventory
      timeout-minutes: 9
      run: |
        set -euo pipefail
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/seed-render-crop-test-discovery.log --report dist/seed-render-crop-test-discovery.json -- swift test list --skip-build
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/seed-render-crop-native-tests.log --report dist/seed-render-crop-native-tests.json -- swift test --skip-build --filter 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests|SeedRenderCropSubstageProbeTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/seed-render-crop-test-discovery.log').read_text()
        discovered = native.discover(inventory)
        classes = {'PicShotTests.DrawingRasterTests', 'PicShotTests.RendererStorageTests',
                   'PicShotTests.EffectContextConfigurationTests', 'PicShotTests.EffectContextGuardControlTests',
                   'PicShotTests.SeedRenderCropSubstageProbeTests'}
        expected = [name for name in discovered if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes,
                    'Native drawing/renderer/effect/substage class inventory differs')
        probe_methods = {
            'testAbsentFlagIsNoOpAndFiniteSelectionFixesEveryAxis',
            'testInvalidSelectorsRoutesAndPolicyChangesFailClosed',
            'testSchemaRawByteBindingsAndCompleteMemoryArePreserved',
            'testActualFullMemoryDictionaryRoundTripsWithoutLosingBackingFields',
            'testExactBoundsOrderAndMissingWorkflowRejection',
            'testExistingDrawingMetadataDoesNotSampleOrRetainObjects',
            'testMemorySchemaRejectsObjectsMissingBackingAndOversizeMetadata',
            'testRunningWriteDoesNothingAndFinalSidecarIsBounded',
        }
        native.need({name.split('/')[1] for name in expected if name.split('/')[0] == 'PicShotTests.SeedRenderCropSubstageProbeTests'}
                    == probe_methods, 'The eight dedicated substage cases differ')
        discovery = json.loads(Path('dist/seed-render-crop-test-discovery.json').read_text())
        runner = json.loads(Path('dist/seed-render-crop-native-tests.json').read_text())
        log = Path('dist/seed-render-crop-native-tests.log').read_text()
        for report, seconds, command, raw in [
            (discovery, 60, ['swift', 'test', 'list', '--skip-build'], inventory),
            (runner, 420, ['swift', 'test', '--skip-build', '--filter', 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests|SeedRenderCropSubstageProbeTests'], log),
        ]:
            native.need(report['status'] == report['termination_reason'] == 'exited'
                        and report['exit_code'] == report['child_returncode'] == 0
                        and report['timeout_seconds'] == seconds and report['command'] == command
                        and report['log_bytes'] == len(raw.encode()) and not report['log_truncated']
                        and not report['sigterm_sent'] and not report['sigkill_sent'],
                        'Native inventory or test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Native diagnostic cases skipped')
        Path('dist/seed-render-crop-native-check.json').write_text(json.dumps({
            'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'discoveredCount': len(discovered),
            'selectedClasses': sorted(classes), 'expectedTests': expected, 'passedTests': passed,
            'dedicatedSubstageMethods': sorted(probe_methods), 'skippedTests': skipped,
            'inventorySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
            'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'productAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Relocate and bind the single exact signed ARM application
      timeout-minutes: 2
      run: |
        set -euo pipefail
        test ! -e dist/seed-render-crop-installed
        mkdir -p dist/seed-render-crop-installed
        ditto dist/PicShot.app dist/seed-render-crop-installed/PicShot.app
        codesign --verify --deep --strict dist/seed-render-crop-installed/PicShot.app
        test "$(lipo -archs dist/seed-render-crop-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        cmp dist/PicShot.app/Contents/MacOS/PicShot dist/seed-render-crop-installed/PicShot.app/Contents/MacOS/PicShot
        cmp dist/PicShot.app/Contents/Info.plist dist/seed-render-crop-installed/PicShot.app/Contents/Info.plist
        cmp dist/PicShot.app/Contents/Resources/build-info.json dist/seed-render-crop-installed/PicShot.app/Contents/Resources/build-info.json
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        app = Path('dist/seed-render-crop-installed/PicShot.app').resolve()
        executable = (app / 'Contents/MacOS/PicShot').read_bytes()
        plist_bytes = (app / 'Contents/Info.plist').read_bytes()
        build_bytes = (app / 'Contents/Resources/build-info.json').read_bytes()
        info, build = plistlib.loads(plist_bytes), json.loads(build_bytes)
        if not (info['PicShotSourceCommit'] == build['sourceCommit'] == os.environ['GITHUB_SHA']
                and build['architecture'] == 'arm64'
                and info['CFBundleExecutable'] == 'PicShot'
                and info['CFBundleShortVersionString'] == build['version']
                and info['CFBundleVersion'] == os.environ['GITHUB_RUN_NUMBER']):
            raise SystemExit('Installed substage source, build or architecture mismatch')
        Path('dist/seed-render-crop-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'bundlePath': str(app), 'architecture': 'arm64',
            'version': info['CFBundleShortVersionString'], 'buildVersion': info['CFBundleVersion'],
            'executableSHA256': hashlib.sha256(executable).hexdigest(), 'executableBytes': len(executable),
            'plistSHA256': hashlib.sha256(plist_bytes).hexdigest(), 'buildInfoSHA256': hashlib.sha256(build_bytes).hexdigest(),
            'oneBinaryForEveryCell': True, 'diagnosticSelectionChangesCompiledDefault': False, 'installerAcceptance': False,
            'productAcceptance': False
        }, indent=2) + '\n')
