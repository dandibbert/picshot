  editable-documents:
    if: ${{ contains(github.event.head_commit.message || '', '[editable-documents]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # Two-minute verifier compilation stage; product and test deadlines stay fixed.
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare pinned native codec dependencies
        timeout-minutes: 15
        run: |
          mkdir -p dist
          python3 scripts/run-bounded-command.py --timeout-seconds 840 --log dist/editable-dependencies.log --report dist/editable-dependencies.json -- python3 scripts/build-native-codecs.py --arch "$(uname -m)"
      - name: Compile exact app and native test modules
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/editable-build.log --report dist/editable-build.json
          -- swift build --build-tests
      - name: Compile independent post-exit product pixel verifier
        timeout-minutes: 2
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 90
          --log dist/editable-product-pixel-build.log --report dist/editable-product-pixel-build.json
          -- swiftc scripts/verify-editable-product-pixels.swift -o dist/verify-editable-product-pixels
      - name: Discover and bind editable workflow tests
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_native_test_shards.py -v
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/native-test-discovery.log --report dist/editable-discovery.json -- swift test list --skip-build
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --selection-regex 'EditableProductResource|EditableProductRetirement|SeedRenderCropSubstage|EffectContext|RendererStorage|DrawingRaster|SourceFormatOwnedCopy|EditableComponent|PendingCapture|CaptureRecoveryPolicy|PinEditableAdmission|EditableAnnotation|EditableCapture|ImageEditorTests|EditorOutputProjection|AnnotationEditing|PinOriginalCurrent|PinSession|History|Retention|AutomaticMosaic' --output dist/editable-tests-plan.json
      - name: Exercise editable state and existing crop/pin/history behavior
        timeout-minutes: 16
        run: |
          set -o pipefail
          execution_status=0
          {
            shard_failed=0
            for shard in 0 1; do
              python3 scripts/native-test-shards.py run --plan dist/editable-tests-plan.json --index "$shard" --directory dist/editable-test-shards || shard_failed=1
            done
            test "$shard_failed" -eq 0
          } 2>&1 | tee dist/editable-tests.log || execution_status=$?
          python3 scripts/native-test-shards.py check --plan dist/editable-tests-plan.json --directory dist/editable-test-shards --output dist/editable-tests-report.json
          test "$execution_status" -eq 0
      - name: Preserve focused evidence without installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Focused-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/editable-*.log
            dist/editable-*.json
            dist/native-test-discovery.log
            dist/editable-test-shards/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  # ARM-only observation experiment. No installer or 0.16 memory acceptance.
  editable-observation:
    if: ${{ contains(github.event.head_commit.message || '', '[editable-observation]') && !contains(github.event.head_commit.message || '', '[component-controls]') }}
    runs-on: macos-15
    # Sum of bounded stages fits with cleanup/upload headroom. This independent
    # diagnostic group neither cancels nor gates the normal release workflow.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
      - name: Check diagnostic contracts and record deliberately limited scope
        timeout-minutes: 2
        run: |
          mkdir -p dist
          python3 - <<'PYTHON'
          import json, os, platform
          from pathlib import Path
          if platform.machine() != 'arm64':
              raise SystemExit('This first diagnostic lane is ARM-only')
          Path('dist/editable-observation-scope.json').write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'], 'architecture': 'arm64',
              'diagnosticOnly': True, 'intelExecuted': False,
              'installerAcceptance': False, 'memoryStabilityAssessed': False,
              'productMemoryRemedyClaim': False, 'nativeDeadlineSeconds': 300,
              'ownedLaunchDeadlineSeconds': 600, 'baselineResourceCellExecuted': False,
              'scope': 'One exact signed installed app; separate certification, reference and candidate functional processes; conditional candidate 2+8 resources. Intel and baseline resources remain unrun.'
          }, indent=2) + '\n')
          PYTHON
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_check_editable*' -v 2>&1 | tee dist/editable-observation-contracts.log
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/editable-observation-bounded-runner.log
      - name: Package one signed app without creating user installers
        id: editable_observation_package
        timeout-minutes: 31
        env:
          PICSHOT_PACKAGE_APP_ONLY: '1'
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1800
          --log dist/editable-observation-package.log --report dist/editable-observation-package.json
          -- bash scripts/package.sh
      - name: Compile native normalization tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/editable-observation-test-build.log --report dist/editable-observation-test-build.json
          -- swift build --build-tests
      - name: Execute every discovered ManualScrollHashTests case exactly once
        timeout-minutes: 9
        run: |
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/editable-observation-test-discovery.log --report dist/editable-observation-test-discovery.json -- swift test list --skip-build
          python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/editable-observation-native-tests.log --report dist/editable-observation-native-tests.json -- swift test --skip-build --filter ManualScrollHashTests
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          inventory = Path('dist/editable-observation-test-discovery.log').read_text()
          expected = [name for name in native.discover(inventory) if name.split('/')[0] == 'PicShotTests.ManualScrollHashTests']
          native.need(bool(expected), 'No native normalization cases discovered')
          log = Path('dist/editable-observation-native-tests.log').read_text()
          process = json.loads(Path('dist/editable-observation-native-tests.json').read_text())
          native.need(process['status'] == 'exited' and process['termination_reason'] == 'exited'
                      and process['exit_code'] == process['child_returncode'] == 0
                      and process['timeout_seconds'] == 420 and not process['log_truncated'], 'Native process incomplete')
          passed, skipped = native.case_results(log, expected)
          native.need(not skipped, 'Normalization test skipped')
          Path('dist/editable-observation-native-check.json').write_text(json.dumps({
              'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
              'nativeDiscoverySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
              'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'memoryStabilityAssessed': False
          }, indent=2) + '\n')
          PYTHON
      - name: Relocate and verify the single exact signed ARM application
        timeout-minutes: 2
        run: |
          test ! -e dist/editable-observation-installed
          mkdir -p dist/editable-observation-installed
          ditto dist/PicShot.app dist/editable-observation-installed/PicShot.app
          codesign --verify --deep --strict dist/editable-observation-installed/PicShot.app
          test "$(lipo -archs dist/editable-observation-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
          python3 - <<'PYTHON'
          import hashlib, json, os, plistlib
          from pathlib import Path
          original = Path('dist/PicShot.app/Contents/MacOS/PicShot')
          installed = Path('dist/editable-observation-installed/PicShot.app')
          executable = installed / 'Contents/MacOS/PicShot'
          info = plistlib.loads((installed / 'Contents/Info.plist').read_bytes())
          expected = hashlib.sha256(original.read_bytes()).hexdigest()
          actual = hashlib.sha256(executable.read_bytes()).hexdigest()
          if expected != actual or info['PicShotSourceCommit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Installed binary/source mismatch')
          Path('dist/editable-observation-installed-identity.json').write_text(json.dumps({
              'sourceCommit': info['PicShotSourceCommit'], 'executableSHA256': actual,
              'bundlePath': str(installed.resolve()), 'architecture': 'arm64',
              'oneBinaryForEveryCell': True, 'installerAcceptance': False
          }, indent=2) + '\n')
          PYTHON
      - name: Certify every RGBA byte then compare two fresh functional processes
        id: editable_observation_functional
        timeout-minutes: 33
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1890
          --log dist/editable-observation-functional.log --report dist/editable-observation-functional.json
          -- bash scripts/editable-observation-diagnostic.sh
          "$PWD/dist/editable-observation-installed/PicShot.app"
          "$PWD/dist/evidence/editable-observation" "$GITHUB_SHA" functional-comparison
      - name: Checkpoint functional evidence before the resource process
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Observation-Functional-arm64-${{ github.sha }}
          path: |
            dist/editable-observation-*.log
            dist/editable-observation-*.json
            dist/evidence/editable-observation/
            dist/PicShot.app/Contents/Resources/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Observe candidate two warmups and eight measured cycles after strict comparison
        if: ${{ success() && steps.editable_observation_functional.outcome == 'success' }}
        timeout-minutes: 11
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 630
          --log dist/editable-observation-resources.log --report dist/editable-observation-resources.json
          -- bash scripts/editable-observation-diagnostic.sh
          "$PWD/dist/editable-observation-installed/PicShot.app"
          "$PWD/dist/evidence/editable-observation" "$GITHUB_SHA" candidate-resources
      - name: Preserve diagnostic logs reports and native PNGs without installer publication
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Observation-arm64-${{ github.sha }}
          path: |
            dist/editable-observation-*.log
            dist/editable-observation-*.json
            dist/evidence/editable-observation/
            dist/PicShot.app/Contents/Resources/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  # Complements the editable native tests; no installer or memory acceptance.
  editable-output-guard:
    if: ${{ contains(github.event.head_commit.message || '', '[editable-documents]') }}
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
      - name: Verify strict installed failure-guard report contracts
        timeout-minutes: 2
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
      - name: Package one signed app without user installers
        timeout-minutes: 31
        env:
          PICSHOT_PACKAGE_APP_ONLY: '1'
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1800
          --log dist/editable-guard-package.log --report dist/editable-guard-package.json
          -- bash scripts/package.sh
      - name: Relocate and verify exact signed ARM app
        timeout-minutes: 2
        run: |
          test ! -e dist/editable-guard-installed
          mkdir -p dist/editable-guard-installed
          ditto dist/PicShot.app dist/editable-guard-installed/PicShot.app
          codesign --verify --deep --strict dist/editable-guard-installed/PicShot.app
          test "$(lipo -archs dist/editable-guard-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
          cmp dist/PicShot.app/Contents/MacOS/PicShot dist/editable-guard-installed/PicShot.app/Contents/MacOS/PicShot
      - name: Verify cropped editable drafts reject incomplete output and retain undo redo
        timeout-minutes: 12
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 630
          --log dist/editable-output-guard.log --report dist/editable-output-guard.json
          -- bash scripts/effect-output-failure-smoke.sh
          "$PWD/dist/editable-guard-installed/PicShot.app"
          "$PWD/dist/evidence/editable-output-guard" "$GITHUB_SHA"
      - name: Preserve exact native guard evidence without installers
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Output-Guard-arm64-${{ github.sha }}
          path: |
            dist/editable-guard-*.log
            dist/editable-guard-*.json
            dist/editable-output-guard.log
            dist/editable-output-guard.json
            dist/evidence/editable-output-guard/
            dist/PicShot.app/Contents/Resources/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6


  editable-components:
    if: ${{ contains(github.event.head_commit.message || '', '[editable-observation]') && contains(github.event.head_commit.message || '', '[component-controls]') }}
    runs-on: macos-15
    timeout-minutes: 170
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      timeout-minutes: 2
    - name: Check component provenance and rejection contracts
      timeout-minutes: 2
      run: |
        mkdir -p dist
        python3 -m unittest discover -s scripts/tests -p test_check_editable_components.py -v
        python3 -O -m unittest discover -s scripts/tests -p test_check_editable_components.py -v
        python3 -m unittest discover -s scripts/tests -p test_editable_component_source_binding.py -v
    - name: Package one signed app without creating user installers
      id: editable_components_package
      timeout-minutes: 31
      env:
        PICSHOT_PACKAGE_APP_ONLY: '1'
      run: python3 scripts/run-bounded-command.py --timeout-seconds 1800 --log dist/editable-components-package.log --report dist/editable-components-package.json -- bash scripts/package.sh
    - name: Compile native component and source-format fidelity tests
      timeout-minutes: 10
      run: python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/editable-components-test-build.log --report dist/editable-components-test-build.json -- swift build --build-tests
    - name: Execute every discovered component and raw-format fidelity case exactly once
      timeout-minutes: 9
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/editable-components-test-discovery.log --report dist/editable-components-test-discovery.json -- swift test list --skip-build
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/editable-components-native-tests.log --report dist/editable-components-native-tests.json -- swift test --skip-build --filter 'EditableComponentFixtureTests|SourceFormatOwnedCopyTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/editable-components-test-discovery.log').read_text()
        classes = {'PicShotTests.EditableComponentFixtureTests', 'PicShotTests.SourceFormatOwnedCopyTests'}
        expected = [name for name in native.discover(inventory) if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes, 'Missing native component or source-format fidelity cases')
        log = Path('dist/editable-components-native-tests.log').read_text()
        process = json.loads(Path('dist/editable-components-native-tests.json').read_text())
        native.need(process['status'] == 'exited' and process['termination_reason'] == 'exited'
                    and process['exit_code'] == process['child_returncode'] == 0
                    and process['timeout_seconds'] == 420 and not process['log_truncated'], 'Native process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Component admission test skipped')
        Path('dist/editable-components-native-check.json').write_text(json.dumps({
            'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
            'nativeDiscoverySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
            'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'memoryStabilityAssessed': False
        }, indent=2) + '\n')
        PYTHON
    - name: Relocate and verify the single exact signed ARM application
      timeout-minutes: 2
      run: |
        test ! -e dist/editable-components-installed
        mkdir -p dist/editable-components-installed
        ditto dist/PicShot.app dist/editable-components-installed/PicShot.app
        codesign --verify --deep --strict dist/editable-components-installed/PicShot.app
        test "$(lipo -archs dist/editable-components-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        original = Path('dist/PicShot.app/Contents/MacOS/PicShot')
        installed = Path('dist/editable-components-installed/PicShot.app')
        executable = installed / 'Contents/MacOS/PicShot'
        info = plistlib.loads((installed / 'Contents/Info.plist').read_bytes())
        expected = hashlib.sha256(original.read_bytes()).hexdigest()
        actual = hashlib.sha256(executable.read_bytes()).hexdigest()
        if expected != actual or info['PicShotSourceCommit'] != os.environ['GITHUB_SHA']:
            raise SystemExit('Installed binary/source mismatch')
        Path('dist/editable-components-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'executableSHA256': actual,
            'bundlePath': str(installed.resolve()), 'architecture': 'arm64',
            'oneBinaryForEveryCell': True, 'installerAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Run certified fresh-process component controls and independent output verification
      # Nine separate processes retain their existing 300s native / 600s owned
      # launch / 620s wrapper limits, plus bounded cleanup and checker overhead.
      timeout-minutes: 98
      run: python3 scripts/run-bounded-command.py --timeout-seconds 5800 --log dist/editable-components-matrix.log --report dist/editable-components-matrix.json -- bash scripts/editable-components-diagnostic.sh "$PWD/dist/editable-components-installed/PicShot.app" "$PWD/dist/evidence/editable-components" "$GITHUB_SHA"
    - name: Preserve all component reports and immutable pixel evidence
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Editable-Components-arm64-${{ github.sha }}
        path: |
          dist/editable-components-*.log
          dist/editable-components-*.json
          dist/evidence/editable-components/
          dist/PicShot.app/Contents/Resources/build-info.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 6

  editable-drawing-pair:
    if: ${{ contains(github.event.head_commit.message || '', '[drawing-pair]') }}
    runs-on: macos-15
    timeout-minutes: 130
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      timeout-minutes: 2
    - name: Check paired drawing and owned guard contracts
      timeout-minutes: 3
      run: |
        set -o pipefail
        mkdir -p dist
        python3 -m unittest discover -s scripts/tests -p '*drawing*.py' -v 2>&1 | tee dist/drawing-contracts.log
        python3 -O -m unittest discover -s scripts/tests -p '*drawing*.py' -v 2>&1 | tee dist/drawing-contracts-optimized.log
    - name: Package one signed application without user installers
      timeout-minutes: 31
      env:
        PICSHOT_PACKAGE_APP_ONLY: '1'
      run: python3 scripts/run-bounded-command.py --timeout-seconds 1800 --log dist/drawing-package.log --report dist/drawing-package.json -- bash scripts/package.sh
    - name: Compile the complete native test target
      timeout-minutes: 10
      run: python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/drawing-test-build.log --report dist/drawing-test-build.json -- swift build --build-tests
    - name: Execute every discovered drawing-raster regression exactly once
      timeout-minutes: 9
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/drawing-test-discovery.log --report dist/drawing-test-discovery.json -- swift test list --skip-build
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/drawing-native-tests.log --report dist/drawing-native-tests.json -- swift test --skip-build --filter DrawingRasterTests
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/drawing-test-discovery.log').read_text()
        expected = [name for name in native.discover(inventory) if name.split('/')[0] == 'PicShotTests.DrawingRasterTests']
        native.need(bool(expected), 'No drawing raster native cases discovered')
        log = Path('dist/drawing-native-tests.log').read_text()
        runner = json.loads(Path('dist/drawing-native-tests.json').read_text())
        native.need(runner['status'] == runner['termination_reason'] == 'exited'
                    and runner['exit_code'] == runner['child_returncode'] == 0
                    and runner['timeout_seconds'] == 420 and not runner['log_truncated'], 'Native drawing test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Drawing raster native test skipped')
        Path('dist/drawing-native-check.json').write_text(json.dumps({
            'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
            'inventorySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
            'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'productAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Relocate and bind the single exact signed ARM application
      timeout-minutes: 2
      run: |
        test ! -e dist/drawing-installed
        mkdir -p dist/drawing-installed
        ditto dist/PicShot.app dist/drawing-installed/PicShot.app
        codesign --verify --deep --strict dist/drawing-installed/PicShot.app
        test "$(lipo -archs dist/drawing-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        cmp dist/PicShot.app/Contents/MacOS/PicShot dist/drawing-installed/PicShot.app/Contents/MacOS/PicShot
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        app = Path('dist/drawing-installed/PicShot.app').resolve()
        info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
        if info['PicShotSourceCommit'] != os.environ['GITHUB_SHA']:
            raise SystemExit('Installed drawing source mismatch')
        Path('dist/drawing-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'bundlePath': str(app), 'architecture': 'arm64',
            'executableSHA256': hashlib.sha256((app / 'Contents/MacOS/PicShot').read_bytes()).hexdigest(),
            'oneBinaryForEveryCell': True, 'diagnosticSelectionChangesCompiledDefault': False, 'installerAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Verify fail-closed outputs under the candidate drawing strategy
      timeout-minutes: 12
      env:
        PICSHOT_DRAWING_RASTER_STRATEGY: owned-srgb8
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 630 --log dist/drawing-owned-guard.log --report dist/drawing-owned-guard.json -- bash scripts/effect-output-failure-smoke.sh "$PWD/dist/drawing-installed/PicShot.app" "$PWD/dist/evidence/drawing-owned-guard" "$GITHUB_SHA"
