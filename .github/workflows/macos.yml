      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path

        def git(*args): return subprocess.check_output(['git', *args], timeout=10)
        def need(value, message):
            if not value: raise ValueError(message)
        root=Path('dist/experimental-installer227');root.mkdir(parents=True,exist_ok=True)
