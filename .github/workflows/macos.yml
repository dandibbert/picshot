        retirement_methods = {
            'testClearedCacheAndWeakJobCompletionWaitForHeldProviderThenRecordNaturalRelease',
            'testAlreadyBalancedReturnsWithoutSleepingAndChecksCancellationAndDeadline',
            'testRetainedProviderFailsShortCapAndPreservesOriginalEvidence',
            'testFullDeadlineAndCancellationInterruptAnOutstandingProvider',
            'testOwnerAndJobCompletionRemainRequiredEvenWhenDrawingIsBalanced',
            'testCorruptedObservationsNewWorkAndBackwardTimeFailClosed',
        }
        native.need({name.split('/')[1] for name in expected if name.split('/')[0] == 'PicShotTests.EditableProductRetirementTests'}
                    == retirement_methods, 'The six provider retirement cases differ')
        discovery = json.loads(Path('dist/editable-product-resource-test-discovery.json').read_text())
        runner = json.loads(Path('dist/editable-product-resource-native-tests.json').read_text())
        log = Path('dist/editable-product-resource-native-tests.log').read_text()
        for report, seconds, command, raw in [
            (discovery, 60, ['swift', 'test', 'list', '--skip-build'], inventory),
            (runner, 420, ['swift', 'test', '--skip-build', '--filter', 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests|SeedRenderCropSubstageProbeTests|EditableProductResourceFixtureTests|EditableProductRetirementTests'], log),
        ]:
