    - name: Verify only the declared checker overlay and unchanged packaged product
      id: final_source_identity
      if: ${{ !cancelled() && steps.checker_overlay.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, subprocess
        from pathlib import Path

        def git(*args):
            return subprocess.check_output(['git', *args], timeout=10)
        def need(value, message):
            if not value: raise ValueError(message)
        def digest(path):
            sha = hashlib.sha256()
            with path.open('rb') as stream:
                for chunk in iter(lambda: stream.read(1024*1024), b''): sha.update(chunk)
            return sha.hexdigest()
        root = Path('dist/blocked-installers227')
        record = json.loads((root/'runtime-overlay.json').read_text())
        path = 'scripts/check-pin-management.py'
        need(git('rev-parse', 'HEAD', 'HEAD^{tree}').decode().splitlines() == [record['sourceCommit'], record['sourceTree']], 'Source227 identity changed')
        need(git('diff', '--name-only', 'HEAD').decode().splitlines() == [path], 'Unexpected changed tracked path')
        need(not git('diff', '--cached').strip() and not git('diff', '--summary', 'HEAD').strip(), 'Staged or mode changes')
        need(digest(Path(path)) == record['checkerSHA256'], 'Runtime checker changed')
        need(hashlib.sha256(git('diff', '--binary', 'HEAD', '--', path)).hexdigest() == record['runtimeOverlayDiffSHA256'], 'Overlay diff changed')
        need(digest(root/'diagnostic-workflow.yml') == record['diagnosticWorkflowSHA256'], 'Archived workflow changed')
        need(digest(Path('.github/workflows/macos.yml')) == 'b09a4f78c221c77e5db83dc3cfedecc2abeb08162f41b00ee4397fff70a4b2c1', 'Original227 workflow changed')
        package = json.loads((root/'package-identity.json').read_text())
        for file in package['files']:
            need(digest(Path(file['path'])) == file['sha256'], 'Built app or package bytes changed after packaging')
        record.update(status='passed', runtimeTrackedTreeClean=False, runtimeChangedPaths=[path],
            packagesAndNativeBinariesUnchangedAfterOverlay=True, originalTrackedTreeCleanAtBuild=True)
        (root/'final-source-identity.json').write_text(json.dumps(record, indent=2)+'\n')
        PYTHON
    - name: Record fixed nested commands with failures unrun and unestablished outcomes
