    - name: Execute every discovered renderer and drawing regression exactly once
      timeout-minutes: 9
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/renderer-storage-test-discovery.log --report dist/renderer-storage-test-discovery.json -- swift test list --skip-build
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/renderer-storage-native-tests.log --report dist/renderer-storage-native-tests.json -- swift test --skip-build --filter 'DrawingRasterTests|RendererStorageTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/renderer-storage-test-discovery.log').read_text()
        classes = {'PicShotTests.DrawingRasterTests', 'PicShotTests.RendererStorageTests'}
        expected = [name for name in native.discover(inventory) if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes, 'Missing renderer or drawing native cases')
        log = Path('dist/renderer-storage-native-tests.log').read_text()
        runner = json.loads(Path('dist/renderer-storage-native-tests.json').read_text())
        native.need(runner['status'] == runner['termination_reason'] == 'exited'
                    and runner['exit_code'] == runner['child_returncode'] == 0
                    and runner['timeout_seconds'] == 420 and not runner['log_truncated'], 'Native drawing test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Drawing raster native test skipped')
