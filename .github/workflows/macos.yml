            workflowBlob=git('rev-parse',workflow+':.github/workflows/macos.yml').decode().strip(),
            workflowSHA256=hashlib.sha256(workflow_bytes).hexdigest(),triggerChangedPaths=changed,
            trackedSourceClean=True,runtimeOverlayApplied=False,originalScriptSHA256=script_hashes,
            selectedInstalledScript='scripts/live-scroll-installed.sh',selectedPrefixSHA256=hashlib.sha256(prefix).hexdigest(),
            selectedAssertions='All original installed ZIP identity, owned launch, three demo cases and output comparisons before final resource command',
            omittedCommand=omitted.decode().strip(),disputedResourceCellRerun=False,
