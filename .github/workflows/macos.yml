        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Early-Recording-Exports-${{ matrix.arch }}-${{ github.sha }}
          # Five 4MiB media + eight 128KiB reports + two 2MiB logs = 25MiB
          # maximum raw payload. Never include the installed app or extra PNG.
          path: dist/evidence/recording-input-export-early/artifact/
