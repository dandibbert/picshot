        run: python3 scripts/check-experimental-scroll-interactions.py qualify
      # Four fresh launches retain600s each plus compilation and owned cleanup.
      # The pre-existing318/346min whole-job cap remains an independent outer cap;
      # it does not promise every nested stage can simultaneously use its maximum.
      - name: Verify continuous scrolling and bounded resources from the actual ZIP
        if: ${{ !contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
        id: live_scroll_resource
        # Preserve this step's original failure. Only the separately audited
        # testing classifier below may permit the remaining independent gates.
        continue-on-error: true
        timeout-minutes: 46
        run: >-
