          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          ref: f991c23aaa60469db0e2dc77cb94198d0dc74c08
          path: native-product145
          fetch-depth: 1
          persist-credentials: false
      - name: Bind immutable source145 product to the separate current observer
        id: provenance
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p dist/native-direct-xctest
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          product = workspace/'native-product145'
          observer = workspace/'observer-source'
          product_source = 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'
          product_tree = '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'
          observer_base = '60b76eddfff050e39a669bd6e42c396f7a7979cc'
          observer_base_tree = '9a6b9e9134c6fc61149267d6ba4696d7153988e5'
          observer_source = os.environ['GITHUB_SHA']
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args], timeout=20)
          def revision(root, ref):
              return git(root, 'rev-parse', ref).decode().strip()
          if (Path.cwd().resolve() != product or product.is_symlink() or observer.is_symlink()
                  or product.resolve() != product or observer.resolve() != observer
                  or revision(product, '--show-toplevel') != str(product)
                  or revision(observer, '--show-toplevel') != str(observer)):
              raise SystemExit('Product and observer must be distinct isolated checkout roots')
          if revision(product, 'HEAD') != product_source or revision(product, 'HEAD^{tree}') != product_tree:
              raise SystemExit('Native product checkout differs from immutable source145')
          if (revision(observer, 'HEAD') != observer_source or revision(observer, 'HEAD^') != observer_base
                  or revision(observer, observer_base + '^{tree}') != observer_base_tree):
              raise SystemExit('Observer must directly preserve the reviewed source151 observer branch')
          if platform.machine() != 'arm64' or platform.system() != 'Darwin':
              raise SystemExit('Expected the native ARM macOS runner')
          def entries(root, ref):
              return {row.split(b'\t', 1)[1]: row.split(b'\t', 1)[0]
                      for row in git(root, 'ls-tree', '-r', '-z', ref).split(b'\0') if row}
          before, after = entries(observer, observer_base), entries(observer, observer_source)
          changed = sorted(path for path in before.keys() | after.keys() if before.get(path) != after.get(path))
          allowed = {b'.github/workflows/macos.yml', b'scripts/tests/test_native_owned_xctest.py'}
          if set(changed) != allowed:
              raise SystemExit('Current branch changes differ from the exact workflow and existing owned-launcher test file')
          if any(not after.get(path, b'').startswith(b'100644 blob ')
                 or not before.get(path, b'').startswith(b'100644 blob ') for path in changed):
              raise SystemExit('Expected exactly two existing regular non-executable files')
          workflow = '.github/workflows/macos.yml'
          original = git(observer, 'show', observer_base + ':' + workflow).decode()
          current = (observer/workflow).read_text()
          def outside_native(text):
              prefix, rest = text.split('  # Optional observations only. No packaging, installed smoke, or release acceptance.\n', 1)
              _, suffix = rest.split('  # Independent observations only. This job never supplies release acceptance.\n', 1)
              return prefix, suffix
          original_prefix, original_installed = outside_native(original)
          current_prefix, current_installed = outside_native(current)
          installed_definition_sha256 = hashlib.sha256(
              ('  # Independent observations only. This job never supplies release acceptance.\n' + current_installed).encode()).hexdigest()
          reviewed_installed_definitions = {'47d0142575af041cf970b331a6f35826add100917db203f03ba70ec5a7c7c924'}
          if original_prefix != current_prefix or installed_definition_sha256 not in reviewed_installed_definitions:
              raise SystemExit('Other jobs/routing or independently reviewed installed definition changed')
          for root in (product, observer):
              if git(root, 'status', '--porcelain', '--untracked-files=no').strip():
                  raise SystemExit('Tracked checkout differs from its verified source tree')
          tooling = {}
          for name, expected in (
              ('scripts/run-bounded-command.py', 'ef85307a6227a0d99641b17c75e2aa625ae7344376fbcb3ec1af1c5be7e2d5d2'),
              ('scripts/native-test-shards.py', '797e5ddaf62b140dc60775fd5ddc267b2da1ffb0d21f6537fbf4fb9124387380')):
              actual = hashlib.sha256((observer/name).read_bytes()).hexdigest()
              if actual != expected or (observer/name).read_bytes() != (product/name).read_bytes():
                  raise SystemExit('Observer runner/planner differs from immutable145 bytes')
