              previousObserverSamplerSeconds=20, sampleCollectionSeconds=2, sampleIntervalMilliseconds=10,
              stageMinutesBaseline=74, stageMinutesWithControl=83,
              jobMinutesBaseline=79, jobMinutesWithControl=88, nativeSecondsPerProcess=420)
          Path('dist/native-direct-xctest/source-identity.json').write_text(json.dumps(record, indent=2)+'\n')
