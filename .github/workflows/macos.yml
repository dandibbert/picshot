            dist/live-scroll-test-inventory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Package signed native app for early pixel review
        id: current_gate_13
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Build owned scrolling target for installed live-session verification
        id: current_gate_14
        timeout-minutes: 3
        run: python3 scripts/run-bounded-command.py --timeout-seconds 150 --log dist/live-scroll-target-build.log --report dist/live-scroll-target-build.json -- bash scripts/build-live-scroll-target.sh "$PWD/.build/LiveScrollTarget.app"
      - name: Bind current experimental source and select unchanged installed demo prefix
        id: experimental_scroll_prepare
        if: ${{ contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
        timeout-minutes: 2
        env:
          PICSHOT_EXPERIMENTAL_SCROLL_INTERACTIONS: 'true'
          PICSHOT_TRIGGER_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: python3 scripts/check-experimental-scroll-interactions.py prepare
      - name: Verify current experimental scrolling interactions from the actual ZIP
        id: experimental_scroll_demo
        if: ${{ contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
        timeout-minutes: 14
        run: |
          picshot_scroll_prefix=$(cat dist/experimental-scroll-interactions/installed-demo-prefix.sh)
