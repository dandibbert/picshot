    # The existing separate discovery remains capped at 60 seconds.
    timeout-minutes: 169
    env:
      PICSHOT_INSTALLED_PRODUCT_SOURCE: 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'
      PICSHOT_INSTALLED_PRODUCT_TREE: '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive diagnostic identity and select immutable source145 product checkout
        id: provenance
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p dist/evidence/installed-diagnostic
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          product_source = 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'
          product_tree = '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'
          diagnostic_source = os.environ['GITHUB_SHA']
          root = Path('dist/evidence/installed-diagnostic')
          root.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], timeout=10)
          def revision(ref):
              return git('rev-parse', ref).decode().strip()
          if platform.machine() != 'arm64' or platform.system() != 'Darwin':
              raise SystemExit('Expected the native ARM macOS runner')
          if revision('HEAD') != diagnostic_source or git('status', '--porcelain', '--untracked-files=no').strip():
              raise SystemExit('Diagnostic checkout identity or tracked files differ')
          workflow = Path('.github/workflows/macos.yml').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(workflow)).encode() + b'\0' + workflow).hexdigest()
          entry = git('ls-tree', diagnostic_source, '.github/workflows/macos.yml').decode().strip()
          if entry != '100644 blob ' + blob + '\t.github/workflows/macos.yml':
              raise SystemExit('Actual diagnostic workflow blob or file mode differs')
          if revision(product_source + '^{tree}') != product_tree:
              raise SystemExit('Immutable source145 tree differs')
          # Archive the actual workflow before detaching; all product commands subsequently
          # execute source145 scripts, and package.sh naturally stamps git HEAD=source145.
          (root/'diagnostic-workflow.yml').write_bytes(workflow)
          guard_source = "import hashlib, json, os, re, subprocess, sys\nfrom pathlib import Path\nPRODUCT = 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'\nTREE = '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'\nphase, stage = sys.argv[1:]\nif phase not in {'before', 'after', 'final'} or not re.fullmatch(r'[a-z_]+', stage):\n    raise SystemExit('Invalid product identity boundary')\nroot = Path('dist/evidence/installed-diagnostic')\nrecord = dict(phase=phase, stage=stage, status='failed', sourceCommit=PRODUCT,\n    diagnosticWorkflowCommit=os.environ['GITHUB_SHA'], diagnosticOnly=True, installerAcceptance=False)\ntry:\n    def git(*args):\n        return subprocess.check_output(['git', *args], timeout=5).decode().strip()\n    identity = git('rev-parse', 'HEAD', 'HEAD^{tree}').splitlines()\n    dirty = git('status', '--porcelain', '--untracked-files=no')\n    receipt = json.loads((root/'source-identity.json').read_text())\n    archive = (root/'diagnostic-workflow.yml').read_bytes()\n    record.update(observedCommit=identity[0], observedTree=identity[1], trackedCheckoutClean=not bool(dirty))\n    if (identity != [PRODUCT, TREE] or dirty\n            or os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'] != PRODUCT\n            or os.environ['PICSHOT_INSTALLED_PRODUCT_TREE'] != TREE\n            or receipt['sourceCommit'] != PRODUCT or receipt['sourceTree'] != TREE\n            or receipt['diagnosticWorkflowCommit'] != os.environ['GITHUB_SHA']\n            or receipt['productWorkingDirectory'] != str(Path.cwd().resolve())\n            or hashlib.sha256(archive).hexdigest() != receipt['diagnosticWorkflowSHA256']):\n        raise ValueError('Immutable product checkout or archived diagnostic identity differs')\n    record['status'] = 'passed'\nexcept BaseException as error:\n    record['error'] = str(error)\n    raise\nfinally:\n    with (root/'product-source-boundaries.jsonl').open('a') as output:\n        output.write(json.dumps(record, sort_keys=True)+'\\n')\n"
          (root/'verify-product-source.py').write_text(guard_source)
          record = dict(status='diagnostic-bound-product-pending', diagnosticOnly=True, installerAcceptance=False,
              sourceCommit=product_source, sourceTree=product_tree,
              diagnosticWorkflowCommit=diagnostic_source, diagnosticWorkflowTree=revision('HEAD^{tree}'),
              diagnosticWorkflowBlob=blob, diagnosticWorkflowSHA256=hashlib.sha256(workflow).hexdigest(),
              productGuardSHA256=hashlib.sha256(guard_source.encode()).hexdigest(),
              productWorkingDirectory=str(Path.cwd().resolve()), workflowRunID=os.environ['GITHUB_RUN_ID'],
              workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'], buildVersion=os.environ['GITHUB_RUN_NUMBER'],
              exhaustiveNativeSuiteRun=False, prior145FailurePreserved=True, fullProductionAcceptanceRequired=True,
              noDirectParentAssumption=True, productOverlayApplied=False)
          def write():
              (root/'source-identity.json').write_text(json.dumps(record, indent=2)+'\n')
          write()
          try:
              git('checkout', '--detach', product_source)
              entries = git('ls-tree', '-r', '-z', 'HEAD').split(b'\0')
              if (revision('HEAD') != product_source or revision('HEAD^{tree}') != product_tree
                      or len([row for row in entries if row]) != 710
                      or git('status', '--porcelain', '--untracked-files=no').strip()):
                  raise ValueError('Product checkout is not the exact clean immutable145 tree')
              record.update(status='passed', productTrackedCheckoutClean=True, productTrackedEntries=710,
                  archivedDiagnosticIdentitySurvivesDetach=(root/'diagnostic-workflow.yml').read_bytes() == workflow)
              if not record['archivedDiagnosticIdentitySurvivesDetach']:
                  raise ValueError('Diagnostic identity archive changed while detaching')
          except BaseException as error:
              record.update(status='failed', error=str(error))
              raise
          finally:
              write()
          PYTHON
