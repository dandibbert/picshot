          bash scripts/image-decode-exit-comparison.sh --finish "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-exit" 2>&1 | tee dist/decode-exit-comparison.log
      - name: Preserve diagnostic observations without installer publication
