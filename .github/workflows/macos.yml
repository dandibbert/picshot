      - name: Bind directly owned XCTest evidence without claiming SwiftPM or release reproduction
        if: always()
        timeout-minutes: 2
        env:
          PICSHOT_NATIVE_DIAGNOSTIC_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p dist/native-direct-xctest
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os, subprocess
          from pathlib import Path
          from types import SimpleNamespace
          root = Path('dist/native-direct-xctest').resolve()
          source_identity = json.loads((root/'source-identity.json').read_text()) if (root/'source-identity.json').is_file() else None
          steps = json.loads(os.environ['PICSHOT_NATIVE_DIAGNOSTIC_STEP_OUTCOMES'])
          errors, observations, launch_states = [], {}, {}
          helper = Path(os.environ['GITHUB_WORKSPACE'])/'observer-source/scripts/native-owned-xctest.py'
          owned = None
          if source_identity is not None and source_identity.get('status') == 'passed':
              spec = importlib.util.spec_from_file_location('owned', helper)
              owned = importlib.util.module_from_spec(spec); spec.loader.exec_module(owned)
          plan = current_inputs = None
          for directory, step, phase, mode in (
              ('owned-preflight', 'owned_applicability', 'preflight', 'baseline'),
              ('owned-baseline', 'baseline', 'run', 'baseline'),
              ('owned-unbuffered-control', 'unbuffered_control', 'run', 'unbuffered')):
              path = root/directory
              attempted = steps.get(step, {}).get('outcome') in ('success', 'failure', 'cancelled')
              launch = dict(stepAttempted=attempted, state='attempted-no-recorded-root' if attempted else 'not-attempted',
                  completeSelectedInventoryExecuted=False)
              process_path = path/'process.json'
              if process_path.is_file():
                  try:
                      if process_path.is_symlink() or process_path.stat().st_size > 1024*1024:
                          raise ValueError('Invalid bounded process evidence')
                      process = json.loads(process_path.read_text())
                      child = process.get('root', {})
                      if type(child.get('pid')) is int and child['pid'] > 0:
                          launch.update(state='owned-root-launch-recorded', recordedRootPID=child['pid'],
                              rootBindingError=child.get('bindingError'), rootIdentityRecorded=child.get('identity'))
                  except Exception as error:
                      launch['processEvidenceError'] = str(error)
              launch_states[directory] = launch
              try:
                  if not (path/'result.json').is_file():
                      if steps.get(step, {}).get('outcome') in ('success', 'failure', 'cancelled'):
                          raise ValueError('Attempted direct cell lacks final result; launch failure is not acceptance')
                      observations[directory] = dict(status='not-run')
                      continue
                  if owned is None:
                      raise ValueError('Current observer provenance did not pass; refusing helper execution')
                  plan = plan or owned.checked_plan(root/'native-tests-plan.json')
                  result = owned.read_report(path)
                  if current_inputs is None:
                      current_inputs, _ = owned.launch_inputs(SimpleNamespace(source_root=Path.cwd(),
                          bundle=Path.cwd()/'.build/debug/PicShotPackageTests.xctest', output_mode='baseline'))
                  expected_inputs = current_inputs if mode == 'baseline' else {
                      **current_inputs, 'runtimeEnvironment': {**current_inputs['runtimeEnvironment'], 'NSUnbufferedIO': 'YES'}}
                  expected = owned.PREFLIGHT_IDS if phase == 'preflight' else plan['shards'][3]['tests']
                  result = owned.verify_result(path, expected_inputs, expected, phase, mode)
                  owned.need(result['planIdentity'] == owned.file_identity(root/'native-tests-plan.json'),
                      'Direct result differs from the archived full plan bytes')
                  owned.need(result['inputs']['sourceCommit'] == 'f991c23aaa60469db0e2dc77cb94198d0dc74c08'
                      and result['inputs']['sourceTree'] == '2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1'
                      and result['orderedSelectedIDs'] == owned.ordered_selection(root/'native-tests-plan.json', expected),
                      'Direct result source or raw selected order differs')
                  owned.need(result['inputs']['limits'] == dict(setupSeconds=60, nativeSeconds=420, samplerSeconds=40,
                      sampleCollectionSeconds=2, sampleIntervalMilliseconds=10), 'Direct observer limits differ')
                  process = result['process']
                  owned.need(process['cleanupConfirmed'] is True and process['outputEOF'] is True and not process['errors']
                      and not process['logTruncated'], 'Direct root/sampler/output evidence is incomplete')
                  owned.need(process['timeoutSeconds'] == (30 if phase == 'preflight' else 420), 'Native deadline changed')
                  owned.need(phase != 'preflight' or result['cases']['status'] == 'passed', 'Applicability did not pass')
                  owned.need([capture['slotSeconds'] for capture in process['captures']] == process['dueCaptureSlots'],
                      'A due stack capture is missing')
                  observations[directory] = result
                  launch['completeSelectedInventoryExecuted'] = result['cases']['status'] == 'passed'
              except Exception as error:
                  errors.append(dict(cell=directory, error=str(error)))
                  observations[directory] = dict(status='verification-failed', error=str(error))
          product_clean = not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], timeout=20).strip()
          artifacts = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                       for path in root.rglob('*') if path.is_file() and not path.is_symlink() and path.name != 'outcomes.json'}
          record = dict(diagnosticOnly=True, installerAcceptance=False, fullSuiteAcceptance=False,
              sourceCommit='f991c23aaa60469db0e2dc77cb94198d0dc74c08', sourceTree='2347fb7fe45cf809e4cd6aa43fc2426a1fbff7b1',
              observerCommit=os.environ['GITHUB_SHA'], observerReferenceCommit='60b76eddfff050e39a669bd6e42c396f7a7979cc',
              observerTree=source_identity['observerTree'] if source_identity else None,
              sourceIdentity=source_identity, steps=steps, observations=observations, launchStates=launch_states, verificationErrors=errors,
              currentToolBundleHelperInputsReverified=current_inputs is not None,
              evidenceSHA256=artifacts, productTrackedCheckoutClean=product_clean,
              diagnosticExperiment='direct-owned-xctest-process-3', plannedProcessOrder=[0, 1, 2, 3],
              omittedPredecessorIndices=[0, 1, 2], originalSwiftPMParentPresent=False, fullRunReproduction=False,
              fullInventoryMethods=1799, intendedProcess3Methods=464, nativeSeconds=420, captureAtSeconds=[180, 360],
              nativeSetupSeconds=60, directApplicabilitySeconds=30, directSamplerSeconds=40,
              previousObserverSamplerSeconds=20, sampleCollectionSeconds=2, sampleIntervalMilliseconds=10,
              baselineFailurePreserved=True, originalProduction145FailureUnchanged=True,
              previousObserver148FailureUnchanged=True, previousObserver149FailureUnchanged=True, previousObserver150FailureUnchanged=True, previousObserver151FailureUnchanged=True, noInstallerArtifacts=True,
              rootCleanupScope='Only directly owned unreaped XCTest root and sampler children; no descendant census or ownership inference from leftover veto',
              environmentScope='Selected-Xcode SwiftPM-compatible XCTest bootstrap; baseline preserves inherited NSUnbufferedIO. Explicit control changes only NSUnbufferedIO to YES.',
              comparisonCaveat='If inherited NSUnbufferedIO was already YES, the control does not change buffering conditions.',
              scope='Direct XCTest launch isolation; not original SwiftPM parent/full-prefix failure reproduction or installed/Intel/release acceptance')
          (root/'outcomes.json').write_text(json.dumps(record, indent=2)+'\n')
          if errors or not product_clean:
              raise SystemExit('Direct native evidence or immutable product source failed verification')
          PYTHON
      - name: Preserve all diagnostic logs reports and owned-process samples
