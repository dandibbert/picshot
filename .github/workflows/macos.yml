      - name: Run six fresh installed processes after separate input preparation
        if: ${{ !contains(github.event.head_commit.message || '', '[image-relief]') && !contains(github.event.head_commit.message || '', '[image-draw]') && !contains(github.event.head_commit.message || '', '[image-decode-helper]') }}
