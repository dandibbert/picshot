        codesign --verify --deep --strict dist/seed-render-crop-installed/PicShot.app
        test "$(lipo -archs dist/seed-render-crop-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        cmp dist/PicShot.app/Contents/MacOS/PicShot dist/seed-render-crop-installed/PicShot.app/Contents/MacOS/PicShot
        cmp dist/PicShot.app/Contents/Info.plist dist/seed-render-crop-installed/PicShot.app/Contents/Info.plist
        cmp dist/PicShot.app/Contents/Resources/build-info.json dist/seed-render-crop-installed/PicShot.app/Contents/Resources/build-info.json
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        app = Path('dist/seed-render-crop-installed/PicShot.app').resolve()
        executable = (app / 'Contents/MacOS/PicShot').read_bytes()
        plist_bytes = (app / 'Contents/Info.plist').read_bytes()
        build_bytes = (app / 'Contents/Resources/build-info.json').read_bytes()
        info, build = plistlib.loads(plist_bytes), json.loads(build_bytes)
        if not (info['PicShotSourceCommit'] == build['sourceCommit'] == os.environ['GITHUB_SHA']
                and build['architecture'] == 'arm64'
                and info['CFBundleExecutable'] == 'PicShot'
                and info['CFBundleShortVersionString'] == build['version']
                and info['CFBundleVersion'] == os.environ['GITHUB_RUN_NUMBER']):
            raise SystemExit('Installed substage source, build or architecture mismatch')
        Path('dist/seed-render-crop-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'bundlePath': str(app), 'architecture': 'arm64',
