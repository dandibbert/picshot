            'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
            'inventorySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
            'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'productAcceptance': False
        }, indent=2) + '\n')
