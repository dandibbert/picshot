          python3 scripts/check-callout-retirement-diagnostic.py native dist/callout-retirement-native.json dist/callout-retirement-native.log Tests/PicShotTests/NumberedCalloutRetirementDiagnosticsTests.swift
      - name: Build and sign the diagnostic app without installers
