name: Native macOS build and verification
on:
  push:
    branches: ['feat/**']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picshot-${{ github.ref }}-${{ contains(github.event.head_commit.message || '', '[decode-exit-latch]') && 'decode-exit-latch' || contains(github.event.head_commit.message || '', '[decode-timing-v3]') && 'decode-timing-v3' || contains(github.event.head_commit.message || '', '[decode-large]') && 'decode-large' || contains(github.event.head_commit.message || '', '[pin-workflows]') && 'pins-010' || contains(github.event.head_commit.message || '', '[intel-only]') && 'intel-05' || 'current' }}
  cancel-in-progress: true
jobs:
  runner-check:
    if: ${{ contains(github.event.head_commit.message || '', '[runner-only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify bounded cleanup and cancellation on native macOS
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v
  build:
    if: ${{ (!contains(github.event.head_commit.message || '', '[gif-attribution]') || contains(github.event.head_commit.message || '', '[verify-installers]')) && !contains(github.event.head_commit.message || '', '[gif-timing]') && !contains(github.event.head_commit.message || '', '[codec-build]') && !contains(github.event.head_commit.message || '', '[codec-attribution]') && !contains(github.event.head_commit.message || '', '[runner-only]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message || '', '[intel-only]') && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test bounded CI command runner and annotation evidence checker
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_annotation_details_report.py -v
      - name: Package signed native app for early pixel review
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Render native UI from installed ZIP before slow verification
        run: |
          set -o pipefail
          bash scripts/ui-preview.sh 2>&1 | tee dist/ui-preview.log
      - name: Upload early native UI preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-UI-${{ matrix.arch }}-${{ github.sha }}
          path: dist/evidence/ui/
          if-no-files-found: ignore
          retention-days: 14
      - name: Measure codec and image backing in fresh installed processes
        timeout-minutes: 8
        run: |
          set -o pipefail
          bash scripts/codec-attribution.sh 2>&1 | tee dist/codec-attribution.log
          bash scripts/image-backing-attribution.sh 2>&1 | tee dist/image-backing-attribution.log
      - name: Upload early backing observations before remaining installer gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Backing-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/codec-attribution.log
            dist/image-backing-attribution.log
            dist/evidence/codec-attribution/
            dist/evidence/image-backing/
          if-no-files-found: ignore
          retention-days: 14
      # Keep compilation outside the eight-minute execution gates. Inner
      # deadlines leave time for process cleanup and report/log publication.
      - name: Compile debug app
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/debug-build.log --report dist/debug-build-report.json
          -- swift build --product PicShot
      - name: Upload debug compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Debug-Compile-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/debug-build.log
            dist/debug-build-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Compile native tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/test-build.log --report dist/test-build-report.json
          -- swift build --build-tests
      - name: Build dedicated native codec helper for actual lifecycle tests
        run: swift build --product PicShotCodecHelper
      - name: Plan exhaustive and focused native test processes
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_native_test_shards.py -v
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/native-test-discovery.log --report dist/native-test-discovery-report.json -- swift test list --skip-build
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --output dist/native-tests-plan.json
          python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --selection-regex 'AnnotationFreehand|AnnotationTextLine|NumberedCallout|AutomaticMosaic|RepeatedRegion|AutomaticPinOCR|PinOCR|TextResultSourceSelection|PinWorkflow|LaTeXPin|PinLaTeX|PinGroup|PinDesktop|EditorToolbarHierarchy|SaveWorkflow|OwnedVideoExportStage|ImageBacking|Codec|NativeExport|AnimatedWebP|WebPContainer|RecordingWebP|CapturePreset|CaptureElement|ImageExport|RecognizedBarcode|BarcodeVision|PinBarcode|PinExport|TextResultBarcode|AnnotationPath|Scroll.*Sequence|ScrollStitcher|PinText|RecognizedText|Recognition|GIF|AnnotationEffectsTests|AnnotationEffectsPreviewTests|RecordingCameraTests|RecordingCompositionTests|RecordingOverlayControlTests|RecordingCompositionSmokeTests|RecordingRecovery|VideoTrimTests|RecordingPauseTests|LocalInferenceResourceTests|LocalInferenceServiceTests|InferenceTestSynchronizationTests' --output dist/focused-tests-plan.json
      - name: Upload test compilation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Test-Compile-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/test-build.log
            dist/test-build-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check annotation, GIF, recording durability and inference boundaries
        timeout-minutes: 16
        run: |
          set -o pipefail
          for shard in 0 1; do
            python3 scripts/native-test-shards.py run --plan dist/focused-tests-plan.json --index "$shard" --directory dist/focused-test-shards
          done 2>&1 | tee dist/critical-tests.log
          python3 scripts/native-test-shards.py check --plan dist/focused-tests-plan.json --directory dist/focused-test-shards --output dist/critical-tests-report.json
      - name: Upload focused native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Focused-Tests-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/critical-tests.log
            dist/critical-tests-report.json
            dist/focused-tests-plan.json
            dist/native-test-discovery.log
            dist/native-test-discovery-report.json
            dist/focused-test-shards/
          if-no-files-found: ignore
          retention-days: 14
      - name: Recover actual abruptly terminated synthetic recording from installed app
        timeout-minutes: 4
        run: |
          set -o pipefail
          bash scripts/recording-recovery-smoke.sh 2>&1 | tee dist/recording-recovery.log
      - name: Test native modules
        timeout-minutes: 16
        run: |
          set -o pipefail
          for shard in 0 1; do
            python3 scripts/native-test-shards.py run --plan dist/native-tests-plan.json --index "$shard" --directory dist/native-test-shards
          done 2>&1 | tee dist/test.log
          python3 scripts/native-test-shards.py check --plan dist/native-tests-plan.json --directory dist/native-test-shards --output dist/test-report.json
      - name: Upload full native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Native-Tests-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/test.log
            dist/test-report.json
            dist/native-tests-plan.json
            dist/native-test-discovery.log
            dist/native-test-discovery-report.json
            dist/native-test-shards/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate native inference with approved pinned original model fixtures
        run: |
          set -o pipefail
          python3 scripts/fetch-model-fixtures.py 2>&1 | tee dist/model-download.log
          python3 scripts/SmartErase-fetch-fixture.py 2>&1 | tee dist/erase-model-download.log
          export PICSHOT_ERASE_MODEL_DIR="$PWD/.build/model-fixtures/erase"
          export PICSHOT_FORMULA_MODEL_DIR="$PWD/.build/model-fixtures/formula"
          export PICSHOT_TEST_TABLE_MODEL_DIR="$PWD/.build/model-fixtures/table"
          export PICSHOT_TEST_ML_HELPER="$(swift build --show-bin-path)/PicShotMLHelper"
          swift build --product PicShotMLHelper
          swift test --skip-build --filter 'FormulaEngineTests|RecordedModelOutputTests|SmartEraseEngineTests' 2>&1 | tee dist/model-inference.log
      - name: Install and launch both formats, render native UI, measure repeated cycles
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee dist/smoke.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-QA-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/*-report.json
            dist/*-plan.json
            dist/native-test-shards/
            dist/focused-test-shards/
            dist/evidence/
          retention-days: 14
      - name: Check split installer transfer budgets
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          # Four files per uncompressed artifact ZIP; reserve 64 KiB for its
          # archive headers so each upload remains below the 32 MiB transfer cap.
          budget = 32 * 1024 * 1024 - 64 * 1024
          for extension in ("zip", "dmg"):
              installers = list(Path("dist").glob(f"PicShot-*.{extension}"))
              if len(installers) != 1:
                  raise SystemExit(f"Expected one {extension} installer, found {len(installers)}")
              installer = installers[0]
              metadata = installer.with_suffix(".build-info.json")
              files = (installer, Path(str(installer) + ".sha256"),
                       metadata, Path(str(metadata) + ".sha256"))
              total = sum(path.stat().st_size for path in files)
              print(f"{extension.upper()} artifact input: {total} bytes; budget: {budget}")
              if total >= budget:
                  raise SystemExit(f"{extension.upper()} artifact exceeds transfer budget")
          PYTHON
      - name: Upload ZIP installer and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-macos-${{ matrix.arch }}-ZIP-${{ github.sha }}
          path: |
            dist/PicShot-*.zip
            dist/PicShot-*.zip.sha256
            dist/PicShot-*.build-info.json
            dist/PicShot-*.build-info.json.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload DMG installer and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-macos-${{ matrix.arch }}-DMG-${{ github.sha }}
          path: |
            dist/PicShot-*.dmg
            dist/PicShot-*.dmg.sha256
            dist/PicShot-*.build-info.json
            dist/PicShot-*.build-info.json.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  codec-dependencies:
    if: ${{ contains(github.event.head_commit.message || '', '[codec-build]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test pinned dependency policy and bounded process runner
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build exact official native codecs and run genuine C encode/decode tests
        timeout-minutes: 30
        run: |
          mkdir -p dist
          set -o pipefail
          python3 scripts/build-native-codecs.py --arch ${{ matrix.arch }} --jobs 4 2>&1 | tee dist/native-codecs.log
      - name: Preserve codec diagnostics and complete notices even on failure
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          base = Path('.build/native-codecs')
          target = Path('dist/codec-evidence'); target.mkdir(parents=True, exist_ok=True)
          for name in ('logs', 'evidence'):
              if (base / name).is_dir(): shutil.copytree(base / name, target / name, dirs_exist_ok=True)
          for path in base.glob('build-attempt-*.json'): shutil.copy2(path, target / path.name)
          for prefix in [base / 'install', *base.glob('install-*.staging')]:
              if not prefix.is_dir(): continue
              dest = target / prefix.name; dest.mkdir(exist_ok=True)
              for name in ('native-build.json', 'native-selftest-dependencies.txt'):
                  if (prefix / name).is_file(): shutil.copy2(prefix / name, dest / name)
              if (prefix / 'licenses').is_dir(): shutil.copytree(prefix / 'licenses', dest / 'licenses', dirs_exist_ok=True)
          PYTHON
      - name: Upload native dependency evidence without installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Codec-Dependencies-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/native-codecs.log
            dist/codec-evidence/
          if-no-files-found: warn
          retention-days: 14

  gif-attribution:
    if: ${{ contains(github.event.head_commit.message || '', '[gif-attribution]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build pinned native codecs needed by the app and its tests
        run: python3 scripts/build-native-codecs.py --arch ${{ matrix.arch }} --jobs 4
      - name: Test extraction equivalence, cancellation and diagnostic separation
        timeout-minutes: 8
        run: |
          mkdir -p dist
          set -o pipefail
          swift build --product PicShot
          swift test --filter 'GIF' 2>&1 | tee dist/gif-attribution-tests.log
      - name: Package signed exporter with explicit baseline and helper diagnostics
        run: |
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Compare in-process and isolated-helper export in fresh installed processes
        run: |
          set -o pipefail
          bash scripts/gif-attribution.sh 2>&1 | tee dist/gif-attribution.log
      - name: Upload observations without an installer release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-GIF-Diagnostics-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/evidence/gif-attribution/
          retention-days: 14

  gif-timing:
    if: ${{ contains(github.event.head_commit.message || '', '[gif-timing]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build pinned native codecs needed by the app and its tests
        run: python3 scripts/build-native-codecs.py --arch ${{ matrix.arch }} --jobs 4
      - name: Inspect encoded samples and GIF extraction boundaries
        run: |
          mkdir -p dist
          set -o pipefail
          swift build --product PicShot
          swift test --filter 'GIFRecordedInputCompatibilityTests' 2>&1 | tee dist/gif-timing.log
      - name: Upload timing evidence without installer publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-GIF-Timing-${{ matrix.arch }}-${{ github.sha }}
          path: dist/gif-timing.log
          if-no-files-found: ignore
          retention-days: 14

  codec-attribution:
    if: ${{ contains(github.event.head_commit.message || '', '[codec-attribution]') && !contains(github.event.head_commit.message || '', '[decode-large]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Package signed app for isolated codec observations
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Compile native attribution structure tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/attribution-test-build.log --report dist/attribution-test-build-report.json
          -- swift build --build-tests
      - name: Build real debug executables for attribution subprocesses
        run: |
          swift build --product PicShot
          swift build --product PicShotCodecHelper
      - name: Verify attribution structure without inferring memory stability
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/attribution-tests.log --report dist/attribution-tests-report.json
          -- swift test --skip-build --filter 'CodecExportAttribution|ImageAllocatorRelief|ImageRasterMaterialization|ImageDecodeDiagnostic|ImageDecodeHelperAttribution'
      - name: Run six fresh installed processes after separate input preparation
        if: ${{ !contains(github.event.head_commit.message || '', '[image-relief]') && !contains(github.event.head_commit.message || '', '[image-draw]') && !contains(github.event.head_commit.message || '', '[image-decode-helper]') }}
        run: |
          set -o pipefail
          bash scripts/codec-attribution.sh 2>&1 | tee dist/codec-attribution.log
      - name: Run explicitly selected self-only allocator comparison
        if: ${{ contains(github.event.head_commit.message || '', '[image-relief]') }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          bash scripts/image-relief-attribution.sh --compare "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-relief" 2>&1 | tee dist/image-relief-attribution.log
      - name: Run explicitly selected actual-draw comparison
        if: ${{ contains(github.event.head_commit.message || '', '[image-draw]') }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          bash scripts/image-draw-attribution.sh --compare "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-draw" 2>&1 | tee dist/image-draw-attribution.log
      - name: Compare signed PNG decoding with actual parent drawing
        if: ${{ contains(github.event.head_commit.message || '', '[image-decode-helper]') }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p test_check_image_decode_helper_report.py -v
          bash scripts/image-decode-helper-attribution.sh --compare "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-helper" 2>&1 | tee dist/image-decode-helper.log
      - name: Upload observations without publishing another installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Codec-Attribution-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/package.log
            dist/attribution-test-build.log
            dist/attribution-test-build-report.json
            dist/attribution-tests.log
            dist/attribution-tests-report.json
            dist/codec-attribution.log
            dist/evidence/codec-attribution/
            dist/image-relief-attribution.log
            dist/evidence/image-relief/
            dist/image-draw-attribution.log
            dist/evidence/image-draw/
            dist/image-decode-helper.log
            dist/evidence/image-decode-helper/
          if-no-files-found: warn
          retention-days: 14

  image-decode-large:
    if: ${{ contains(github.event.head_commit.message || '', '[decode-large]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check bounded diagnostic reports and process cleanup
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_check_image_decode*report.py' -v
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v
      - name: Build verified signed app without installers or model weights
        id: diagnostic_package
        env:
          PICSHOT_PACKAGE_APP_ONLY: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Compile native diagnostic and existing regression tests
        id: diagnostic_compile
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/decode-large-test-build.log --report dist/decode-large-test-build-report.json
          -- swift build --build-tests
      - name: Build real debug executables for lifecycle checks
        id: diagnostic_debug
        run: |
          swift build --product PicShot
          swift build --product PicShotCodecHelper
      - name: Verify old and new decode contracts and controller boundaries
        id: diagnostic_tests
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/decode-large-tests.log --report dist/decode-large-tests-report.json
          -- swift test --skip-build --filter 'ImageDecode|ImageRasterMaterialization|CodecExportAttribution|ImageExportController|ImageExportLayout|ImageExportService|CodecExportProcess|CodecHelperLifecycle'
      - name: Repeat original small PNG decode comparison
        timeout-minutes: 8
        run: |
          set -o pipefail
          bash scripts/image-decode-helper-attribution.sh --compare "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-helper" 2>&1 | tee dist/decode-small.log
      - name: Compare bounded large PNG previews and actual native window flows
        if: ${{ !contains(github.event.head_commit.message || '', '[decode-exit-latch]') }}
        timeout-minutes: 25
        env:
          PICSHOT_DECODE_TIMING_V3: ${{ contains(github.event.head_commit.message || '', '[decode-timing-v3]') && '1' || '0' }}
        run: |
          set -o pipefail
          if [[ "$PICSHOT_DECODE_TIMING_V3" == "1" ]]; then
            bash scripts/image-decode-large-attribution.sh --timing-v3 "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-timing-v3" 2>&1 | tee dist/decode-timing-v3.log
          else
            bash scripts/image-decode-large-attribution.sh --compare "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-large" 2>&1 | tee dist/decode-large.log
          fi
      # This is a diagnostic collection path, never installer acceptance. A failed
      # native test still fails the job; later observations retain that boundary.
      - name: Measure unchanged exit-wait reference in fresh processes
        if: ${{ !cancelled() && contains(github.event.head_commit.message || '', '[decode-exit-latch]') && steps.diagnostic_package.outcome == 'success' && steps.diagnostic_compile.outcome == 'success' && steps.diagnostic_debug.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p "$PWD/dist/evidence/image-decode-exit"
          bash scripts/image-decode-large-attribution.sh --timing-v3 "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-exit/wait-until-exit" 2>&1 | tee dist/decode-exit-reference.log
      - name: Measure opt-in termination latch in fresh processes
        if: ${{ !cancelled() && contains(github.event.head_commit.message || '', '[decode-exit-latch]') && steps.diagnostic_package.outcome == 'success' && steps.diagnostic_compile.outcome == 'success' && steps.diagnostic_debug.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p "$PWD/dist/evidence/image-decode-exit"
          bash scripts/image-decode-large-attribution.sh --termination-latch "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-exit/termination-latch" 2>&1 | tee dist/decode-exit-candidate.log
      - name: Verify controlled cancellation deadline and both measured arms
        if: ${{ !cancelled() && contains(github.event.head_commit.message || '', '[decode-exit-latch]') && steps.diagnostic_package.outcome == 'success' && steps.diagnostic_compile.outcome == 'success' && steps.diagnostic_debug.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          bash scripts/image-decode-exit-comparison.sh --finish "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-exit" 2>&1 | tee dist/decode-exit-comparison.log
      - name: Preserve diagnostic observations without installer publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Decode-${{ contains(github.event.head_commit.message || '', '[decode-exit-latch]') && 'Exit-Latch' || contains(github.event.head_commit.message || '', '[decode-timing-v3]') && 'Timing-V3' || 'Large' }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/*report.json
            dist/evidence/image-decode-helper/
            dist/evidence/image-decode-large/
            dist/evidence/image-decode-timing-v3/
            dist/evidence/image-decode-exit/
          if-no-files-found: warn
          retention-days: 14
