          bash scripts/image-decode-large-attribution.sh --termination-latch "$PWD/dist/PicShot.app" "$PWD/dist/evidence/image-decode-exit/termination-latch" 2>&1 | tee dist/decode-exit-candidate.log
      - name: Verify controlled cancellation deadline and both measured arms
        if: ${{ !cancelled() && contains(github.event.head_commit.message || '', '[decode-exit-latch]') && steps.diagnostic_package.outcome == 'success' && steps.diagnostic_compile.outcome == 'success' && steps.diagnostic_debug.outcome == 'success' }}
