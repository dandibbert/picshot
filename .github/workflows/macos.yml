      - name: Measure unchanged exit-wait reference in fresh processes
        if: ${{ !cancelled() && contains(github.event.head_commit.message || '', '[decode-exit-latch]') && steps.diagnostic_package.outcome == 'success' && steps.diagnostic_compile.outcome == 'success' && steps.diagnostic_debug.outcome == 'success' }}
