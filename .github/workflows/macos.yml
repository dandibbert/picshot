  # Optional observations only. No packaging, installed smoke, or release acceptance.
  native-timeout-diagnostic:
    if: ${{ contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') }}
    runs-on: macos-15
    concurrency:
      group: picshot-native-timeout-diagnostic-job-${{ github.ref }}
      cancel-in-progress: false
    # Explicit stage maxima total 96m baseline, or 126m with the opt-in control.
    # Five extra minutes cover step handovers. Each native process still has 420s.
    timeout-minutes: ${{ contains(github.event.head_commit.message || '', '[native-timeout-unbuffered]') && 131 || 101 }}
    env:
      # Preserve the original ARM build job's inherited native-test environment.
      NATIVE_TEST_PROCESS_COUNT: '4'
      FOCUSED_TEST_PROCESS_COUNT: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove exact source141 product and corrected diagnostic-only scope
        id: provenance
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p dist/native-timeout-diagnostic
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], timeout=20)
          base = 'a371ad60c8aec007482911b249dbeb03144b9486'
          source = os.environ['GITHUB_SHA']
          if git('rev-parse', 'HEAD').decode().strip() != source or git('rev-parse', 'HEAD^').decode().strip() != base:
              raise SystemExit('Diagnostic must directly inherit pinned source141')
          if platform.machine() != 'arm64' or platform.system() != 'Darwin':
              raise SystemExit('Expected the native ARM macOS runner')
          def entries(ref):
              return {row.split(b'\t', 1)[1]: row.split(b'\t', 1)[0]
                      for row in git('ls-tree', '-r', '-z', ref).split(b'\0') if row}
          before, after = entries(base), entries(source)
          changed = sorted(path for path in before.keys() | after.keys() if before.get(path) != after.get(path))
          allowed = [b'.github/workflows/macos.yml', b'scripts/native-observer-self-test.py',
                     b'scripts/native-test-diagnostics.py', b'scripts/tests/test_native_observer_self_test.py',
                     b'scripts/tests/test_native_test_diagnostics.py']
          if changed != allowed:
              raise SystemExit('Changed source exceeds the exact diagnostic workflow/helper/self-test scope')
          if any(not after[path].startswith(b'100644 blob ')
                 or not before.get(path, b'').startswith(b'100644 blob ') for path in allowed):
              raise SystemExit('Diagnostic executable recognition corrections must preserve existing regular file modes')
          workflow = '.github/workflows/macos.yml'
          original = git('show', base + ':' + workflow).decode()
          current = Path(workflow).read_text()
          # The installed job remains the final job, byte-for-byte unchanged.
          def installed_definition(text):
              return text[text.index('  installed-diagnostic:\n'):]
          if installed_definition(original) != installed_definition(current):
              raise SystemExit('Installed diagnostic job definition changed')
          if git('status', '--porcelain', '--untracked-files=no').strip():
              raise SystemExit('Tracked checkout differs from the verified source tree')
          inherited = b'\0'.join(path + b'\t' + after[path] for path in sorted(after) if path not in changed)
          record = dict(status='passed', diagnosticOnly=True, installerAcceptance=False,
              sourceCommit=source, referenceCommit=base, sourceTree=git('rev-parse', 'HEAD^{tree}').decode().strip(),
              referenceTree=git('rev-parse', base + '^{tree}').decode().strip(),
              changedPaths=[path.decode() for path in changed], unchangedTrackedEntries=len(after)-len(changed),
              unchangedEntriesSHA256=hashlib.sha256(inherited).hexdigest(), architecture=platform.machine(),
              installedDiagnosticDefinitionUnchanged=True, workflowRunID=os.environ['GITHUB_RUN_ID'],
              workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
              nativeProcessEnvironment={key: os.environ.get(key) for key in (
                  'NATIVE_TEST_PROCESS_COUNT', 'FOCUSED_TEST_PROCESS_COUNT')},
              inheritedUnbufferedIO=dict(present='NSUnbufferedIO' in os.environ,
                  recognizedSetting=os.environ.get('NSUnbufferedIO') if os.environ.get('NSUnbufferedIO') in
                      {'YES', 'NO', '1', '0', 'true', 'false'} else None),
              inheritedCodecHelperOverridePresent='PICSHOT_CODEC_HELPER_PATH' in os.environ,
              stageMinutesBaseline=96, stageMinutesWithControl=126,
              jobMinutesBaseline=101, jobMinutesWithControl=131, nativeSecondsPerProcess=420)
          Path('dist/native-timeout-diagnostic/source-identity.json').write_text(json.dumps(record, indent=2)+'\n')
          PYTHON
      - name: Verify original runner and native plan plus optional observer contracts
        id: contracts
        timeout-minutes: 2
        run: |
          set -o pipefail
          for pattern in test_run_bounded_command.py test_native_test_shards.py test_native_test_diagnostics.py test_native_observer_self_test.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p "$pattern" -v 2>&1 | tee -a dist/native-timeout-diagnostic/contracts.log
          done
      - name: Verify the same contracts with Python assertions disabled
        id: optimized_contracts
        timeout-minutes: 2
        run: |
          set -o pipefail
          for pattern in test_run_bounded_command.py test_native_test_shards.py test_native_test_diagnostics.py test_native_observer_self_test.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p "$pattern" -v 2>&1 | tee -a dist/native-timeout-diagnostic/contracts-optimized.log
          done
      - name: Prove real SwiftPM descendant sampling and retirement before product work
        id: observer_self_test
