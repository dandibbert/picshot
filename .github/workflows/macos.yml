        run: |
          set -o pipefail
          python3 scripts/native-test-diagnostics.py suite \
            --plan dist/native-timeout-diagnostic/native-tests-plan.json --expected-source "$GITHUB_SHA" \
            --directory dist/native-timeout-diagnostic/baseline/shards \
            --diagnostics dist/native-timeout-diagnostic/baseline/observations \
