name: Native macOS build and verification
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ (!contains(github.event.head_commit.message || '', '[gif-attribution]') || contains(github.event.head_commit.message || '', '[verify-installers]')) && !contains(github.event.head_commit.message || '', '[gif-timing]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Package signed native app for early pixel review
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Render native UI from installed ZIP before slow verification
        run: |
          set -o pipefail
          bash scripts/ui-preview.sh 2>&1 | tee dist/ui-preview.log
      - name: Upload early native UI preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-UI-${{ matrix.arch }}-${{ github.sha }}
          path: dist/evidence/ui/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check annotation, GIF, recording durability and inference boundaries
        timeout-minutes: 8
        run: |
          mkdir -p dist
          set -o pipefail
          swift build --product PicShot
          swift test --filter 'GIF|AnnotationEffectsTests|AnnotationEffectsPreviewTests|RecordingCameraTests|RecordingCompositionTests|RecordingOverlayControlTests|RecordingCompositionSmokeTests|RecordingRecovery|VideoTrimTests|RecordingPauseTests|LocalInferenceResourceTests|LocalInferenceServiceTests|InferenceTestSynchronizationTests' 2>&1 | tee dist/critical-tests.log
      - name: Recover actual abruptly terminated synthetic recording from installed app
        timeout-minutes: 4
        run: |
          set -o pipefail
          bash scripts/recording-recovery-smoke.sh 2>&1 | tee dist/recording-recovery.log
      - name: Test native modules
        timeout-minutes: 8
        run: |
          mkdir -p dist
          set -o pipefail
          swift test 2>&1 | tee dist/test.log
      - name: Validate native inference with approved pinned original model fixtures
        run: |
          set -o pipefail
          python3 scripts/fetch-model-fixtures.py 2>&1 | tee dist/model-download.log
          python3 scripts/SmartErase-fetch-fixture.py 2>&1 | tee dist/erase-model-download.log
          export PICSHOT_ERASE_MODEL_DIR="$PWD/.build/model-fixtures/erase"
          export PICSHOT_FORMULA_MODEL_DIR="$PWD/.build/model-fixtures/formula"
          export PICSHOT_TEST_TABLE_MODEL_DIR="$PWD/.build/model-fixtures/table"
          export PICSHOT_TEST_ML_HELPER="$(swift build --show-bin-path)/PicShotMLHelper"
          swift build --product PicShotMLHelper
          swift test --filter 'FormulaEngineTests|RecordedModelOutputTests|SmartEraseEngineTests' 2>&1 | tee dist/model-inference.log
      - name: Install and launch both formats, render native UI, measure repeated cycles
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee dist/smoke.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-QA-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/evidence/
          retention-days: 14
      - name: Upload installer bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/PicShot-*.zip
            dist/PicShot-*.dmg
            dist/PicShot-*.json
            dist/PicShot-*.sha256
          if-no-files-found: error
          retention-days: 14

  gif-attribution:
    if: ${{ contains(github.event.head_commit.message || '', '[gif-attribution]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test extraction equivalence, cancellation and diagnostic separation
        timeout-minutes: 8
        run: |
          mkdir -p dist
          set -o pipefail
          swift build --product PicShot
          swift test --filter 'GIF' 2>&1 | tee dist/gif-attribution-tests.log
      - name: Package signed exporter with explicit baseline and helper diagnostics
        run: |
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Compare in-process and isolated-helper export in fresh installed processes
        run: |
          set -o pipefail
          bash scripts/gif-attribution.sh 2>&1 | tee dist/gif-attribution.log
      - name: Upload observations without an installer release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-GIF-Diagnostics-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.log
            dist/evidence/gif-attribution/
          retention-days: 14

  gif-timing:
    if: ${{ contains(github.event.head_commit.message || '', '[gif-timing]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inspect encoded samples and GIF extraction boundaries
        run: |
          mkdir -p dist
          set -o pipefail
          swift build --product PicShot
          swift test --filter 'GIFRecordedInputCompatibilityTests' 2>&1 | tee dist/gif-timing.log
      - name: Upload timing evidence without installer publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-GIF-Timing-${{ matrix.arch }}-${{ github.sha }}
          path: dist/gif-timing.log
          if-no-files-found: ignore
          retention-days: 14
