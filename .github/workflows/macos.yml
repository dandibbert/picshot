          observer_files = {name.decode(): hashlib.sha256((observer/name.decode()).read_bytes()).hexdigest()
                            for name in sorted(allowed)}
          record = dict(schemaVersion=2, status='passed', diagnosticOnly=True, installerAcceptance=False,
              sourceCommit=product_source, sourceTree=product_tree, productWorkingDirectory=str(product),
