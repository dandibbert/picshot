      - name: Verify retained source and archived workflow after diagnostic checks
        id: final_source_identity
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('dist/live-scroll-remainder')
          record = json.loads((root/'source-identity.json').read_text())
          identity = subprocess.check_output(['git','rev-parse','HEAD','HEAD^{tree}'], text=True, timeout=10).splitlines()
          if (identity != [os.environ['PICSHOT_REMAINDER_SOURCE'], os.environ['PICSHOT_REMAINDER_TREE']]
                  or subprocess.check_output(['git','status','--porcelain','--untracked-files=no'], timeout=10).strip()
                  or hashlib.sha256((root/'diagnostic-workflow.yml').read_bytes()).hexdigest() != record['diagnosticWorkflowSHA256']
                  or hashlib.sha256(Path('.github/workflows/macos.yml').read_bytes()).hexdigest() != record['retainedWorkflowSHA256']):
              raise SystemExit('Exact retained source or diagnostic workflow archive changed')
          (root/'final-source-identity.json').write_text(json.dumps(dict(status='passed',
              diagnosticOnly=True, sourceCommit=identity[0], sourceTree=identity[1],
              workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
              installerAcceptance=False, fullMemoryQualification=False, testingPackageEligible=False), indent=2)+'\n')
          PYTHON
      # Bound evidence publication only; product/test limits and raw reports are unchanged.
      # Each compressed archive stays below31MiB, leaving transfer/header margin.
      - name: Prepare bounded diagnostic records and separate format evidence
        id: evidence_archives
        if: always()
        timeout-minutes: 3
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path('dist/live-scroll-remainder')
          root.mkdir(parents=True, exist_ok=True)
          target = Path('dist/live-scroll-remainder-artifacts'); target.mkdir(parents=True, exist_ok=True)
          groups = {'records': ['dist/live-scroll-remainder/', 'dist/native-dependencies-preflight.log', 'dist/native-dependencies-preflight-report.json', 'dist/installed-default-contracts.log', 'dist/installed-default-contracts-optimized.log', 'dist/package.log', 'dist/ui-preview.log', 'dist/recording-recovery.log', 'dist/model-download.log', 'dist/erase-model-download.log', 'dist/model-inference.log', 'dist/smoke.log', 'dist/editable-product-installed-default.log', 'dist/editable-product-installed-default-report.json', 'dist/evidence/pin-apply-regression/', 'dist/evidence/recording-recovery/', 'dist/evidence/installed-format-identity.json'], 'zip': ['dist/live-scroll-remainder/source-identity.json', 'dist/evidence/zip/'], 'dmg': ['dist/live-scroll-remainder/source-identity.json', 'dist/evidence/dmg/']}
          budget = 31 * 1024 * 1024
          records = {}
          for name, inputs in groups.items():
              archive = target/(name+'.zip')
              record = dict(status='not-uploadable', inputs=inputs, archiveBudgetBytes=budget,
                  maxInputBytes=256*1024*1024, maxFileCount=4096, rawReportsModified=False)
              records[name] = record
              try:
                  candidates = []
                  for entry in inputs:
                      path = Path(entry)
                      if path.is_symlink(): raise ValueError('Refuse symlink evidence root: '+str(path))
                      candidates.extend([path] if path.is_file() else path.rglob('*'))
                  if any(file.is_symlink() or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage'))
                          for part in file.parts) for file in candidates):
                      raise ValueError('Refuse symlink, application, or compiled model evidence entry')
                  files = sorted({file for file in candidates if not file.is_dir()})
                  if not files or (name in ('zip', 'dmg') and not any(str(file).startswith('dist/evidence/'+name+'/') for file in files)):
                      raise ValueError('No stage evidence files were produced')
                  if len(files) > record['maxFileCount']: raise ValueError('Evidence file-count bound exceeded')
                  total = 0
                  for file in files:
                      if (file.is_symlink() or not file.is_file()
                              or not file.resolve().is_relative_to(Path('dist').resolve())
                              or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage')) for part in file.parts)
                              or file.suffix.lower() in {'.dmg', '.zip', '.onnx', '.mlmodel', '.bin', '.weights', '.safetensors', '.pt', '.pth', '.ckpt', '.tflite', '.pb'}
                              or file.name.startswith('PicShot-')):
                          raise ValueError('Refuse nonregular, escaped, or installer evidence input: '+str(file))
                      total += file.stat().st_size
                  record.update(fileCount=len(files), inputBytes=total)
                  if total > record['maxInputBytes']: raise ValueError('Evidence input-byte bound exceeded')
                  with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
                      for file in files:
                          output.write(file, file.as_posix())
                          if output.fp.tell() >= budget: raise ValueError('Compressed evidence exceeds31MiB')
                  record['archiveBytes'] = archive.stat().st_size
                  if record['archiveBytes'] >= budget: raise ValueError('Final evidence archive exceeds31MiB')
                  record.update(status='ready', archive=str(archive), archiveSHA256=hashlib.sha256(archive.read_bytes()).hexdigest())
              except Exception as error:
                  record['error'] = str(error)
                  archive.unlink(missing_ok=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(name+'='+str(record['status'] == 'ready').lower()+'\n')
          report = dict(diagnosticOnly=True, installerAcceptance=False, fullMemoryQualification=False,
              testingPackageEligible=False, sourceCommit=os.environ['PICSHOT_REMAINDER_SOURCE'],
              workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
              archiveBudgetBytes=budget, rawEvidencePreservedOnRunner=True, archives=records)
          (root/'evidence-archives.json').write_text(json.dumps(report, indent=2)+'\n')
          if any(record['status'] != 'ready' for record in records.values()):
              raise SystemExit('Some diagnostic evidence is absent or oversized; see evidence-archives.json')
          PYTHON
