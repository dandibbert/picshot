        Path('dist/renderer-storage-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'bundlePath': str(app), 'architecture': 'arm64',
            'executableSHA256': hashlib.sha256((app / 'Contents/MacOS/PicShot').read_bytes()).hexdigest(),
            'oneBinaryForEveryCell': True, 'diagnosticSelectionChangesCompiledDefault': False, 'installerAcceptance': False
        }, indent=2) + '\n')
