      - name: Require exact retirement and GIF fixture native coverage before installed observations
        id: retirement_gif
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          root = Path('dist/evidence/installed-diagnostic')
          record = dict(status='running', diagnosticOnly=True, installerAcceptance=False,
