        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/editable-components-native-tests.log --report dist/editable-components-native-tests.json -- swift test --skip-build --filter 'EditableComponentFixtureTests|SourceFormatOwnedCopyTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/editable-components-test-discovery.log').read_text()
        classes = {'PicShotTests.EditableComponentFixtureTests', 'PicShotTests.SourceFormatOwnedCopyTests'}
        expected = [name for name in native.discover(inventory) if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes, 'Missing native component or source-format fidelity cases')
        log = Path('dist/editable-components-native-tests.log').read_text()
