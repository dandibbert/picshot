          PICSHOT_REMAINDER_REQUIRED_STEPS: '["checkout_source227","provenance","runner_contracts","settings_contracts","pin_contracts","classification_contracts","drawing_contracts","drawing_contracts_optimized","codec_dependencies","debug_build","test_build","codec_helper","discovery","inventory","package","package_identity","native_ui","recording_exports","backing","default_routes","fidelity","pin_apply","focused_native","recording_recovery","full_native","model_inference","installed_smoke","final_source_identity","evidence_archives"]'
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path('dist/live-scroll-remainder'); root.mkdir(parents=True, exist_ok=True)
          observed = json.loads(os.environ['PICSHOT_REMAINDER_STEP_RESULTS'])
          required = json.loads(os.environ['PICSHOT_REMAINDER_REQUIRED_STEPS'])
          outcomes = {name:dict(outcome=observed.get(name, {}).get('outcome', 'not-run'),
              conclusion=observed.get(name, {}).get('conclusion', 'not-run')) for name in required}
          completed = all(value['outcome'] == 'success' for value in outcomes.values())
          record = dict(status='diagnostic-checks-completed' if completed else 'diagnostic-checks-incomplete-or-failed',
              diagnosticOnly=True, installerAcceptance=False, fullMemoryQualification=False,
              testingPackageEligible=False, latestAcceptedBuild=214, originalFailureRunID='38130153505',
              originalResourceFailurePreserved=True, liveScrollResourceRerun=False,
              sourceCommit=os.environ['PICSHOT_REMAINDER_SOURCE'], sourceTree=os.environ['PICSHOT_REMAINDER_TREE'],
              triggerCommit=os.environ['GITHUB_SHA'], diagnosticWorkflowCommit=os.environ['PICSHOT_REMAINDER_WORKFLOW_SHA'],
              workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
              buildVersion=os.environ['GITHUB_RUN_NUMBER'], stageOutcomes=outcomes,
              unrunStages=[name for name,value in outcomes.items() if value['outcome'] in ('skipped','not-run')],
              failedStages=[name for name,value in outcomes.items() if value['outcome'] in ('failure','cancelled')])
          (root/'outcomes.json').write_text(json.dumps(record, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Diagnostic-only retained227 remainder; stable214 remains the latest accepted build.\n\n')
              output.write('installerAcceptance=false; fullMemoryQualification=false; testingPackageEligible=false.\n\n')
              output.write('Original warmRSS and lateRSS failures remain recorded in run38130153505; the cell was not rerun.\n\n')
              for name,value in outcomes.items(): output.write(name+': '+value['outcome']+'\n\n')
          if not completed: raise SystemExit('Diagnostic remainder has failed, cancelled, or unrun stages; see outcomes.json')
          PYTHON
