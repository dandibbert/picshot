          from pathlib import Path
          root = Path('dist/native-timeout-diagnostic')
          status = json.loads((root/'baseline/test-report-diagnostic-status.json').read_text())
          if not (status.get('cleanupConfirmed') is True and status.get('completedIndices') == [0, 1, 2, 3]
                  and status.get('sourceCommit') == os.environ['GITHUB_SHA']
                  and status.get('outputMode') == 'baseline' and status.get('status') == 'native-failed'):
              raise SystemExit('Baseline native/sampler retirement is uncertain; control is forbidden')
          records = [json.loads((root/f'baseline/shards/shard-{index}-runner.json').read_text()) for index in range(4)]
          if any(record.get('status') not in {'exited', 'timeout'}
                 or record.get('termination_reason') != record.get('status')
                 or record.get('child_returncode') is None or record.get('cleanup_errors')
                 or record.get('timeout_seconds') != 420 for record in records):
              raise SystemExit('Baseline lacks four cleanly retired original native processes')
          timeout_indices = [index for index, record in enumerate(records)
                             if record['status'] == 'timeout' and record['exit_code'] == 124]
          if not timeout_indices or status.get('nativeTimedOutIndices') != timeout_indices:
              raise SystemExit('No matching verified baseline timeout; optional control is not useful')
          rows = subprocess.check_output(['/bin/ps', '-ax', '-o', 'pid=,comm='], text=True, timeout=5).splitlines()
          matches = []
          for row in rows:
              pid, command = row.strip().split(None, 1)
              name = Path(command).name
              if name.startswith('PicShot') or name in {'swift', 'swift-frontend', 'swift-test', 'xctest', 'sample'} or '.xctest/' in command:
                  matches.append(dict(pid=int(pid), command=command))
          (root/'control-process-preflight.json').write_text(json.dumps(dict(
              status='failed' if matches else 'passed', sourceCommit=os.environ['GITHUB_SHA'],
              observedProcesses=matches, priorProcessesTerminatedByThisCheck=False, baselineTimeoutIndices=timeout_indices,
              diagnosticOnly=True, installerAcceptance=False, baselineFailurePreserved=True), indent=2)+'\n')
          if matches:
              raise SystemExit('Prior native/sampler process remains; refusing overlapping control')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=true\n')
          PYTHON
      - name: Observe separate opt-in unbuffered full-suite control
        id: unbuffered_control
        if: ${{ !cancelled() && steps.control_gate.outputs.run == 'true' }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          python3 scripts/native-test-diagnostics.py suite \
            --plan dist/native-timeout-diagnostic/native-tests-plan.json --expected-source "$GITHUB_SHA" \
            --directory dist/native-timeout-diagnostic/unbuffered-control/shards \
            --diagnostics dist/native-timeout-diagnostic/unbuffered-control/observations \
            --output dist/native-timeout-diagnostic/unbuffered-control/test-report.json --output-mode unbuffered \
            2>&1 | tee dist/native-timeout-diagnostic/unbuffered-control-execution.log
      - name: Record baseline and optional control outcomes without release acceptance
        if: always()
        timeout-minutes: 2
        env:
          PICSHOT_NATIVE_DIAGNOSTIC_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p dist/native-timeout-diagnostic
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path('dist/native-timeout-diagnostic')
          observations = {}
          for mode in ('baseline', 'unbuffered-control'):
              path = root/mode/'test-report-diagnostic-status.json'
              try:
