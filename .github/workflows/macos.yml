          app="$installed/PicShot.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/PicShot")" = arm64
          for relative in Contents/MacOS/PicShot Contents/Info.plist Contents/Resources/build-info.json; do
            cmp "dist/PicShot.app/$relative" "$app/$relative"
          done
          python3 - "$app" <<'PYTHON'
          import hashlib, json, os, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          if str(app.resolve()) != str(app): raise SystemExit('Noncanonical installed application')
          info = plistlib.loads((app/'Contents/Info.plist').read_bytes())
          build = json.loads((app/'Contents/Resources/build-info.json').read_bytes())
          if not (info['PicShotSourceCommit'] == build['sourceCommit'] == os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE']
                  and info['CFBundleVersion'] == os.environ['GITHUB_RUN_NUMBER']
                  and info['CFBundleShortVersionString'] == build['version'] == '0.17.0'
