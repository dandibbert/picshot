  # No installer acceptance: only the previously blocked gates run against clean-built227.
  blocked-installers227:
    if: ${{ !contains(github.event.head_commit.message || '', '[experimental-installer227]') && github.event_name == 'push' && contains(github.event.head_commit.message || '', '[blocked-installers227]')
      }}
    runs-on: macos-15
    timeout-minutes: 318
    env:
      PICSHOT_BLOCKED_SOURCE: e5a859a82b2a7a697e51a0a4d42f34ae4f5602d0
      PICSHOT_BLOCKED_TREE: bee9ab45ee7770f2aab84565f392934f21903030
      PICSHOT_BLOCKED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      id: checkout_source227
      with:
        ref: e5a859a82b2a7a697e51a0a4d42f34ae4f5602d0
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact227 source and isolated corrected checker contracts
      id: provenance
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path

        def git(*args):
            return subprocess.check_output(['git', *args], timeout=10)
        def digest(data):
            return hashlib.sha256(data).hexdigest()
        def need(value, message):
            if not value: raise ValueError(message)
        source, tree = os.environ['PICSHOT_BLOCKED_SOURCE'], os.environ['PICSHOT_BLOCKED_TREE']
        workflow = os.environ['PICSHOT_BLOCKED_WORKFLOW_SHA']
        if int(os.environ['GITHUB_RUN_NUMBER']) <= 228: raise ValueError('A new build number after228 is required')
        root = Path('dist/blocked-installers227'); root.mkdir(parents=True, exist_ok=True)
        need(git('rev-parse', 'HEAD', 'HEAD^{tree}').decode().splitlines() == [source, tree], 'Not retained227 source/tree')
        need(not git('status', '--porcelain', '--untracked-files=no').strip(), 'Tracked source is not clean before packaging')
        need(platform.system() == 'Darwin' and platform.machine() == 'arm64', 'Native ARM macOS required')
        need(workflow == os.environ['GITHUB_SHA'], 'Workflow and trigger commits differ')
        allowed = {'.github/workflows/macos.yml', 'docs/LiveScrollResources.md', 'docs/VERIFICATION.md',
                   'scripts/check-pin-management.py', 'scripts/tests/test_check_pin_management.py'}
        trigger_changes = set(git('diff', '--name-only', source, workflow).decode().splitlines())
        need(trigger_changes <= allowed, 'Trigger commit changed a product or other unauthorized path')
        workflow_bytes = git('show', workflow+':.github/workflows/macos.yml')
        (root/'diagnostic-workflow.yml').write_bytes(workflow_bytes)
        need(digest(Path('.github/workflows/macos.yml').read_bytes()) == 'b09a4f78c221c77e5db83dc3cfedecc2abeb08162f41b00ee4397fff70a4b2c1', 'Original227 workflow mismatch')
        contracts = {'scripts/check-pin-management.py': {'originalSHA256': '5a192a6a6491952d7929a61de56d2db74c473f8738a0c953407ebce2ec783a27', 'runtimeSHA256': 'b7361abfa65af626930dd429a933f270b34910c8c82ef561dc54e01691f12b6f', 'runtimeBlob': 'df983dc6120f2a791f076f9e01a11db081b36cd6', 'updated': True}, 'scripts/tests/test_check_pin_management.py': {'originalSHA256': '116899204c00570a2bbc9a95748e91433be88f2b2eaf1b08e36dfebed5e7eaef', 'runtimeSHA256': '639b68fdb469040784c573ef804982d7628228b8d887c571a20291b1a2796c58', 'runtimeBlob': 'b8c72f5570d02d2f045ff33bbbc49ef16dc0b619', 'updated': True}, 'scripts/check-portable-settings.py': {'originalSHA256': 'a8c783145688e6c19452779faf2c88966a987cf8049735f7ad103ceefbe88b24', 'runtimeSHA256': 'a8c783145688e6c19452779faf2c88966a987cf8049735f7ad103ceefbe88b24', 'runtimeBlob': 'db71dd6c92da8c34fc535769f54ff8a58f6bbb1e', 'updated': False}, 'scripts/check-automatic-mosaic-report.py': {'originalSHA256': 'f1e7b393b83292c52a98d70c82665d2b40cd08a9c3af1bd92a38b4c44d73ec85', 'runtimeSHA256': 'f1e7b393b83292c52a98d70c82665d2b40cd08a9c3af1bd92a38b4c44d73ec85', 'runtimeBlob': '0199a97ddac13d13680b7f300f7dc097b4121148', 'updated': False}, 'scripts/tests/test_check_portable_settings.py': {'originalSHA256': '47f3deae262f7e765a2622b570f94aed44427521e1f77eae6e0a1235e92d16b8', 'runtimeSHA256': '47f3deae262f7e765a2622b570f94aed44427521e1f77eae6e0a1235e92d16b8', 'runtimeBlob': '48b0319676f2a3a7a665e676f6f52b666b69db06', 'updated': False}}
        isolated = Path(os.environ['RUNNER_TEMP'])/('picshot-pin-checker-contracts-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
        need(not isolated.exists(), 'Contract directory must be new')
        for path, expected in contracts.items():
            original = git('show', source+':'+path)
            need(digest(original) == expected['originalSHA256'], 'Original contract hash differs: '+path)
            origin = workflow if expected['updated'] else source
            payload = git('show', origin+':'+path)
            need(digest(payload) == expected['runtimeSHA256'], 'Proposed contract hash differs: '+path)
            need(git('rev-parse', origin+':'+path).decode().strip() == expected['runtimeBlob'], 'Proposed contract blob differs: '+path)
            destination = isolated/path; destination.parent.mkdir(parents=True, exist_ok=True); destination.write_bytes(payload)

        for path, expected in {'scripts/smoke.sh': '91ea65c5483960f94674f8284ef3231afad1ec7b20a83a6692833924de797a4d', 'scripts/ui-preview.sh': '6a672ba5af1e624b129d13f59c1c5631992f0e3a1bd295ef811a6b96e87dabbc', 'scripts/package.sh': '83a967b25c2ba21dd80fcc3d0cbab2c44d3f6e29bcc80df7cb7f0cd5339f3b14'}.items():
            need(digest(Path(path).read_bytes()) == expected, 'Original script bytes differ: '+path)
        record = dict(status='source-and-contracts-verified', diagnosticOnly=True, installerAcceptance=False,
            fullMemoryQualification=False, testingPackageEligible=False, installerArtifactsPublished=False,
            sourceCommit=source, sourceTree=tree, retainedProductBuild=227, latestAcceptedBuild=214,
            triggerCommit=os.environ['GITHUB_SHA'], diagnosticWorkflowCommit=workflow,
            diagnosticWorkflowTree=git('rev-parse', workflow+'^{tree}').decode().strip(),
            diagnosticWorkflowBlob=git('rev-parse', workflow+':.github/workflows/macos.yml').decode().strip(),
            diagnosticWorkflowSHA256=digest(workflow_bytes), triggeringChangedPaths=sorted(trigger_changes),
            checkerCommit=workflow, checkerBlob=contracts['scripts/check-pin-management.py']['runtimeBlob'],
            checkerSHA256=contracts['scripts/check-pin-management.py']['runtimeSHA256'],
            originalCheckerSHA256=contracts['scripts/check-pin-management.py']['originalSHA256'],
            isolatedContractDirectory=str(isolated), contractFiles=contracts,
            originalTrackedTreeClean=True, runtimeOverlayApplied=False,
            workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
            diagnosticBuildVersion=os.environ['GITHUB_RUN_NUMBER'], architecture=platform.machine(),
            priorCompletedEvidence=dict(runID='38133056370', build=228, workflowCommit='c23e1de960d2f710defb033f3719018968d393fd',
                focusedPassed=1616, fullDiscovered=2148, fullClasses=245, fullPassed=2145,
                approvedModelSkips=3, separatePinnedModelPassed=12, repeated=False),
            originalFailure=dict(runID='38130153505', sourceCommit=source, warmRSS='failed', lateRSS='failed', preserved=True, rerun=False),
            scope='Previously blocked installed UI and sequential ZIP/DMG gates only; model downloads support installed-app inference')
        (root/'source-identity.json').write_text(json.dumps(record, indent=2)+'\n')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('PICSHOT_BLOCKED_CONTRACT_ROOT='+str(isolated)+'\n')
        PYTHON
    - name: Run corrected Python checker tests outside tracked source
      id: pin_contracts
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        set -o pipefail
