                        and report['exit_code'] == report['child_returncode'] == 0
                        and report['timeout_seconds'] == seconds and report['command'] == command
                        and report['log_bytes'] == len(raw.encode()) and not report['log_truncated']
                        and not report['sigterm_sent'] and not report['sigkill_sent'],
                        'Native inventory or test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Native diagnostic cases skipped')
