        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/seed-render-crop-native-tests.log --report dist/seed-render-crop-native-tests.json -- swift test --skip-build --filter 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests|SeedRenderCropSubstageProbeTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/seed-render-crop-test-discovery.log').read_text()
        discovered = native.discover(inventory)
        classes = {'PicShotTests.DrawingRasterTests', 'PicShotTests.RendererStorageTests',
                   'PicShotTests.EffectContextConfigurationTests', 'PicShotTests.EffectContextGuardControlTests',
                   'PicShotTests.SeedRenderCropSubstageProbeTests'}
        expected = [name for name in discovered if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes,
                    'Native drawing/renderer/effect/substage class inventory differs')
        probe_methods = {
            'testAbsentFlagIsNoOpAndFiniteSelectionFixesEveryAxis',
            'testInvalidSelectorsRoutesAndPolicyChangesFailClosed',
            'testSchemaRawByteBindingsAndCompleteMemoryArePreserved',
            'testActualFullMemoryDictionaryRoundTripsWithoutLosingBackingFields',
            'testExactBoundsOrderAndMissingWorkflowRejection',
            'testExistingDrawingMetadataDoesNotSampleOrRetainObjects',
            'testMemorySchemaRejectsObjectsMissingBackingAndOversizeMetadata',
            'testRunningWriteDoesNothingAndFinalSidecarIsBounded',
        }
        native.need({name.split('/')[1] for name in expected if name.split('/')[0] == 'PicShotTests.SeedRenderCropSubstageProbeTests'}
                    == probe_methods, 'The eight dedicated substage cases differ')
        discovery = json.loads(Path('dist/seed-render-crop-test-discovery.json').read_text())
        runner = json.loads(Path('dist/seed-render-crop-native-tests.json').read_text())
        log = Path('dist/seed-render-crop-native-tests.log').read_text()
        for report, seconds, command, raw in [
            (discovery, 60, ['swift', 'test', 'list', '--skip-build'], inventory),
            (runner, 420, ['swift', 'test', '--skip-build', '--filter', 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests|SeedRenderCropSubstageProbeTests'], log),
        ]:
            native.need(report['status'] == report['termination_reason'] == 'exited'
                        and report['exit_code'] == report['child_returncode'] == 0
                        and report['timeout_seconds'] == seconds and report['command'] == command
                        and report['log_bytes'] == len(raw.encode()) and not report['log_truncated']
                        and not report['sigterm_sent'] and not report['sigkill_sent'],
                        'Native inventory or test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Native diagnostic cases skipped')
