# Full experimental qualification includes checked Copy and transactional long-capture Save/Pin; all ordinary gates remain intact.
name: Native macOS build and verification
on:
  push:
    branches: ['feat/**']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picshot-${{ github.ref }}-${{ contains(github.event.head_commit.message || '', '[experimental-installer227]') && 'experimental-installer227' || contains(github.event.head_commit.message || '', '[blocked-installers227]') && 'blocked-installers227' || contains(github.event.head_commit.message || '', '[live-scroll-remainder]') && 'live-scroll-remainder' || contains(github.event.head_commit.message || '', '[pin-ui-diagnostic]') && 'pin-ui-diagnostic' || contains(github.event.head_commit.message || '', '[shortcut-isolation]') && 'shortcut-isolation' || contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && 'intel154-fresh-diagnostic' || contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && 'native-timeout-diagnostic' || contains(github.event.head_commit.message || '', '[installed-diagnostic]') && 'installed-diagnostic' || contains(github.event.head_commit.message || '', '[editable-product-resource]') && contains(github.event.head_commit.message || '', '[editable-documents]') && 'editable-product-resource' || contains(github.event.head_commit.message || '', '[seed-render-crop]') && 'seed-render-crop' || contains(github.event.head_commit.message || '', '[effect-context]') && 'effect-context' || contains(github.event.head_commit.message || '', '[renderer-scope-controls]') && 'renderer-scope-controls' || contains(github.event.head_commit.message || '', '[renderer-storage]') && 'renderer-storage' || contains(github.event.head_commit.message || '', '[drawing-pair]') && 'drawing-pair' || contains(github.event.head_commit.message || '', '[editable-observation]') && 'editable-observation' || contains(github.event.head_commit.message || '', '[callout-retirement]') && 'callout-retirement' || contains(github.event.head_commit.message || '', '[editable-documents]') && 'editable-documents' || contains(github.event.head_commit.message || '', '[multiwindow-memory]') && 'multiwindow-memory' || contains(github.event.head_commit.message || '', '[recording-wait]') && 'recording-wait' || contains(github.event.head_commit.message || '', '[manual-hash]') && 'manual-hash' || contains(github.event.head_commit.message || '', '[scroll-memory]') && 'scroll-memory' || contains(github.event.head_commit.message || '', '[decode-exit-latch]') && 'decode-exit-latch' || contains(github.event.head_commit.message || '', '[decode-timing-v3]') && 'decode-timing-v3' || contains(github.event.head_commit.message || '', '[decode-large]') && 'decode-large' || contains(github.event.head_commit.message || '', '[pin-workflows]') && 'pins-010' || contains(github.event.head_commit.message || '', '[intel-only]') && 'intel-05' || 'current' }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message || '', '[experimental-installer227]') && !contains(github.event.head_commit.message || '', '[blocked-installers227]') && !contains(github.event.head_commit.message || '', '[live-scroll-remainder]') && !contains(github.event.head_commit.message || '', '[pin-ui-diagnostic]') && !contains(github.event.head_commit.message || '', '[shortcut-isolation]') && !contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && !contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && !contains(github.event.head_commit.message || '', '[installed-diagnostic]') && !(contains(github.event.head_commit.message || '', '[editable-product-resource]') && contains(github.event.head_commit.message || '', '[editable-documents]')) && !contains(github.event.head_commit.message || '', '[seed-render-crop]') && !contains(github.event.head_commit.message || '', '[effect-context]') && !contains(github.event.head_commit.message || '', '[renderer-scope-controls]') && !contains(github.event.head_commit.message || '', '[renderer-storage]') && !contains(github.event.head_commit.message || '', '[drawing-pair]') && !contains(github.event.head_commit.message || '', '[callout-retirement]') && !contains(github.event.head_commit.message || '', '[editable-observation]') }}
jobs:
  live-scroll-preview:
    if: ${{ contains(github.event.head_commit.message || '', '[live-scroll-preview]') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Check bounded PNG pair report contracts
      if: ${{ contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      timeout-minutes: 2
      run: |
        python3 -m unittest discover -s scripts/tests -p 'test_live_scroll_png_pair.py'
        python3 -O -m unittest discover -s scripts/tests -p 'test_live_scroll_png_pair.py'
    - name: Build native dependencies
      timeout-minutes: 15
      run: python3 scripts/run-bounded-command.py --timeout-seconds 840 --log dist/live-scroll-dependencies.log --report dist/live-scroll-dependencies.json -- python3 scripts/build-native-codecs.py --arch arm64
    - name: Build separate owned native scrolling target
      timeout-minutes: 3
      run: python3 scripts/run-bounded-command.py --timeout-seconds 150 --log dist/live-scroll-target-build.log --report dist/live-scroll-target-build.json -- bash scripts/build-live-scroll-target.sh "$PWD/.build/LiveScrollTarget.app"
    - name: Package exact signed preview application
      id: package_live_scroll
      timeout-minutes: 15
      env:
        PICSHOT_PACKAGE_APP_ONLY: '1'
      run: python3 scripts/run-bounded-command.py --timeout-seconds 840 --log dist/live-scroll-package.log --report dist/live-scroll-package.json -- bash scripts/package.sh
    - name: Demonstrate actual native scrolling and growing preview
      timeout-minutes: 5
      env:
        PICSHOT_LIVE_SCROLL_DEMO_ONLY: '1'
        PICSHOT_LIVE_SCROLL_TARGET: '${{ github.workspace }}/.build/LiveScrollTarget.app/Contents/MacOS/LiveScrollTarget'
      run: |
        mkdir -p dist/live-scroll-demo
        swift scripts/launch-smoke-app.swift "$PWD/dist/PicShot.app" "$PWD/dist/live-scroll-demo/demo.json"
        python3 -c 'import json; r=json.load(open("dist/live-scroll-demo/demo.json")); assert r["status"] == "passed", r'
    - name: Preserve early native scrolling demonstration
      if: ${{ always() && steps.package_live_scroll.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-Demo-${{ github.sha }}
        path: |
          dist/live-scroll-package.log
          dist/live-scroll-package.json
          dist/live-scroll-demo/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
    - name: Compile live scrolling app and focused tests
      id: compile_live_scroll_tests
      if: ${{ always() && steps.package_live_scroll.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/live-scroll-build.log --report dist/live-scroll-build.json -- swift build --build-tests
    - name: Test live scrolling matcher storage stream and geometry
      id: test_live_scroll
      if: ${{ always() && steps.compile_live_scroll_tests.outcome == 'success' }}
      timeout-minutes: 8
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/live-scroll-tests.log --report dist/live-scroll-tests.json -- swift test --skip-build --filter LiveScroll
        python3 - <<'PY'
        import importlib.util,json
        from pathlib import Path
        spec=importlib.util.spec_from_file_location('native','scripts/native-test-shards.py')
        native=importlib.util.module_from_spec(spec);spec.loader.exec_module(native)
        expected=json.loads(Path('scripts/live-scroll-additive-tests.json').read_text())
        passed,skipped=native.case_results(Path('dist/live-scroll-tests.log').read_text(),expected)
        native.need(not skipped,'Live scrolling cases cannot be skipped')
        Path('dist/live-scroll-test-inventory.json').write_text(json.dumps({'passed':passed,'skipped':skipped,'count':len(expected)},indent=2)+'\n')
        PY
    # One diagnostic pair only; ordinary product defaults remain unchanged.
    # Existing40min job cap is independent of individual worst-case stage bounds.
    - name: Compare exact final PNG write bridge in two fresh resource cells
      if: ${{ contains(github.event.head_commit.message || '', '[png-boundary-pair]') && steps.test_live_scroll.outcome == 'success' }}
      timeout-minutes: 26
      run: >-
        python3 scripts/run-bounded-command.py --timeout-seconds 1500 --grace-seconds 10
        --log dist/live-scroll-png-pair.log --report dist/live-scroll-png-pair-command.json
        -- bash scripts/live-scroll-png-pair.sh "$PWD/dist/PicShot.app"
        "$PWD/dist/live-scroll-png-pair" "${{ github.sha }}"
    - name: Preserve paired PNG boundary reports
      if: ${{ always() && contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-PNG-Pair-Reports-${{ github.sha }}
        path: |
          dist/live-scroll-png-pair.log
          dist/live-scroll-png-pair-command.json
          dist/live-scroll-png-pair/comparison.json
          dist/live-scroll-png-pair/foundation/upload/
          dist/live-scroll-png-pair/posix/upload/
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 6
    - name: Preserve foundation PNG output bytes
      if: ${{ always() && contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-PNG-foundation-output-${{ github.sha }}
        path: dist/live-scroll-png-pair/foundation/review-output/
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 0
    - name: Preserve foundation PNG reference bytes
      if: ${{ always() && contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-PNG-foundation-reference-${{ github.sha }}
        path: dist/live-scroll-png-pair/foundation/review-reference/
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 0
    - name: Preserve posix PNG output bytes
      if: ${{ always() && contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-PNG-posix-output-${{ github.sha }}
        path: dist/live-scroll-png-pair/posix/review-output/
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 0
    - name: Preserve posix PNG reference bytes
      if: ${{ always() && contains(github.event.head_commit.message || '', '[png-boundary-pair]') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-PNG-posix-reference-${{ github.sha }}
        path: dist/live-scroll-png-pair/posix/review-reference/
        if-no-files-found: ignore
        retention-days: 14
        compression-level: 0
    - name: Preserve focused usability evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Live-Scroll-Preview-${{ github.sha }}
        path: |
          dist/live-scroll-*.log
          dist/live-scroll-*.json
          dist/live-scroll-demo/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6

  runner-check:
    if: ${{ contains(github.event.head_commit.message || '', '[runner-only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Record exact runner source and native environment
        timeout-minutes: 1
        run: |
          mkdir -p dist/runner-contract
          python3 - <<'PYTHON'
          import json, os, platform, sys
          from pathlib import Path
          Path('dist/runner-contract/identity.json').write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'], 'architecture': platform.machine(),
              'macOS': platform.mac_ver(), 'Python': sys.version,
              'observerCommand': ['/bin/ps', '-x', '-g', '<owned-PGID>', '-o', 'pid=,pgid=,stat='],
              'observerEnvironment': {'COMMAND_MODE': 'unix2003', 'LC_ALL': 'C'},
              'observerSubprocessSeconds': 0.5, 'productAcceptance': False
          }, indent=2) + '\n')
          PYTHON
      - name: Verify bounded cleanup and cancellation on native macOS
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/runner-contract/tests.log
      - name: Verify the same contracts with Python assertions disabled
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 -O -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/runner-contract/tests-optimized.log
      - name: Repeat the exact previously failed cmake version observation
        timeout-minutes: 1
        run: |
          for sample in 1 2 3 4 5; do
            python3 scripts/run-bounded-command.py --timeout-seconds 600 --log "dist/runner-contract/cmake-$sample.log" --report "dist/runner-contract/cmake-$sample.json" -- cmake --version
          done
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          for sample in range(1, 6):
              r = json.loads(Path(f'dist/runner-contract/cmake-{sample}.json').read_text())
              if not (r['status'] == r['termination_reason'] == 'exited' and r['exit_code'] == r['child_returncode'] == 0
                      and r['timeout_seconds'] == 600 and not r['log_truncated'] and not r['sigterm_sent'] and not r['sigkill_sent']):
                  raise SystemExit('Incomplete cmake wrapper outcome')
              p = r['group_observation']
              if not (p['backend'] == 'darwin-ps-pgrp' and p['timeout_seconds'] == 0.5 and p['count'] > 0
                      and p['failures'] == 0 and not p['atomic_snapshot'] and p['total_seconds'] >= p['max_seconds'] >= 0):
                  raise SystemExit('Incomplete targeted group observation')
          PYTHON
      - name: Preserve native process-group evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Runner-Contract-${{ matrix.runner }}-${{ github.sha }}
          path: dist/runner-contract/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  shortcut-isolation:
    if: ${{ contains(github.event.head_commit.message || '', '[shortcut-isolation]') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Prepare verified codec dependencies before native tests
      timeout-minutes: 15
      run: python3 scripts/run-bounded-command.py --timeout-seconds 840 --log dist/native-dependencies-preflight.log --report dist/native-dependencies-preflight-report.json -- python3 scripts/build-native-codecs.py --arch arm64
    - name: Compile debug app
      timeout-minutes: 8
      run: python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/debug-build.log --report dist/debug-build-report.json -- swift build --product PicShot
    - name: Compile native tests
      timeout-minutes: 10
      run: python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/test-build.log --report dist/test-build-report.json -- swift build --build-tests
    - name: Build dedicated native codec helper for actual lifecycle tests
      run: swift build --product PicShotCodecHelper
    - name: Validate narrow diagnostic and unchanged native inventory
      timeout-minutes: 3
      run: |
        python3 -m unittest discover -s scripts/tests -p test_local_shortcut_owned_diagnostic.py -v
        python3 -m unittest discover -s scripts/tests -p test_native_test_shards.py -v
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/native-test-discovery.log --report dist/native-test-discovery-report.json -- swift test list --skip-build
        python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --process-count 4 --output dist/native-tests-plan.json
        python3 scripts/native-test-shards.py plan --inventory dist/native-test-discovery.log --source "$GITHUB_SHA" --process-count 2 --selection-regex '^PicShotTests\.(RecordingInputExportTests/testAuthoredInputTrimPreservesAllSelectedPixelsAndPacketBoundaries|RecordingInputExportTests/testInteriorSelectionAndSamplingIncludeExpiryResumeAndFrozenStop|RecordingInputExportTests/testPixelOracleUsesTopDownRGBAAndDetectsEffectRelocationAndExpiry|RecordingInputExportTests/testFixtureRequiresAcceptedOriginalReportBeforeLaunchingHelpers|RecordingCommandCoordinatorTests/testExpandCollapseAndDisplayChangesRetainOneOwnerWithoutClosingSession|AnnotationToolbarOrderUITests/[^/]+|PortableSettingsUITests/[^/]+|AnnotationStylePresetTests/[^/]+|LocalAnnotationShortcutTests/[^/]+|LocalAnnotationShortcutNativeTests/[^/]+|PortableAnnotationPreferencesTests/[^/]+|PinManagementCoordinatorTests/[^/]+|PinTextEditNativeTests/[^/]+|PinTextDraftHistoryTests/[^/]+|PinTextUpdateStoreTests/[^/]+|PinGroupOrderStoreTests/[^/]+|PinGroupOrderNativeTests/[^/]+)$|^PicShotCoreTests\.PinGroupOrderTests/[^/]+$' --output dist/recording-regression-plan.json

    - name: Isolate one exact native method and conditionally the shortcut group
      timeout-minutes: 18
      env:
        PIN_LAYOUT_DIAGNOSTIC: ${{ contains(github.event.head_commit.message || '', '[pin-layout]') }}
      run: |
        python3 - <<'PYDIAGNOSTIC'
        import hashlib, json, os, subprocess, sys
        from pathlib import Path
        source = Path.cwd().resolve(strict=True)
        def query(argv):
            return subprocess.check_output(argv, cwd=source, text=True, timeout=20).strip()
        def digest(path):
            value = hashlib.sha256()
            with path.open('rb') as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                    value.update(chunk)
            return value.hexdigest()
        bundle = (Path(query(['swift', 'build', '--show-bin-path'])) / 'PicShotPackageTests.xctest').resolve(strict=True)
        plan = source / 'dist/recording-regression-plan.json'
        bound = {'source': os.environ['GITHUB_SHA'], 'tree': query(['git', 'rev-parse', 'HEAD^{tree}']),
                 'plan-sha256': digest(plan),
                 'inventory-sha256': '926ac5674df90163b949fe461f0d4589ef72c8fc3215fa00b927564aae57cb44',
                 'bundle-sha256': digest(bundle / 'Contents/MacOS/PicShotPackageTests')}
        common = [sys.executable, 'scripts/local-shortcut-owned-diagnostic.py', '--source-root', str(source),
                  '--bundle', str(bundle), '--plan', str(plan)]
        for key, value in bound.items():
            common += ['--expected-' + key, value]
        (source / 'dist/shortcut-diagnostic-identities.json').write_text(json.dumps(bound, indent=2) + '\n')
        single = source / 'dist/shortcut-single'
        mode = 'pin-layout' if os.environ['PIN_LAYOUT_DIAGNOSTIC'] == 'true' else 'single'
        print('Starting exact single-method owned XCTest diagnostic: ' + mode, flush=True)
        first = subprocess.run(common + ['--selection', mode, '--directory', str(single)], check=False)
        if mode == 'pin-layout':
            raise SystemExit(first.returncode)
        if first.returncode != 0:
            print('Single-method diagnostic did not pass; group0 remains unrun', flush=True)
            raise SystemExit(first.returncode)
        print('Single method passed; starting exact 75-method group with the same compiled bundle', flush=True)
        second = subprocess.run(common + ['--selection', 'group0', '--single-pass', str(single),
                                         '--directory', str(source / 'dist/shortcut-group0')], check=False)
        raise SystemExit(second.returncode)
        PYDIAGNOSTIC
    - name: Retain exact diagnostic logs and owned process evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: PicShot-Shortcut-Isolation-arm64-${{ github.sha }}
        path: |
          dist/*.log
          dist/*.json
          dist/shortcut-single*
          dist/shortcut-group0*
        if-no-files-found: error
        retention-days: 14

  pin-ui-diagnostic:
    if: ${{ contains(github.event.head_commit.message || '', '[pin-ui-diagnostic]') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Preserve exact reproduction source and unchanged product scope
        timeout-minutes: 2
        run: |
          mkdir -p dist/evidence/pin-ui-diagnostic
          python3 - <<'PYIDENTITY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=20).strip()
          expected = 'f4f19e2870a23fd763f58c9810c47d8631388a57'
          parent = git('rev-parse', 'HEAD^')
          if parent != expected:
              raise SystemExit('Reproduction must directly descend from exact diagnosed207 source')
          changed = git('diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD').splitlines()
          allowed = {'.github/workflows/macos.yml', 'Sources/PicShot/PinManagementSmokeFixture.swift',
                     'Sources/PicShot/PortableSettingsUIPreviewFixture.swift',
                     'scripts/check-pin-management.py', 'scripts/tests/test_check_pin_management.py',
                     'docs/VERIFICATION.md'}
          if set(changed) != allowed:
              raise SystemExit('Diagnostic contains unrelated source changes: ' + repr(changed))
          Path('dist/evidence/pin-ui-diagnostic/source.json').write_text(json.dumps({
              'source': os.environ['GITHUB_SHA'], 'tree': git('rev-parse', 'HEAD^{tree}'),
              'baselineSource': expected, 'changedPaths': changed, 'productAcceptance': False,
              'sameFullInstalledUISequence': True, 'fixtureMenuDeadlineSeconds': 2,
              'launcherDeadlineSeconds': 600, 'liveScreenCapture': False,
              'sourceFiles': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in changed}
          }, indent=2) + '\n')
          PYIDENTITY
      - name: Type-check only the opt-in launcher and exact source contracts
        timeout-minutes: 2
        run: |
          swiftc -typecheck scripts/launch-smoke-app.swift
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_pin_ui_diagnostic_launcher.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_editable_product_source_binding.py -k launcher -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_check_pin_management.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_check_pin_management.py -v
      - name: Prepare the unchanged official codec dependencies
        timeout-minutes: 15
        run: python3 scripts/run-bounded-command.py --timeout-seconds 840 --log dist/native-dependencies-preflight.log --report dist/native-dependencies-preflight-report.json -- python3 scripts/build-native-codecs.py --arch arm64
      - name: Package the same signed installed application
        timeout-minutes: 30
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/package.sh 2>&1 | tee dist/package.log
      - name: Reproduce application-dispatched popup input with owned sampling
        timeout-minutes: 12
        run: |
          set -o pipefail
          export PICSHOT_PIN_UI_DIAGNOSTIC_DIRECTORY="$PWD/dist/evidence/pin-ui-diagnostic"
          bash scripts/ui-preview.sh 2>&1 | tee dist/ui-preview.log
      - name: Classify the retained diagnostic trace without accepting the installer
        if: always()
        timeout-minutes: 1
        run: |
          python3 - <<'PYTRACE'
          import json, math, os
          from pathlib import Path
          root = Path('dist/evidence/pin-ui-diagnostic')
          root.mkdir(parents=True, exist_ok=True)
          result = {'productAcceptance': False, 'status': 'incomplete'}
          try:
              data = (root / 'pin-phases.jsonl').read_bytes()
              rows = [json.loads(line) for line in data.splitlines()]
              launcher = json.loads(Path('dist/evidence/ui/preview.json.launcher.json').read_text())
              if not (0 < len(data) < 262144 and 0 < len(rows) < 2048):
                  raise ValueError('trace missing or at finite cap')
              if not all(len(line) <= 2048 for line in data.splitlines()):
                  raise ValueError('trace row exceeds finite cap')
              first = rows[0]
              if not (first['phase'] == 'diagnosticOpened' and first['sourceCommit'] == os.environ['GITHUB_SHA']
                      and type(first['pid']) is int and first['pid'] > 0 and first['pid'] == launcher['processIdentifier']):
                  raise ValueError('trace header is not bound to exact launched app')
              for index, row in enumerate(rows):
                  if type(row['sequence']) is not int or row['sequence'] != index or not all(type(row[k]) in (int, float) and math.isfinite(row[k]) and row[k] >= 0
                          for k in ['uptimeSeconds', 'elapsedSeconds', 'priorWriteSeconds']):
                      raise ValueError('trace sequence or clock invalid')
                  if index and any(row[k] < rows[index - 1][k] for k in ['uptimeSeconds', 'elapsedSeconds', 'priorWriteSeconds']):
                      raise ValueError('trace clocks reordered')
              result.update(status='partial-trace-verified', rows=len(rows), bytes=len(data),
                  lastPhase=rows[-1]['phase'], lastElapsedSeconds=rows[-1]['elapsedSeconds'],
                  measuredPriorWriteSeconds=rows[-1]['priorWriteSeconds'],
                  ownedExitConfirmed=launcher['ownedExitConfirmed'], launcherStatus=launcher['status'],
                  completeTraceObserved=rows[-1]['phase'] == 'diagnosticClosed',
                  scope='Only actual retained prefix; absence of later events does not prove their nonoccurrence')
          except Exception as error:
              result['error'] = str(error)
          (root / 'trace-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result), flush=True)
          PYTRACE
      - name: Preserve owned lifecycle, stack samples and durable phase receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Pin-UI-Diagnostic-arm64-${{ github.sha }}
          path: |
            dist/*.log
            dist/*report.json
            dist/evidence/ui/
            dist/evidence/pin-ui-diagnostic/
          if-no-files-found: error
          retention-days: 14

  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[experimental-installer227]') && !contains(github.event.head_commit.message || '', '[blocked-installers227]') && !contains(github.event.head_commit.message || '', '[live-scroll-remainder]') && !contains(github.event.head_commit.message || '', '[live-scroll-preview]') && !contains(github.event.head_commit.message || '', '[pin-ui-diagnostic]') && !contains(github.event.head_commit.message || '', '[shortcut-isolation]') && !contains(github.event.head_commit.message || '', '[intel154-fresh-diagnostic]') && !contains(github.event.head_commit.message || '', '[native-timeout-diagnostic]') && !contains(github.event.head_commit.message || '', '[installed-diagnostic]') && (!contains(github.event.head_commit.message || '', '[gif-attribution]') || contains(github.event.head_commit.message || '', '[verify-installers]')) && !contains(github.event.head_commit.message || '', '[gif-timing]') && !contains(github.event.head_commit.message || '', '[codec-build]') && !contains(github.event.head_commit.message || '', '[codec-attribution]') && !contains(github.event.head_commit.message || '', '[codec-staging]') && !contains(github.event.head_commit.message || '', '[codec-avif-confirmation]') && !contains(github.event.head_commit.message || '', '[runner-only]') && !contains(github.event.head_commit.message || '', '[scroll-memory]') && !contains(github.event.head_commit.message || '', '[manual-hash]') && !contains(github.event.head_commit.message || '', '[recording-wait]') && !contains(github.event.head_commit.message || '', '[multiwindow-memory]') && !contains(github.event.head_commit.message || '', '[callout-retirement]') && !contains(github.event.head_commit.message || '', '[editable-documents]') && !contains(github.event.head_commit.message || '', '[editable-observation]') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message || '', '[intel-only]') && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    # Retain the prior 90-minute full validation allowance plus the independent
    # 55-minute installed-default gate, two 4-minute portable contract steps,
    # and seven minutes for cleanup and evidence publication overhead.
    # Intel adds 14 minutes to each four-process native stage: 160 + 14 + 14 = 188.
    # ARM retains its prior 160-minute allowance and 16/30-minute native stages.
    # Individual test, product, cancellation and smoke deadlines stay unchanged.
    # Two exact pin regressions add 16 minutes without reducing any prior gate allowance.
    # Early same-ZIP recording witness adds orchestration allowance only:
    # 20 minutes execution plus 2 for its upload; no existing limit changes.
    # ARM: 176 + 22 = 198; Intel: 204 + 22 = 226. All prior allowances remain.
    # Installed fidelity adds120m (3 checks +106 wrapper +10 uploads +1 reserve).
    # This changes only the enclosing allowance: ARM318 / Intel346.
    timeout-minutes: ${{ matrix.arch == 'x86_64' && 346 || 318 }}
    env:
      # Subdivide exhaustive ARM processes; preserve focused isolation.
      NATIVE_TEST_PROCESS_COUNT: '4'
      FOCUSED_TEST_PROCESS_COUNT: ${{ matrix.arch == 'x86_64' && '4' || '2' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test bounded CI command runner and annotation evidence checker
        id: current_gate_01
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v
          python3 -m unittest discover -s scripts/tests -p test_recording_input_ui_contract.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_recording_transport_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_recording_input_export_contract.py -v
          python3 -m unittest discover -s scripts/tests -p test_recording_input_export_early.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_recording_input_export_early.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_annotation_details_report.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_check_effect_output_failure_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_scroll_manual_resource_report.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_manual_hash_comparison.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_multiwindow_memory_comparison.py -v
          python3 -m unittest discover -s scripts/tests -p test_multiwindow_resource_smoke_selection.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_editable_annotation_report.py -v
      - name: Check portable settings evidence contract
        id: current_gate_02
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_check_portable_settings.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_check_portable_settings.py -v
      - name: Check pin management evidence contract
        id: current_gate_03
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p test_check_pin_management.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_check_pin_management.py -v
      - name: Check experimental scrolling interaction evidence contract
        id: experimental_scroll_contract
        if: ${{ contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
        timeout-minutes: 2
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_experimental_scroll_interactions.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_experimental_scroll_interactions.py -v
      - name: Check explicit live scrolling testing classification
        id: scroll_testing_contract
        if: ${{ !contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
        timeout-minutes: 2
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_live_scroll_testing_classification.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p 'test_live_scroll_testing_classification.py' -v
      - name: Check installed drawing default product and source contracts
        id: current_gate_04
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p dist
          for picshot_contract_pattern in '*drawing*.py' test_check_editable_product_resource.py test_editable_product_source_binding.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p "$picshot_contract_pattern" -v 2>&1 | tee -a dist/installed-default-contracts.log
          done
      - name: Check installed default contracts with Python assertions disabled
        id: current_gate_05
        timeout-minutes: 4
        run: |
          set -o pipefail
          for picshot_contract_pattern in '*drawing*.py' test_check_editable_product_resource.py test_editable_product_source_binding.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p "$picshot_contract_pattern" -v 2>&1 | tee -a dist/installed-default-contracts-optimized.log
