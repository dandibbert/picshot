        need(not git('status','--porcelain','--untracked-files=no').strip(), 'Original227 tracked tree must be clean')
        need(platform.system()=='Darwin' and platform.machine()=='arm64', 'Native ARM macOS required')
        need(int(os.environ['GITHUB_RUN_NUMBER'])>229, 'Use a new build number, never relabel build229')
        need(workflow==os.environ['GITHUB_SHA'], 'Workflow and triggering commit differ')
        prior='19fc13cad94f954b076b90b7658d5c82b5c63f9b'
        subprocess.run(['git','merge-base','--is-ancestor',prior,workflow],check=True,timeout=10)
        changed=git('diff','--name-only',prior,workflow).decode().splitlines()
        need(set(changed)<={'.github/workflows/macos.yml','docs/VERIFICATION.md'}, 'Only experimental workflow/evidence documentation may differ from229')
        workflow_bytes=git('show',workflow+':.github/workflows/macos.yml')
        (root/'experimental-workflow.yml').write_bytes(workflow_bytes)
        script_hashes={'scripts/package.sh': '83a967b25c2ba21dd80fcc3d0cbab2c44d3f6e29bcc80df7cb7f0cd5339f3b14', 'scripts/build-native-codecs.py': 'bb39595aa6de09fc7e8a19d65bb87c18e6df85f75ef25736f522be5ed3915e8f', 'scripts/build-live-scroll-target.sh': '28ee2e22c8799e79c031eb241d579e74d170c3ab00378ab645d4a0bf32c82fd1', 'scripts/live-scroll-installed.sh': '7099c8c469de1f03cdc82f6589c04da69d07627276ae17a8bfe48b36922bdec8', 'scripts/launch-smoke-app.swift': '589eab4377c411f1146dd2c3144320b212358bf52ff81543a70d6c9da295149f', 'scripts/run-bounded-command.py': 'ef85307a6227a0d99641b17c75e2aa625ae7344376fbcb3ec1af1c5be7e2d5d2', 'scripts/bundle-runtime.py': '2c2368eee65972ce24856b96cf36fb8088ddf13622c3c8cf9d50d8b1aeaf2ea7', 'scripts/FormulaRender-verify-packaged-runtime.py': '131caad33dc6204b5ac4bf05c9dcc9cf845847a0339ea3dc30744cb27f0073fe'}
        for path,expected in script_hashes.items():
            need(hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected, 'Original script bytes differ: '+path)
        original=Path('scripts/live-scroll-installed.sh').read_bytes()
