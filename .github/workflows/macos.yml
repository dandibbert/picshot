      timeout-minutes: 10
      run: python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/effect-context-test-build.log --report dist/effect-context-test-build.json -- swift build --build-tests
    - name: Execute every discovered effect context, renderer and drawing regression exactly once
      timeout-minutes: 9
      run: |
        python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/effect-context-test-discovery.log --report dist/effect-context-test-discovery.json -- swift test list --skip-build
        python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/effect-context-native-tests.log --report dist/effect-context-native-tests.json -- swift test --skip-build --filter 'DrawingRasterTests|RendererStorageTests|EffectContextConfigurationTests|EffectContextGuardControlTests'
        python3 - <<'PYTHON'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
        native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
        inventory = Path('dist/effect-context-test-discovery.log').read_text()
        classes = {'PicShotTests.DrawingRasterTests', 'PicShotTests.RendererStorageTests', 'PicShotTests.EffectContextConfigurationTests', 'PicShotTests.EffectContextGuardControlTests'}
        expected = [name for name in native.discover(inventory) if name.split('/')[0] in classes]
        native.need({name.split('/')[0] for name in expected} == classes, 'Missing effect context, renderer or drawing native cases')
        log = Path('dist/effect-context-native-tests.log').read_text()
        runner = json.loads(Path('dist/effect-context-native-tests.json').read_text())
        native.need(runner['status'] == runner['termination_reason'] == 'exited'
                    and runner['exit_code'] == runner['child_returncode'] == 0
                    and runner['timeout_seconds'] == 420 and not runner['log_truncated'], 'Native drawing test process incomplete')
        passed, skipped = native.case_results(log, expected)
        native.need(not skipped, 'Drawing raster native test skipped')
        Path('dist/effect-context-native-check.json').write_text(json.dumps({
            'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
            'inventorySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
            'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'productAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Relocate and bind the single exact signed ARM application
      timeout-minutes: 2
      run: |
        test ! -e dist/effect-context-installed
        mkdir -p dist/effect-context-installed
        ditto dist/PicShot.app dist/effect-context-installed/PicShot.app
        codesign --verify --deep --strict dist/effect-context-installed/PicShot.app
        test "$(lipo -archs dist/effect-context-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        cmp dist/PicShot.app/Contents/MacOS/PicShot dist/effect-context-installed/PicShot.app/Contents/MacOS/PicShot
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        app = Path('dist/effect-context-installed/PicShot.app').resolve()
        info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
        if info['PicShotSourceCommit'] != os.environ['GITHUB_SHA']:
            raise SystemExit('Installed drawing source mismatch')
        Path('dist/effect-context-installed-identity.json').write_text(json.dumps({
            'sourceCommit': info['PicShotSourceCommit'], 'bundlePath': str(app), 'architecture': 'arm64',
            'executableSHA256': hashlib.sha256((app / 'Contents/MacOS/PicShot').read_bytes()).hexdigest(),
            'oneBinaryForEveryCell': True, 'diagnosticSelectionChangesCompiledDefault': False, 'installerAcceptance': False
        }, indent=2) + '\n')
        PYTHON
    - name: Verify both finite effect policies refuse incomplete output
