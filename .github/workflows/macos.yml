    - name: Verify signed227 native product and new build identity before overlay
      id: package_identity
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.package.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib, subprocess
        from pathlib import Path
        app = Path('dist/PicShot.app')
        info = plistlib.loads((app/'Contents/Info.plist').read_bytes())
        build = json.loads((app/'Contents/Resources/build-info.json').read_text())
        source = os.environ['PICSHOT_BLOCKED_SOURCE']
        if (subprocess.check_output(['git', 'rev-parse', 'HEAD', 'HEAD^{tree}'], text=True, timeout=10).splitlines()
                != [source, os.environ['PICSHOT_BLOCKED_TREE']]
                or subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], timeout=10).strip()
                or info['PicShotSourceCommit'] != source or build['sourceCommit'] != source
                or info['CFBundleVersion'] != os.environ['GITHUB_RUN_NUMBER'] or build['architecture'] != 'arm64'):
            raise SystemExit('Diagnostic package source, build, architecture, or tracked tree differs')
        subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True, timeout=30)
        def digest(path):
            sha = hashlib.sha256()
            with path.open('rb') as stream:
                for chunk in iter(lambda: stream.read(1024*1024), b''): sha.update(chunk)
            return sha.hexdigest()
        files = [*(app/'Contents/Helpers').glob('PicShot*'), app/'Contents/MacOS/PicShot', app/'Contents/Info.plist', app/'Contents/Resources/build-info.json',
            Path('dist/PicShot-0.22.0-macos-arm64.zip'), Path('dist/PicShot-0.22.0-macos-arm64.dmg')]
        record = dict(status='passed', diagnosticOnly=True, sourceCommit=source,
            buildVersion=info['CFBundleVersion'], sourceTree=os.environ['PICSHOT_BLOCKED_TREE'], originalTrackedTreeClean=True, workflowRunID=os.environ['GITHUB_RUN_ID'],
            workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'], installerAcceptance=False,
            fullMemoryQualification=False, testingPackageEligible=False,
            packagesRemainOnRunner=True, files=[dict(path=str(path), bytes=path.stat().st_size,
                sha256=digest(path)) for path in files])
        Path('dist/blocked-installers227/package-identity.json').write_text(json.dumps(record, indent=2)+'\n')
        PYTHON
    - name: Apply only the corrected checker after clean product packaging
      id: checker_overlay
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.pin_contracts.outcome == 'success' &&
        steps.package_identity.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, subprocess
        from pathlib import Path

        def git(*args):
            return subprocess.check_output(['git', *args], timeout=10)
        def need(value, message):
            if not value: raise ValueError(message)
        root = Path('dist/blocked-installers227')
        record = json.loads((root/'source-identity.json').read_text())
        need(git('rev-parse', 'HEAD', 'HEAD^{tree}').decode().splitlines() == [record['sourceCommit'], record['sourceTree']], 'Source227 identity changed')
        need(not git('status', '--porcelain', '--untracked-files=no').strip(), 'Source must remain clean until signed package identity passes')
        path = 'scripts/check-pin-management.py'
        original = Path(path).read_bytes()
        need(hashlib.sha256(original).hexdigest() == record['originalCheckerSHA256'], 'Original checker changed before overlay')
        replacement = git('show', record['checkerCommit']+':'+path)
        need(hashlib.sha256(replacement).hexdigest() == record['checkerSHA256'], 'Checker overlay hash differs')
        need(git('rev-parse', record['checkerCommit']+':'+path).decode().strip() == record['checkerBlob'], 'Checker overlay blob differs')
        Path(path).write_bytes(replacement)
        need(git('diff', '--name-only', 'HEAD').decode().splitlines() == [path], 'Only corrected checker may differ at runtime')
        need(not git('diff', '--cached').strip() and not git('diff', '--summary', 'HEAD').strip(), 'No staged or file mode changes allowed')
        diff = git('diff', '--binary', 'HEAD', '--', path)
        (root/'runtime-checker-overlay.patch').write_bytes(diff)
        record.update(status='overlay-verified', runtimeOverlayApplied=True, runtimeTrackedTreeClean=False,
            runtimeChangedPaths=[path], runtimeOverlayDiffSHA256=hashlib.sha256(diff).hexdigest(),
            productSourcesAndNativeTestsUnchanged=True, allOtherTrackedFilesUnchanged=True,
            overlayTiming='After clean source227 release build, signing, packaging and package identity validation')
        (root/'runtime-overlay.json').write_text(json.dumps(record, indent=2)+'\n')
        PYTHON
