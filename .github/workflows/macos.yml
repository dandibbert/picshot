          record = dict(status='running', diagnosticOnly=True, installerAcceptance=False,
              sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'], expectedMethods={'PicShotTests.EditableProductRetirementTests': ['testAlreadyBalancedReturnsWithoutSleepingAndChecksCancellationAndDeadline', 'testClearedCacheAndWeakJobCompletionWaitForHeldProviderThenRecordNaturalRelease', 'testCorruptedObservationsNewWorkAndBackwardTimeFailClosed', 'testFullDeadlineAndCancellationInterruptAnOutstandingProvider', 'testOwnerAndJobCompletionRemainRequiredEvenWhenDrawingIsBalanced', 'testRetainedProviderFailsShortCapAndPreservesOriginalEvidence'], 'PicShotTests.VideoTrimGIFFixtureTests': ['testChildMarkerRejectsIncompleteInvalidPIDAndExtraFields', 'testEOFTruncatedEmptyAndWrongRequestsNeverFabricateReadiness', 'testMarkerPublicationFailureDoesNotEmitProgressOrReplaceExistingBytes', 'testProcessServiceAcceptsInitialProgressThenDistinctReadinessBeforeCancellation', 'testReadbackKeepsOwnedPIDAndRefusesExistingDestination', 'testReadinessRequiresCompleteRequestAndClosedMarkerBeforeReleaseReadback', 'testRequestMetacharactersRemainDataAndCannotCreateFiles', 'testUnreleasedChildExitsWithinItsOriginalTwentySecondBoundWithoutReadback'], 'PicShotTests.VideoTrimTests': ['testBusyGIFFailureCleansOnlyItsOwnCallerStage', 'testCancellationAfterHelperPublicationDoesNotPublishTrimDestination', 'testCancellationBeforeEncoderStartsCleansOwnedStagingAndPreservesOriginal', 'testChangedConfirmedDestinationIsPreserved', 'testCheckToReplaceRaceRestoresTheUnconfirmedFile', 'testClosingPreviewCancelsLoadingAndReleasesPlayerIdempotently', 'testDestinationAppearingAfterConfirmationCannotBeOverwritten', 'testExistingDestinationRequiresExplicitConfirmation', 'testGIFPrelaunchUnconfirmedExitDoesNotRetainCallerStaging', 'testGIFRejectsSelectionsBeyondExplicitDurationCap', 'testNewWriterDuringReplacementKeepsItsFileAndPreservesRecoveryCopy', 'testPreviewEditsRealRangeAndPauseCancelsSeekResume', 'testRangeIsRevalidatedAgainstActualAssetDuration', 'testRangeRejectsInvalidAndUnrepresentableTimes', 'testRangeRetainsFractionalFrameBoundaries', 'testSelectedGIFStartsAtChosenRangeAndPreservesItsPlaybackTime', 'testSourceCannotBeOverwrittenEvenWithConfirmationOrHardLinkAlias', 'testTrimPublishesDecodableMP4WithSelectedDurationAndFrames', 'testUnconfirmedGIFExitRemovesOuterStageWhileSiblingSurvivesUntilCrossFormatRecovery']},
              nativeTimeoutSeconds=420, fullProductionAcceptanceRequired=True)
          output = root/'retirement-gif-check.json'
          def write():
              output.write_text(json.dumps(record, indent=2)+'\n')
          write()
          try:
              raw = native.bounded_text(Path('dist/native-test-discovery.log'), native.MAX_INVENTORY_BYTES)
              inventory = native.discover(raw)
              classes = set(record['expectedMethods'])
              expected = sorted(cls+'/'+method for cls, methods in record['expectedMethods'].items() for method in methods)
              selected = [name for name in inventory if name.split('/')[0] in classes]
              native.need(selected == expected and len(expected) == 33, 'The exact 6 retirement, 8 GIF fixture and 19 original trim cases must be discovered')
              added = [name for name in expected if name.split('/')[0] != 'PicShotTests.VideoTrimTests']
              original = [name for name in inventory if name not in added]
              native.need(len(inventory) == 1799 and len({name.split('/')[0] for name in inventory}) == 205
                          and len(original) == 1785 and hashlib.sha256(('\n'.join(original)+'\n').encode()).hexdigest()
                          == '58e9fa791e2b711c49decd229e6f67438e38c9fc7ddccd8832da4524004e7bae',
                          'Native inventory differs from the original 1785 methods plus the exact 14 reviewed additions')
              discovery = json.loads(native.bounded_text(Path('dist/native-test-discovery-report.json'), 1024*1024))
              def checked(report, seconds, command, log):
                  native.need(report['status'] == report['termination_reason'] == 'exited'
                              and report['exit_code'] == report['child_returncode'] == 0
                              and report['timeout_seconds'] == seconds and report['command'] == command
                              and report['log_bytes'] == len(log.encode()) and not report['log_truncated']
                              and not report['sigterm_sent'] and not report['sigkill_sent'] and not report.get('cleanup_errors'),
                              'Native inventory or focused process is incomplete')
              checked(discovery, 60, ['swift', 'test', 'list', '--skip-build'], raw)
              command = ['swift', 'test', '--skip-build', '--filter', native.command_pattern(expected)]
              record.update(discoveredCount=len(inventory), discoveredClasses=205, selectedTests=expected,
                  addedMethods=added, command=command, inventorySHA256=hashlib.sha256(raw.encode()).hexdigest())
              write()
              result = subprocess.run([sys.executable, 'scripts/run-bounded-command.py', '--timeout-seconds', '420',
                  '--log', 'dist/retirement-gif-native.log', '--report', 'dist/retirement-gif-native-report.json', '--', *command])
              record['wrapperReturnCode'] = result.returncode
              report = json.loads(native.bounded_text(Path('dist/retirement-gif-native-report.json'), 1024*1024))
              log = native.bounded_text(Path('dist/retirement-gif-native.log'), native.MAX_LOG_BYTES)
              native.need(result.returncode == 0, 'Focused native wrapper failed; preserve the original outcome')
              checked(report, 420, command, log)
              passed, skipped = native.case_results(log, expected)
              native.need(len(passed) == 33 and not skipped, 'Every exact focused native method must execute and pass without skips')
              record.update(status='passed', passedTests=passed, skippedTests=skipped,
                  logSHA256=hashlib.sha256(log.encode()).hexdigest())
          except BaseException as error:
              record.update(status='failed', error=str(error))
              raise
          finally:
              write()
          PYTHON
      - name: Fetch only approved pinned original model fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -e -o pipefail
          python3 dist/evidence/installed-diagnostic/verify-product-source.py before fixtures
          trap 'picshot_stage_status=$?; trap - EXIT; set +e; python3 dist/evidence/installed-diagnostic/verify-product-source.py after fixtures; picshot_identity_status=$?; if [ "$picshot_stage_status" -ne 0 ]; then exit "$picshot_stage_status"; fi; exit "$picshot_identity_status"' EXIT
          set -o pipefail
          python3 scripts/fetch-model-fixtures.py 2>&1 | tee dist/model-download.log
          python3 scripts/SmartErase-fetch-fixture.py 2>&1 | tee dist/erase-model-download.log
      - name: Run the unchanged native model gate
        id: models
        if: ${{ !cancelled() && steps.retirement_gif.outcome == 'success' && steps.discovery.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          set -e -o pipefail
          python3 dist/evidence/installed-diagnostic/verify-product-source.py before models
          trap 'picshot_stage_status=$?; trap - EXIT; set +e; python3 dist/evidence/installed-diagnostic/verify-product-source.py after models; picshot_identity_status=$?; if [ "$picshot_stage_status" -ne 0 ]; then exit "$picshot_stage_status"; fi; exit "$picshot_identity_status"' EXIT
          set -o pipefail
          export PICSHOT_ERASE_MODEL_DIR="$PWD/.build/model-fixtures/erase"
          export PICSHOT_FORMULA_MODEL_DIR="$PWD/.build/model-fixtures/formula"
          export PICSHOT_TEST_TABLE_MODEL_DIR="$PWD/.build/model-fixtures/table"
          export PICSHOT_TEST_ML_HELPER="$(swift build --show-bin-path)/PicShotMLHelper"
          swift build --product PicShotMLHelper
          swift test --skip-build --filter 'FormulaEngineTests|RecordedModelOutputTests|SmartEraseEngineTests' 2>&1 | tee dist/model-inference.log
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          inventory = native.bounded_text(Path('dist/native-test-discovery.log'), native.MAX_INVENTORY_BYTES)
          classes = {'PicShotMLHelperTests.FormulaEngineTests', 'PicShotTableEngineTests.RecordedModelOutputTests', 'PicShotEraseHelperTests.SmartEraseEngineTests'}
          expected = [case for case in native.discover(inventory) if case.split('/')[0] in classes]
          native.need(len(expected) == 12 and all(sum(case.split('/')[0] == cls for case in expected) == 4 for cls in classes), 'Model discovery differs from pinned 12-case contract')
          log = native.bounded_text(Path('dist/model-inference.log'), native.MAX_LOG_BYTES)
          passed, skipped = native.case_results(log, expected)
          native.need(not skipped and len(passed) == 12, 'Model cases missing or skipped')
          Path('dist/evidence/installed-diagnostic/model-check.json').write_text(json.dumps(dict(
              status='passed', sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'], diagnosticWorkflowCommit=os.environ['GITHUB_SHA'], passedTests=passed, skippedTests=skipped,
              inventorySHA256=hashlib.sha256(inventory.encode()).hexdigest(), logSHA256=hashlib.sha256(log.encode()).hexdigest(),
              diagnosticOnly=True, installerAcceptance=False), indent=2)+'\n')
          PYTHON
      - name: Require prior native processes to have exited before installed observations
        id: installed_preflight
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.retirement_gif.outcome == 'success' && steps.models.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -e -o pipefail
          python3 dist/evidence/installed-diagnostic/verify-product-source.py before installed_preflight
          trap 'picshot_stage_status=$?; trap - EXIT; set +e; python3 dist/evidence/installed-diagnostic/verify-product-source.py after installed_preflight; picshot_identity_status=$?; if [ "$picshot_stage_status" -ne 0 ]; then exit "$picshot_stage_status"; fi; exit "$picshot_identity_status"' EXIT
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          rows = subprocess.check_output(['/bin/ps', '-ax', '-o', 'pid=,comm='], text=True, timeout=5).splitlines()
          matches = []
          for row in rows:
              pid, command = row.strip().split(None, 1)
              name = Path(command).name
              if name.startswith('PicShot') or name in {'swift', 'swift-frontend', 'swift-test', 'xctest'} or '.xctest/' in command:
                  matches.append(dict(pid=int(pid), command=command))
          Path('dist/evidence/installed-diagnostic/installed-process-preflight.json').write_text(json.dumps(dict(
              status='failed' if matches else 'passed', sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'],
              observedProcesses=matches, priorProcessesTerminatedByThisCheck=False, installerAcceptance=False), indent=2)+'\n')
          if matches:
              raise SystemExit('Prior app, helper or native-test process remains; refusing overlapping observation')
          PYTHON
      - name: Run unchanged final ZIP and DMG smoke including its installed-default gate
        id: smoke
        if: ${{ !cancelled() && steps.installed_preflight.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          set -e -o pipefail
          python3 dist/evidence/installed-diagnostic/verify-product-source.py before smoke
          trap 'picshot_stage_status=$?; trap - EXIT; set +e; python3 dist/evidence/installed-diagnostic/verify-product-source.py after smoke; picshot_identity_status=$?; if [ "$picshot_stage_status" -ne 0 ]; then exit "$picshot_stage_status"; fi; exit "$picshot_identity_status"' EXIT
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee dist/smoke.log
      - name: Observe installed default independently only when broad smoke never reached it
        id: independent_default
        if: ${{ !cancelled() && steps.installed_preflight.outcome == 'success' && steps.smoke.outcome != 'success' }}
        timeout-minutes: 57
        run: |
          set -e -o pipefail
          python3 dist/evidence/installed-diagnostic/verify-product-source.py before independent_default
          trap 'picshot_stage_status=$?; trap - EXIT; set +e; python3 dist/evidence/installed-diagnostic/verify-product-source.py after independent_default; picshot_identity_status=$?; if [ "$picshot_stage_status" -ne 0 ]; then exit "$picshot_stage_status"; fi; exit "$picshot_identity_status"' EXIT
          set -euo pipefail
          # Any wrapper or evidence file means the original default was attempted.
          # Never replay it or replace its failure with another result.
          if [[ -e dist/editable-product-installed-default-report.json || -e dist/editable-product-installed-default.log || -e dist/evidence/zip/editable-product-installed-default ]]; then
            echo 'Broad smoke already attempted installed default; preserve its original outcome without replay.'
            exit 0
          fi
          cd -P "$PWD"
          test "$(cd dist && pwd -P)" = "$PWD/dist"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          rows = subprocess.check_output(['/bin/ps', '-ax', '-o', 'pid=,comm='], text=True, timeout=5).splitlines()
          matches = []
          for row in rows:
              pid, command = row.strip().split(None, 1)
              name = Path(command).name
              if name.startswith('PicShot') or name in {'swift', 'swift-frontend', 'swift-test', 'xctest'} or '.xctest/' in command:
                  matches.append(dict(pid=int(pid), command=command))
          Path('dist/evidence/installed-diagnostic/independent-process-preflight.json').write_text(json.dumps(dict(
              status='failed' if matches else 'passed', sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'],
              observedProcesses=matches, priorProcessesTerminatedByThisCheck=False, installerAcceptance=False), indent=2)+'\n')
          if matches:
              raise SystemExit('Prior app, helper or native-test process remains; refusing overlapping observation')
          PYTHON
          installed="$PWD/dist/installed-diagnostic-zip"
          test ! -e "$installed"
          mkdir "$installed"
          ditto -x -k "dist/PicShot-0.17.0-macos-arm64.zip" "$installed"
          app="$installed/PicShot.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/PicShot")" = arm64
          for relative in Contents/MacOS/PicShot Contents/Info.plist Contents/Resources/build-info.json; do
            cmp "dist/PicShot.app/$relative" "$app/$relative"
          done
          python3 - "$app" <<'PYTHON'
          import hashlib, json, os, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          if str(app.resolve()) != str(app): raise SystemExit('Noncanonical installed application')
          info = plistlib.loads((app/'Contents/Info.plist').read_bytes())
          build = json.loads((app/'Contents/Resources/build-info.json').read_bytes())
          if not (info['PicShotSourceCommit'] == build['sourceCommit'] == os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE']
                  and info['CFBundleVersion'] == os.environ['GITHUB_RUN_NUMBER']
                  and info['CFBundleShortVersionString'] == build['version'] == '0.17.0'
                  and info['CFBundleExecutable'] == 'PicShot' and build['architecture'] == 'arm64'):
              raise SystemExit('Installed source, architecture or version mismatch')
          paths = {name: Path('dist')/name for name in ('PicShot-0.17.0-macos-arm64.zip', 'PicShot-0.17.0-macos-arm64.dmg')}
          paths.update({name: app/name for name in ('Contents/MacOS/PicShot', 'Contents/Info.plist', 'Contents/Resources/build-info.json')})
          identities = {name: dict(bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest()) for name,path in paths.items()}
          Path('dist/evidence/installed-diagnostic/independent-package-identity.json').write_text(json.dumps(dict(
              status='passed', sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'], diagnosticWorkflowCommit=os.environ['GITHUB_SHA'], buildVersion=info['CFBundleVersion'],
              bundlePath=str(app), identities=identities, separateObservation=True, installerAcceptance=False), indent=2)+'\n')
          PYTHON
          python3 scripts/run-bounded-command.py --timeout-seconds 3300 \
            --log "$PWD/dist/independent-installed-default.log" \
            --report "$PWD/dist/independent-installed-default-report.json" \
            -- bash scripts/editable-product-installed-default.sh "$app" \
            "$PWD/dist/evidence/independent-installed-default" "$PICSHOT_INSTALLED_PRODUCT_SOURCE"
      - name: Record separate outcomes without installer acceptance
        if: always()
        timeout-minutes: 2
        env:
          PICSHOT_DIAGNOSTIC_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p dist/evidence/installed-diagnostic
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          record = dict(diagnosticOnly=True, installerAcceptance=False, exhaustiveNativeSuiteRun=False,
              sourceCommit=os.environ['PICSHOT_INSTALLED_PRODUCT_SOURCE'], referenceCommit='f991c23aaa60469db0e2dc77cb94198d0dc74c08', diagnosticWorkflowCommit=os.environ['GITHUB_SHA'],
              steps=json.loads(os.environ['PICSHOT_DIAGNOSTIC_STEP_OUTCOMES']),
              broadDefaultAttempted=any(Path(path).exists() for path in (
                  'dist/editable-product-installed-default-report.json', 'dist/editable-product-installed-default.log',
                  'dist/evidence/zip/editable-product-installed-default')),
              independentDefaultAttempted=Path('dist/independent-installed-default-report.json').is_file(),
              fullProductionAcceptanceRequired=True, priorFailuresPreserved=True,
              scope='Exact 33 focused cases, unchanged model and installed observations; no full-suite, Intel or release acceptance')
          record['finalSourceIdentityCheckAvailable'] = Path('dist/evidence/installed-diagnostic/verify-product-source.py').is_file()
          Path('dist/evidence/installed-diagnostic/outcomes.json').write_text(json.dumps(record, indent=2)+'\n')
          PYTHON
      - name: Preserve diagnostic evidence only, never normal installer artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-DIAGNOSTIC-NONRELEASE-Installed-arm64-${{ github.sha }}
          path: |
            dist/*.log
            dist/*-report.json
            dist/*.sha256
            dist/*.build-info.json
            dist/evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  codec-staging-comparison:
    # ARM-first hypothesis test, not an accepted installer or an Intel verdict.
    if: ${{ contains(github.event.head_commit.message || '', '[codec-staging]') }}
    runs-on: macos-15
    # Every cell retains its existing 300s helper / 480s fixture / 600s launcher
    # bounds. Independent AB/BA and fidelity processes need separate envelopes;
    # any failed benefit gate stops the later matrix and preserves raw evidence.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Package exact signed app for staging comparison
        timeout-minutes: 25
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1440 --max-log-bytes 4194304
          --log dist/staging-package.log --report dist/staging-package-report.json
          -- env PICSHOT_PACKAGE_APP_ONLY=1 bash scripts/package.sh
      - name: Compile staging and existing codec regression tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540 --max-log-bytes 4194304
          --log dist/staging-test-build.log --report dist/staging-test-build-report.json
          -- swift build --build-tests
      - name: Build actual debug executables for native tests
        timeout-minutes: 16
        run: |
          python3 scripts/run-bounded-command.py --timeout-seconds 420 --max-log-bytes 4194304 --log dist/staging-app-build.log --report dist/staging-app-build-report.json -- swift build --product PicShot
          python3 scripts/run-bounded-command.py --timeout-seconds 420 --max-log-bytes 4194304 --log dist/staging-helper-build.log --report dist/staging-helper-build-report.json -- swift build --product PicShotCodecHelper
      - name: Check staging bytes cancellation and evidence contract
        timeout-minutes: 8
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_check_codec_staging_comparison.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -O -m unittest discover -s scripts/tests -p test_check_codec_staging_comparison.py -v
          python3 scripts/run-bounded-command.py --timeout-seconds 420 --max-log-bytes 4194304 --log dist/staging-native-tests.log --report dist/staging-native-tests-report.json -- swift test --skip-build --filter 'ImageExportPNGStaging|ImageExportService|ImageExportController|CodecExportAttribution|CodecExportProcess|CodecHelperLifecycle|CodecStagingComparison|GIFResourceSmoke'
      - name: Upload staging compilation and native regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Native-arm64-${{ github.sha }}
          path: |
            dist/staging-*.log
            dist/staging-*-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compare four fresh export-only processes before further work
        timeout-minutes: 43
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 2500 --max-log-bytes 1048576
          --log dist/staging-export-phase.log --report dist/staging-export-phase-report.json
          -- bash scripts/codec-staging-comparison.sh --phase export
          "${{ github.workspace }}/dist/PicShot.app" "${{ github.workspace }}/dist/evidence/codec-staging"
      - name: Preserve first export-only comparison immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Export-arm64-${{ github.sha }}
          path: |
            dist/evidence/codec-staging/upload/export-reports.zip
            dist/staging-export-phase.log
            dist/staging-export-phase-report.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Compare actual controller drawing and bounded large workloads
        timeout-minutes: 124
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 7350 --max-log-bytes 1048576
          --log dist/staging-product-phase.log --report dist/staging-product-phase-report.json
          -- bash scripts/codec-staging-comparison.sh --phase product
          "${{ github.workspace }}/dist/PicShot.app" "${{ github.workspace }}/dist/evidence/codec-staging"
      - name: Preserve controller and large-image comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Product-arm64-${{ github.sha }}
          path: |
            dist/evidence/codec-staging/upload/product-reports.zip
            dist/staging-product-phase.log
            dist/staging-product-phase-report.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Verify matching output pixels in independent processes and interruption cleanup
        timeout-minutes: 104
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 6120 --max-log-bytes 1048576
          --log dist/staging-fidelity-phase.log --report dist/staging-fidelity-phase-report.json
          -- bash scripts/codec-staging-comparison.sh --phase fidelity
          "${{ github.workspace }}/dist/PicShot.app" "${{ github.workspace }}/dist/evidence/codec-staging"
      - name: Summarize exact bounded staging comparison
        timeout-minutes: 2
        run: >-
          bash scripts/codec-staging-comparison.sh --phase summary
          "${{ github.workspace }}/dist/PicShot.app" "${{ github.workspace }}/dist/evidence/codec-staging"
      - name: Preserve final comparison reports without publishing installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Fidelity-arm64-${{ github.sha }}
          path: |
            dist/evidence/codec-staging/upload/fidelity-reports.zip
            dist/staging-fidelity-phase.log
            dist/staging-fidelity-phase-report.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Preserve independent final staging decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Summary-arm64-${{ github.sha }}
          path: dist/evidence/codec-staging/upload/summary-reports.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Preserve small actual source and output specimens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Small-Media-arm64-${{ github.sha }}
          path: dist/evidence/codec-staging/upload/small-specimens.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Preserve actual large control specimens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Large-Control-Media-arm64-${{ github.sha }}
          path: dist/evidence/codec-staging/upload/large-control-specimens.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Preserve actual large candidate specimens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Staging-Large-Candidate-Media-arm64-${{ github.sha }}
          path: dist/evidence/codec-staging/upload/large-candidate-specimens.zip
          if-no-files-found: ignore
          retention-days: 14
