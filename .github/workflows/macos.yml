    - name: Compile native component and source-format fidelity tests
      timeout-minutes: 10
      run: python3 scripts/run-bounded-command.py --timeout-seconds 540 --log dist/editable-components-test-build.log --report dist/editable-components-test-build.json -- swift build --build-tests
    - name: Execute every discovered component and raw-format fidelity case exactly once
