            -- bash -c "$picshot_scroll_prefix" scripts/live-scroll-installed.sh \
            "$PWD/dist/PicShot-0.22.0-macos-${{ matrix.arch }}.zip" \
            "$PWD/dist/live-scroll-installed" "$GITHUB_SHA"
      - name: Require direct release Escape rollback visible HUD and stale marker evidence
        id: experimental_scroll_receipt
        if: ${{ contains(github.event.head_commit.message || '', '[experimental-scroll-interactions]') }}
