      - name: Check installed recording exports before slow native gates
        id: current_gate_16
        # 660s launcher (unchanged 600s app + 6s owned cleanup), 330s reader,
        # 140s bounded identity/extraction commands, 70s cleanup/report reserve
        # (including existing-wrapper termination grace). Orchestration only.
        # Total 1200s. Existing reader build/decode limits stay 60/120/90s.
        timeout-minutes: 20
