        with:
          name: PicShot-DIAGNOSTIC-Live-Scroll-Remainder-Outcomes-${{ env.PICSHOT_REMAINDER_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/live-scroll-remainder/source-identity.json
