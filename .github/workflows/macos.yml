        codesign --verify --deep --strict dist/renderer-storage-installed/PicShot.app
        test "$(lipo -archs dist/renderer-storage-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
        cmp dist/PicShot.app/Contents/MacOS/PicShot dist/renderer-storage-installed/PicShot.app/Contents/MacOS/PicShot
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib
        from pathlib import Path
        app = Path('dist/renderer-storage-installed/PicShot.app').resolve()
        info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
