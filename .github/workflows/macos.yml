            dist/live-scroll-installed-report.json
            dist/live-scroll-testing-qualification.json
            dist/live-scroll-installed/package-identity.json
            dist/live-scroll-installed/demo-launch.*
            dist/live-scroll-installed/demo/
            dist/live-scroll-installed/resource/upload/
