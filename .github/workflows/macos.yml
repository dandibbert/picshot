  # ARM-only observation experiment. No installer or 0.16 memory acceptance.
  editable-observation:
    if: ${{ contains(github.event.head_commit.message || '', '[editable-observation]') && !contains(github.event.head_commit.message || '', '[component-controls]') }}
    runs-on: macos-15
    # Sum of bounded stages fits with cleanup/upload headroom. This independent
    # diagnostic group neither cancels nor gates the normal release workflow.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
      - name: Check diagnostic contracts and record deliberately limited scope
        timeout-minutes: 2
        run: |
          mkdir -p dist
          python3 - <<'PYTHON'
          import json, os, platform
          from pathlib import Path
          if platform.machine() != 'arm64':
              raise SystemExit('This first diagnostic lane is ARM-only')
          Path('dist/editable-observation-scope.json').write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'], 'architecture': 'arm64',
              'diagnosticOnly': True, 'intelExecuted': False,
              'installerAcceptance': False, 'memoryStabilityAssessed': False,
              'productMemoryRemedyClaim': False, 'nativeDeadlineSeconds': 300,
              'ownedLaunchDeadlineSeconds': 600, 'baselineResourceCellExecuted': False,
              'scope': 'One exact signed installed app; separate certification, reference and candidate functional processes; conditional candidate 2+8 resources. Intel and baseline resources remain unrun.'
          }, indent=2) + '\n')
          PYTHON
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_check_editable*' -v 2>&1 | tee dist/editable-observation-contracts.log
          python3 -m unittest discover -s scripts/tests -p test_run_bounded_command.py -v 2>&1 | tee dist/editable-observation-bounded-runner.log
      - name: Package one signed app without creating user installers
        id: editable_observation_package
        timeout-minutes: 31
        env:
          PICSHOT_PACKAGE_APP_ONLY: '1'
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1800
          --log dist/editable-observation-package.log --report dist/editable-observation-package.json
          -- bash scripts/package.sh
      - name: Compile native normalization tests
        timeout-minutes: 10
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 540
          --log dist/editable-observation-test-build.log --report dist/editable-observation-test-build.json
          -- swift build --build-tests
      - name: Execute every discovered ManualScrollHashTests case exactly once
        timeout-minutes: 9
        run: |
          python3 scripts/run-bounded-command.py --timeout-seconds 60 --log dist/editable-observation-test-discovery.log --report dist/editable-observation-test-discovery.json -- swift test list --skip-build
          python3 scripts/run-bounded-command.py --timeout-seconds 420 --log dist/editable-observation-native-tests.log --report dist/editable-observation-native-tests.json -- swift test --skip-build --filter ManualScrollHashTests
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_cases', 'scripts/native-test-shards.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          inventory = Path('dist/editable-observation-test-discovery.log').read_text()
          expected = [name for name in native.discover(inventory) if name.split('/')[0] == 'PicShotTests.ManualScrollHashTests']
          native.need(bool(expected), 'No native normalization cases discovered')
          log = Path('dist/editable-observation-native-tests.log').read_text()
          process = json.loads(Path('dist/editable-observation-native-tests.json').read_text())
          native.need(process['status'] == 'exited' and process['termination_reason'] == 'exited'
                      and process['exit_code'] == process['child_returncode'] == 0
                      and process['timeout_seconds'] == 420 and not process['log_truncated'], 'Native process incomplete')
          passed, skipped = native.case_results(log, expected)
          native.need(not skipped, 'Normalization test skipped')
          Path('dist/editable-observation-native-check.json').write_text(json.dumps({
              'status': 'passed', 'sourceCommit': os.environ['GITHUB_SHA'], 'passedTests': passed,
              'nativeDiscoverySHA256': hashlib.sha256(inventory.encode()).hexdigest(),
              'logSHA256': hashlib.sha256(log.encode()).hexdigest(), 'memoryStabilityAssessed': False
          }, indent=2) + '\n')
          PYTHON
      - name: Relocate and verify the single exact signed ARM application
        timeout-minutes: 2
        run: |
          test ! -e dist/editable-observation-installed
          mkdir -p dist/editable-observation-installed
          ditto dist/PicShot.app dist/editable-observation-installed/PicShot.app
          codesign --verify --deep --strict dist/editable-observation-installed/PicShot.app
          test "$(lipo -archs dist/editable-observation-installed/PicShot.app/Contents/MacOS/PicShot)" = arm64
          python3 - <<'PYTHON'
          import hashlib, json, os, plistlib
          from pathlib import Path
          original = Path('dist/PicShot.app/Contents/MacOS/PicShot')
          installed = Path('dist/editable-observation-installed/PicShot.app')
          executable = installed / 'Contents/MacOS/PicShot'
          info = plistlib.loads((installed / 'Contents/Info.plist').read_bytes())
          expected = hashlib.sha256(original.read_bytes()).hexdigest()
          actual = hashlib.sha256(executable.read_bytes()).hexdigest()
          if expected != actual or info['PicShotSourceCommit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Installed binary/source mismatch')
          Path('dist/editable-observation-installed-identity.json').write_text(json.dumps({
              'sourceCommit': info['PicShotSourceCommit'], 'executableSHA256': actual,
              'bundlePath': str(installed.resolve()), 'architecture': 'arm64',
              'oneBinaryForEveryCell': True, 'installerAcceptance': False
          }, indent=2) + '\n')
          PYTHON
      - name: Certify every RGBA byte then compare two fresh functional processes
        id: editable_observation_functional
        timeout-minutes: 33
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 1890
          --log dist/editable-observation-functional.log --report dist/editable-observation-functional.json
          -- bash scripts/editable-observation-diagnostic.sh
          "$PWD/dist/editable-observation-installed/PicShot.app"
          "$PWD/dist/evidence/editable-observation" "$GITHUB_SHA" functional-comparison
      - name: Checkpoint functional evidence before the resource process
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Observation-Functional-arm64-${{ github.sha }}
          path: |
            dist/editable-observation-*.log
            dist/editable-observation-*.json
            dist/evidence/editable-observation/
            dist/PicShot.app/Contents/Resources/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Observe candidate two warmups and eight measured cycles after strict comparison
        if: ${{ success() && steps.editable_observation_functional.outcome == 'success' }}
        timeout-minutes: 11
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 630
          --log dist/editable-observation-resources.log --report dist/editable-observation-resources.json
          -- bash scripts/editable-observation-diagnostic.sh
          "$PWD/dist/editable-observation-installed/PicShot.app"
          "$PWD/dist/evidence/editable-observation" "$GITHUB_SHA" candidate-resources
      - name: Preserve diagnostic logs reports and native PNGs without installer publication
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-Editable-Observation-arm64-${{ github.sha }}
          path: |
            dist/editable-observation-*.log
            dist/editable-observation-*.json
            dist/evidence/editable-observation/
            dist/PicShot.app/Contents/Resources/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

