      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.package.outcome == 'success' }}
    - name: Verify actual ZIP extraction signatures all helpers and new package identity
      id: zip_identity
      timeout-minutes: 5
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, plistlib, subprocess, tempfile
        from pathlib import Path

        def need(value,message):
            if not value: raise ValueError(message)
        def sha(path):
            result=hashlib.sha256()
            with path.open('rb') as stream:
                for chunk in iter(lambda:stream.read(1024*1024),b''):result.update(chunk)
            return result.hexdigest()
        def run(*args):return subprocess.check_output(args,text=True,timeout=30).strip()
        def manifest(app):
            rows=[]
            for path in sorted(app.rglob('*')):
                relative=path.relative_to(app).as_posix()
                if path.is_symlink():
                    need(path.resolve().is_relative_to(app.resolve()),'Bundle symlink escapes application')
                    rows.append(dict(path=relative,link=os.readlink(path)))
                elif path.is_file():rows.append(dict(path=relative,bytes=path.stat().st_size,sha256=sha(path)))
            return rows
        root=Path('dist/experimental-installer227')
        identity=json.loads((root/'source-identity.json').read_text())
        need(run('git','rev-parse','HEAD','HEAD^{tree}').splitlines()==[identity['sourceCommit'],identity['sourceTree']], 'Product source identity changed')
        need(not run('git','status','--porcelain','--untracked-files=no'), 'Product source must remain clean')
        archive=Path('dist/PicShot-0.22.0-macos-arm64.zip')
        need(0<archive.stat().st_size<30*1024*1024,'Experimental ZIP must fit below30MiB, leaving transfer margin')
        with tempfile.TemporaryDirectory(prefix='experimental-zip-',dir=Path('dist').resolve()) as work:
            subprocess.run(['ditto','-x','-k',str(archive),work],check=True,timeout=60)
            app=Path(work)/'PicShot.app';need(app.resolve()==app,'Installed bundle path must be canonical')
            subprocess.run(['codesign','--verify','--deep','--strict',str(app)],check=True,timeout=30)
            info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
            build=json.loads((app/'Contents/Resources/build-info.json').read_text())
            need(info['PicShotSourceCommit']==build['sourceCommit']==identity['sourceCommit'],'Installed source mismatch')
            need(info['CFBundleVersion']==os.environ['GITHUB_RUN_NUMBER'],'New build number mismatch')
            need(info['CFBundleShortVersionString']==build['version']=='0.22.0' and build['architecture']=='arm64','Version/architecture mismatch')
            need(info['CFBundleExecutable']=='PicShot' and info['LSMinimumSystemVersion']=='14.0','Executable/minimum macOS mismatch')
            staged=Path('dist/PicShot.app');actual_manifest=manifest(app)
            need(actual_manifest==manifest(staged),'Extracted ZIP bundle differs from signed packaged bundle')
            binaries=['Contents/MacOS/PicShot']+['Contents/Helpers/'+name for name in ('PicShotMLHelper','PicShotCodecHelper','PicShotEraseHelper','PicShotFormulaRenderHelper')]
            executables=[]
            for relative in binaries:
                path=app/relative
                need(path.is_file() and run('lipo','-archs',str(path))=='arm64','Native executable missing or wrong architecture: '+relative)
                subprocess.run(['codesign','--verify','--strict',str(path)],check=True,timeout=30)
                dependencies=[]
                for line in run('otool','-L',str(path)).splitlines()[1:]:
                    linked=line.strip().split(' (',1)[0]
                    if linked.startswith(('/usr/lib/','/System/Library/')):resolved='system'
                    else:
                        if linked.startswith('@rpath/'):target=app/'Contents/Frameworks'/linked[len('@rpath/'):]
                        elif linked.startswith('@executable_path/'):target=path.parent/linked[len('@executable_path/'):]
                        elif linked.startswith('@loader_path/'):target=path.parent/linked[len('@loader_path/'):]
                        else:raise ValueError('Unapproved external runtime dependency: '+linked)
                        need(target.is_file() and target.resolve().is_relative_to(app),'Dependency missing or escaped bundle: '+linked)
                        resolved=str(target.relative_to(app))
                    dependencies.append(dict(linked=linked,resolved=resolved))
                executables.append(dict(path=relative,sha256=sha(path),architecture='arm64',signatureVerified=True,dependencies=dependencies))
            record=dict(status='passed',distribution='user-opted-experimental',userOptedExperimentalDistribution=True,
                sourceCommit=identity['sourceCommit'],sourceTree=identity['sourceTree'],version='0.22.0',buildVersion=info['CFBundleVersion'],architecture='arm64',
                installerAcceptance=False,fullMemoryQualification=False,testingPackageEligible=False,
                archivePath=str(archive),archiveBytes=archive.stat().st_size,archiveSHA256=sha(archive),
                exactExtractedBundleMatchesPackaged=True,bundleManifestSHA256=hashlib.sha256(json.dumps(actual_manifest,sort_keys=True).encode()).hexdigest(),
                executables=executables,bundleManifest=actual_manifest,signing='ad-hoc',notarized=False,
                unusedDMGGeneratedByOriginalPackageScript=True,dmgInstalledRouteExercised=False,dmgPublished=False)
            (root/'zip-package-identity.json').write_text(json.dumps(record,indent=2)+'\n')
        PYTHON
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.package.outcome == 'success' }}
    - name: Run every original installed-demo assertion while omitting only disputed resource cell
      id: installed_demo
      timeout-minutes: 14
      run: |
        set -euo pipefail
        picshot_demo_prefix=$(cat dist/experimental-installer227/installed-demo-prefix.sh)
        python3 scripts/run-bounded-command.py --timeout-seconds 780 --log dist/experimental-installed-demo.log --report dist/experimental-installed-demo.json -- bash -c "$picshot_demo_prefix" scripts/live-scroll-installed.sh "$PWD/dist/PicShot-0.22.0-macos-arm64.zip" "$PWD/dist/evidence/experimental-installed" "$PICSHOT_EXPERIMENT_SOURCE"
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.owned_target.outcome == 'success' &&
        steps.zip_identity.outcome == 'success' }}
    - name: Require exact reference output ordinary text reversal and axis movement on new ZIP
      id: demo_receipt
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib,json,os
        from pathlib import Path

        def need(value,message):
            if not value:raise ValueError(message)
        root=Path('dist/experimental-installer227');evidence=Path('dist/evidence/experimental-installed')
        source=json.loads((root/'source-identity.json').read_text());package=json.loads((root/'zip-package-identity.json').read_text())
        installed=json.loads((evidence/'package-identity.json').read_text());demo=json.loads((evidence/'demo/demo.json').read_text())
        need(installed['archiveSHA256']==package['archiveSHA256'],'Demo did not use this experimental ZIP')
        need(installed['sourceCommit']==source['sourceCommit'] and str(installed['build'])==os.environ['GITHUB_RUN_NUMBER'],'Demo identity differs')
        need(demo['status']=='passed' and demo['installerAcceptance'] is False,'Original native demo failed or promoted acceptance')
        need(demo['privateUserContent'] is False and demo['permissionRequested'] is False and demo['globalInputPosted'] is False,'Demo side effect boundary changed')
        comparisons={}
        for name in ('illustratedCase','ordinaryTextCase','movementCase'):
            case=demo[name];comparison=case['referenceComparison' if name=='movementCase' else 'nativeReferenceComparison']
            need(comparison['exactEquality'] is True and comparison['meanAbsoluteRGBAError']==0 and comparison['fractionOfChannelsDifferingByMoreThan8']==0,'Output is not exactly equal to independent reference: '+name)
            comparisons[name]=comparison
        need(demo['ordinaryTextCase']['addedAlignmentMarkers'] is False,'Ordinary-text case acquired artificial markers')
        need(demo['illustratedCase']['acceptedReverseObservations']>=2 and demo['illustratedCase']['extendedAfterReversal'] is True,'Reversal and extension incomplete')
        move=demo['movementCase']
        need(move['drag']['crossAxisUnchanged'] is True and move['drag']['sizeUnchanged'] is True and move['drag']['alongAxisDelta']==48,'Axis movement failed')
        need(move['moveAppliedThroughReturn'] is True and move['actualSourcePixelsChanged'] is True and move['matchedMoveDisplacement']==48,'Movement did not update source and resume')
        need(not (evidence/'resource').exists(),'Disputed resource cell must not run')
        record=dict(status='passed',distribution='user-opted-experimental',userOptedExperimentalDistribution=True,
            sourceCommit=source['sourceCommit'],sourceTree=source['sourceTree'],buildVersion=os.environ['GITHUB_RUN_NUMBER'],
            archiveSHA256=package['archiveSHA256'],installerAcceptance=False,fullMemoryQualification=False,testingPackageEligible=False,
            originalSelectedAssertionsPreserved=True,exactReferenceOutputs=comparisons,
            ordinaryText=True,reversalThenExtension=True,axisMovementAndResume=True,
            actualOwnedInstalledLaunch=True,realScreenCaptureAcceptance=False,
            observedRealStreamStatus=demo['realStream']['status'],observedRealScreenCaptureValidated=demo['realScreenCaptureValidated'],
            newBuildScope='Targeted rebuilt ZIP only; broad native/model/installed evidence is from original228/229 runs',
            stable214Unchanged=True,disputedResourceCellRerun=False)
        (root/'targeted-demo-receipt.json').write_text(json.dumps(record,indent=2)+'\n')
        PYTHON
      if: ${{ !cancelled() && steps.installed_demo.outcome == 'success' && steps.zip_identity.outcome == 'success'
        }}
    - name: Verify immutable product and prepare distinctly named experimental ZIP
      id: delivery_gate
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import hashlib,json,os,shutil,subprocess
        from pathlib import Path

        def need(value,message):
            if not value:raise ValueError(message)
        def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()
        root=Path('dist/experimental-installer227')
        source=json.loads((root/'source-identity.json').read_text());package=json.loads((root/'zip-package-identity.json').read_text())
        demo=json.loads((root/'targeted-demo-receipt.json').read_text())
        need(subprocess.check_output(['git','rev-parse','HEAD','HEAD^{tree}'],text=True,timeout=10).splitlines()==[source['sourceCommit'],source['sourceTree']],'Product identity changed')
        need(not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],timeout=10).strip(),'Product source no longer clean')
        need(sha(root/'experimental-workflow.yml')==source['workflowSHA256'],'Archived workflow changed')
        need(sha(root/'installed-demo-prefix.sh')==source['selectedPrefixSHA256'],'Selected original script prefix changed')
        for path,expected in source['originalScriptSHA256'].items():need(sha(Path(path))==expected,'Original script changed')
        archive=Path(package['archivePath']);need(sha(archive)==package['archiveSHA256'],'ZIP changed after actual installed verification')
        need(demo['status']=='passed' and demo['archiveSHA256']==package['archiveSHA256'],'Targeted gate incomplete')
        output=Path('dist/experimental-delivery');output.mkdir(parents=True,exist_ok=True)
        filename='PicShot-EXPERIMENTAL-0.22.0-build'+os.environ['GITHUB_RUN_NUMBER']+'-macos-arm64.zip'
        destination=output/filename
        shutil.copyfile(archive,destination)
        need(sha(destination)==package['archiveSHA256'] and destination.stat().st_size<30*1024*1024,'Delivery ZIP copy differs or exceeds bound')
        receipt=dict(status='ready-for-user-opted-experimental-distribution',distribution='user-opted-experimental',
            userOptedExperimentalDistribution=True,sourceCommit=source['sourceCommit'],sourceTree=source['sourceTree'],
            workflowCommit=source['workflowCommit'],workflowRunID=source['workflowRunID'],workflowRunAttempt=source['workflowRunAttempt'],
            version='0.22.0',buildVersion=os.environ['GITHUB_RUN_NUMBER'],architecture='arm64',file=filename,
            bytes=destination.stat().st_size,sha256=package['archiveSHA256'],installerAcceptance=False,
            fullMemoryQualification=False,testingPackageEligible=False,stable214Unchanged=True,
            resourceFailurePreserved=source['originalMemoryFailure'],realScreenCaptureAcceptance=False,
            adHocSigned=True,notarized=False,minimumMacOS='14.0',sharedPreferencesAndHistoryWithStable=True,
            dmgPublished=False,trackedSourceClean=True,runtimeOverlayApplied=False)
        (root/'experimental-delivery.json').write_text(json.dumps(receipt,indent=2)+'\n')
        (output/'experimental-delivery.json').write_text(json.dumps(receipt,indent=2)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as target:target.write('zip='+str(destination)+'\n')
        PYTHON
      if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.zip_identity.outcome == 'success' &&
        steps.demo_receipt.outcome == 'success' }}
    - name: Preserve separate bounded source and targeted demo evidence
      id: evidence_archives
      if: always()
      timeout-minutes: 3
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, zipfile
        from pathlib import Path
        root = Path('dist/experimental-installer227')
        root.mkdir(parents=True, exist_ok=True)
        target = Path('dist/experimental-installer227-artifacts'); target.mkdir(parents=True, exist_ok=True)
        groups = {'records': ['dist/experimental-installer227/', 'dist/native-dependencies-preflight.log', 'dist/native-dependencies-preflight-report.json', 'dist/package.log', 'dist/package-report.json', 'dist/experimental-owned-target.log', 'dist/experimental-owned-target.json', 'dist/experimental-installed-demo.log', 'dist/experimental-installed-demo.json'], 'demo': ['dist/experimental-installer227/source-identity.json', 'dist/experimental-installer227/zip-package-identity.json', 'dist/experimental-installer227/targeted-demo-receipt.json', 'dist/evidence/experimental-installed/']}
        budget = 31 * 1024 * 1024
        records = {}
        for name, inputs in groups.items():
            archive = target/(name+'.zip')
            record = dict(status='not-uploadable', inputs=inputs, archiveBudgetBytes=budget,
                maxInputBytes=256*1024*1024, maxFileCount=4096, rawReportsModified=False)
            records[name] = record
            try:
                candidates = []
                for entry in inputs:
                    path = Path(entry)
                    if path.is_symlink(): raise ValueError('Refuse symlink evidence root: '+str(path))
                    candidates.extend([path] if path.is_file() else path.rglob('*'))
                if any(file.is_symlink() or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage'))
                        for part in file.parts) for file in candidates):
                    raise ValueError('Refuse symlink, application, or compiled model evidence entry')
                files = sorted({file for file in candidates if not file.is_dir()})
                if not files or (name == 'demo' and not any(str(file).startswith('dist/evidence/experimental-installed/') for file in files)):
                    raise ValueError('No stage evidence files were produced')
                if len(files) > record['maxFileCount']: raise ValueError('Evidence file-count bound exceeded')
                total = 0
                for file in files:
                    if (file.is_symlink() or not file.is_file()
                            or not file.resolve().is_relative_to(Path('dist').resolve())
                            or any(part.lower().endswith(('.app', '.mlmodelc', '.mlpackage')) for part in file.parts)
                            or file.suffix.lower() in {'.dmg', '.zip', '.onnx', '.mlmodel', '.bin', '.weights', '.safetensors', '.pt', '.pth', '.ckpt', '.tflite', '.pb'}
                            or file.name.startswith('PicShot-')):
                        raise ValueError('Refuse nonregular, escaped, or installer evidence input: '+str(file))
                    total += file.stat().st_size
                record.update(fileCount=len(files), inputBytes=total)
                if total > record['maxInputBytes']: raise ValueError('Evidence input-byte bound exceeded')
                with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
                    for file in files:
                        output.write(file, file.as_posix())
                        if output.fp.tell() >= budget: raise ValueError('Compressed evidence exceeds31MiB')
                record['archiveBytes'] = archive.stat().st_size
                if record['archiveBytes'] >= budget: raise ValueError('Final evidence archive exceeds31MiB')
                record.update(status='ready', archive=str(archive), archiveSHA256=hashlib.sha256(archive.read_bytes()).hexdigest())
            except Exception as error:
                record['error'] = str(error)
                archive.unlink(missing_ok=True)
            with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                output.write(name+'='+str(record['status'] == 'ready').lower()+'\n')
        report = dict(distribution='user-opted-experimental', evidenceOnly=True, installerAcceptance=False, fullMemoryQualification=False,
            testingPackageEligible=False, sourceCommit=os.environ['PICSHOT_EXPERIMENT_SOURCE'],
            workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
            archiveBudgetBytes=budget, rawEvidencePreservedOnRunner=True, archives=records)
        (root/'evidence-archives.json').write_text(json.dumps(report, indent=2)+'\n')
        if any(record['status'] != 'ready' for record in records.values()):
            raise SystemExit('Some diagnostic evidence is absent or oversized; see evidence-archives.json')
        PYTHON
    - name: Require all targeted rebuilt ZIP gates while preserving failed qualification
      id: outcomes
      timeout-minutes: 2
      run: |
        python3 - <<'PYTHON'
        import json,os
        from pathlib import Path
        root=Path('dist/experimental-installer227');root.mkdir(parents=True,exist_ok=True)
        observed=json.loads(os.environ['PICSHOT_EXPERIMENT_STEPS']);required=json.loads(os.environ['PICSHOT_EXPERIMENT_REQUIRED'])
        outcomes={name:observed.get(name,{}).get('outcome','not-run') for name in required}
        ready=all(value=='success' for value in outcomes.values())
        record=dict(status='ready-for-user-opted-experimental-distribution' if ready else 'experimental-checks-incomplete-or-failed',
            distribution='user-opted-experimental',userOptedExperimentalDistribution=True,
            installerAcceptance=False,fullMemoryQualification=False,testingPackageEligible=False,
            stable214Unchanged=True,disputedResourceCellRerun=False,sourceCommit=os.environ['PICSHOT_EXPERIMENT_SOURCE'],
            sourceTree=os.environ['PICSHOT_EXPERIMENT_TREE'],workflowCommit=os.environ['PICSHOT_EXPERIMENT_WORKFLOW_SHA'],
            buildVersion=os.environ['GITHUB_RUN_NUMBER'],workflowRunID=os.environ['GITHUB_RUN_ID'],stageOutcomes=outcomes,
            unrunStages=[name for name,value in outcomes.items() if value in ('skipped','not-run')],
            failedStages=[name for name,value in outcomes.items() if value in ('failure','cancelled')],
            actualInstallerUploadPermitted=ready,actualInstallerUploadConfirmed=False)
        (root/'outcomes.json').write_text(json.dumps(record,indent=2)+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
            output.write('User-opted experimental rebuild of exact227; stable214 unchanged.\n\n')
            output.write('Original227 memory failure remains: installerAcceptance=false; fullMemoryQualification=false; testingPackageEligible=false.\n\n')
            output.write('New build identity and targeted installed ZIP demo only. Earlier broad evidence remains scoped to228/229.\n\n')
            for name,value in outcomes.items():output.write(name+': '+value+'\n\n')
        if not ready:raise SystemExit('One or more required experimental ZIP checks failed or did not run')
        PYTHON
      if: always()
      env:
        PICSHOT_EXPERIMENT_STEPS: ${{ toJSON(steps) }}
        PICSHOT_EXPERIMENT_REQUIRED: '["checkout_source227","provenance","codec_dependencies","package","owned_target","zip_identity","installed_demo","demo_receipt","delivery_gate","evidence_archives"]'
