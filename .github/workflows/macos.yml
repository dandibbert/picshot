      timeout-minutes: 24
      run: python3 scripts/run-bounded-command.py --timeout-seconds 1300 --log dist/effect-context-output-guards.log --report dist/effect-context-output-guards.json -- bash scripts/effect-context-output-guard.sh "$PWD/dist/effect-context-installed/PicShot.app" "$PWD/dist/evidence/effect-context-output-guards" "$GITHUB_SHA"
    - name: Compare only the Core Image render-task memory target
