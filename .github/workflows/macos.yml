      - name: Verify old and new decode contracts and controller boundaries
        id: diagnostic_tests
        timeout-minutes: 8
        run: >-
          python3 scripts/run-bounded-command.py --timeout-seconds 420
          --log dist/decode-large-tests.log --report dist/decode-large-tests-report.json
          -- swift test --skip-build --filter 'ImageDecode|ImageRasterMaterialization|CodecExportAttribution|ImageExportController|ImageExportLayout|ImageExportService|CodecExportProcess|CodecHelperLifecycle'
      - name: Repeat original small PNG decode comparison
        timeout-minutes: 8
        run: |
          set -o pipefail
