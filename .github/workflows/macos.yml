          record = dict(diagnosticOnly=True, installerAcceptance=False, sourceCommit=os.environ['GITHUB_SHA'],
              referenceCommit='a371ad60c8aec007482911b249dbeb03144b9486',
              steps=json.loads(os.environ['PICSHOT_NATIVE_DIAGNOSTIC_STEP_OUTCOMES']),
              observations=observations,
              observationScope='Native outcome and sample completeness are separate; missing/incomplete due captures are incomplete diagnostic evidence',
              baselineFailurePreserved=True, noInstallerArtifacts=True, noNativeRepartition=True,
              nativeSecondsPerProcess=420, processOrder=[0, 1, 2, 3],
              priorJobStateReplayed=False, observerMayPerturbTiming=True, originalBuild137FailureUnchanged=True, originalDiagnostic139FailureUnchanged=True, originalDiagnostic140FailureUnchanged=True, observerSelfTestRequired=True,
              eventualAcceptanceRequiresFrozenProductionWorkflow=True,
              scope='Independent ARM native timeout observations; no installed, Intel, or release acceptance')
          Path('dist/native-timeout-diagnostic/outcomes.json').write_text(json.dumps(record, indent=2)+'\n')
          PYTHON
      - name: Preserve all diagnostic logs reports and owned-process samples
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PicShot-DIAGNOSTIC-NONRELEASE-NativeTimeout-arm64-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/native-timeout-diagnostic/
            .build/native-codecs/logs/
            .build/native-codecs/evidence/
            .build/native-codecs/build-attempt-arm64.json
            .build/native-codecs/install/native-build.json
            .build/native-codecs/install/native-selftest-dependencies.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

