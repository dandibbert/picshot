          reviewed_owned_files = {'scripts/native-owned-xctest.py': 'da1d24aa1c21738e285cdbf9a6cbbbe2084dcb17dba1cc762ad7b5ca01d0161d',
              'scripts/tests/test_native_owned_xctest.py': 'a80a25135e3d4d0613fbd4ba9e781ff283631b69964c57ec55902c10dee9c474'}
          for name, expected in reviewed_owned_files.items():
              if hashlib.sha256((observer/name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Direct launcher files differ from the reviewed source')
          legacy_identity_helper = 'scripts/native-test-diagnostics.py'
          if hashlib.sha256((observer/legacy_identity_helper).read_bytes()).hexdigest() != '8439c941e72e0382ce4530f0c0ffc01fc03b6d672c93ec5c7cf55691cd3f49e5':
              raise SystemExit('Imported process identity utilities differ from unchanged source148')
          observer_files = {name.decode(): hashlib.sha256((observer/name.decode()).read_bytes()).hexdigest()
                            for name in sorted(allowed)}
          record = dict(schemaVersion=2, status='passed', diagnosticOnly=True, installerAcceptance=False,
              sourceCommit=product_source, sourceTree=product_tree, productWorkingDirectory=str(product),
              observerCommit=observer_source, observerTree=revision(observer, 'HEAD^{tree}'),
              observerWorkingDirectory=str(observer), observerReferenceCommit=observer_base,
              observerReferenceTree=observer_base_tree, observerChangedPaths=[path.decode() for path in changed],
              observerFileSHA256=observer_files, originalRunnerAndPlannerSHA256=tooling,
              originalProductTrackedEntries=len(entries(product, 'HEAD')), architecture=platform.machine(),
              installedDiagnosticDefinitionUnchanged=current_installed == original_installed,
              installedDiagnosticDefinitionSHA256=installed_definition_sha256, nonDiagnosticJobsAndRoutingUnchanged=True,
              productOverlayApplied=False, productTrackedCheckoutClean=True, observerTrackedCheckoutClean=True,
              workflowRunID=os.environ['GITHUB_RUN_ID'], workflowRunAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
              nativeProcessEnvironment={key: os.environ.get(key) for key in (
