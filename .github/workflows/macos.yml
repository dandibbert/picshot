          paths.update({name: app/name for name in ('Contents/MacOS/PicShot', 'Contents/Info.plist', 'Contents/Resources/build-info.json')})
          identities = {name: dict(bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest()) for name,path in paths.items()}
          Path('dist/evidence/installed-diagnostic/independent-package-identity.json').write_text(json.dumps(dict(
